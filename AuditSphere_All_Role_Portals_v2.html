utomation."}, {"kind": "paragraph", "text": "EQR branch. The firm determines EQR applicability under its quality-management policy. Where required, appoint an eligible reviewer, record their evaluation and cleared matters, and obtain completion before report release. EQR completion is not a replacement for partner responsibility and is not management's approval. [S10, S11]"}, {"kind": "paragraph", "text": "Final feedback loop. Partner/EQR raises matter → manager assigns rework → preparer revises → independent reviewer clears → manager re-approves → management re-approves if accounts changed → partner/EQR reconsider affected matters. The system prevents stale approvals from surviving a changed package."}, {"kind": "paragraph", "text": "Outputs and gate. Partner authorization + required EQR completion + approval manifest → Release authorized. A different person may perform administrative dispatch, but cannot replace or edit authorized content. For non-assurance services, an authorized service partner approves the deliverable with the appropriate conclusion language instead of an audit opinion."}]}, {"id": 13, "title": "13. Delivery, submission, billing, and file closure", "blocks": [{"kind": "heading", "text": "LC-24. Issue, deliver, and submit where contracted"}, {"kind": "paragraph", "text": "Required inputs. Release-authorized immutable package; recipient list; permitted channel; final report identifiers; delivery owner; approvals and manifest. Conditional inputs. Regulatory filing mandate, credentials held by an approved provider, filing format, submission deadline, wet-original handling, or translation approval. Optional inputs. Management letter, presentation meeting, supplementary schedules, and printed copies."}, {"kind": "paragraph", "text": "Mandatory steps. Verify package hashes against authorization; render/finalize the exact approved documents; apply final identifiers and signature evidence; record issue event; publish to restricted portal or approved delivery channel; notify recipients; track delivered, failed, viewed where supported, and acknowledged separately. Email delivery success is not proof that a person read the document."}, {"kind": "paragraph", "text": "Filing branch. Validate authority and schema → obtain required management/partner release → submit → record transaction/receipt ID → confirm accepted or rejected → resolve rejection → resubmit a versioned correction. A submission receipt does not necessarily equal regulator acceptance; preserve both states. Manual filing evidence is supported when no authorized API exists."}, {"kind": "paragraph", "text": "Transformation. Authorized report package → Issued package + delivery attempts + client acknowledgement + filing records. Audit working papers are excluded from client delivery unless release is expressly authorized under policy and law. Recipient changes require an access/authorization check."}, {"kind": "paragraph", "text": "Exceptions. Dispatch failures create retry tasks without changing the signed report. A content error discovered after issue requires controlled reissue under LC-26; replacing the portal file under the same version is not permitted."}, {"kind": "heading", "text": "13.1 Commercial billing runs in parallel"}, {"kind": "paragraph", "text": "BIL-01. Signed fee arrangements generate retainer, recurring, milestone, time-and-material, or final invoice schedules. Required inputs: firm office entity, bill-to client, engagement/service line, currency, fee basis, tax profile, due date, authorized billing contact, and approval. Time records capture staff, work date, task, duration, billability, and reviewer; expenses capture source receipt, amount, currency, purpose, recoverability, and approval."}, {"kind": "paragraph", "text": "BIL-02. Prepare WIP and invoice draft → manager reviews scope/fees → authorized billing approver approves → invoice issues → receipts match → ageing and collection follow-up. Discounts, credit notes, write-offs, refunds, and fee changes have separate approval thresholds and reasons. Payment-gateway callbacks must be authenticated and idempotent; the gateway result is reconciled to settlement/bank evidence."}, {"kind": "paragraph", "text": "BIL-03. Invoice/payment entries affect the firm's ledger only. A client's payment of fees is not client-service revenue in that client's books. Client ledger posting, when authorized, is a distinct payable/expense/payment workflow."}, {"kind": "paragraph", "text": "BIL-04. Commercial closure and professional closure are separate. Outstanding fees may trigger a permitted commercial hold under signed terms and applicable professional obligations, but cannot change an audit opinion or prevent required regulatory action. Closing or writing off a bill does not destroy the engagement file."}, {"kind": "heading", "text": "LC-25. Assemble, lock, retain, and renew the file"}, {"kind": "paragraph", "text": "Required inputs. Issued package; partner release; cleared review record; final workpaper index; source/TB/AJE lineage; communications; delivery evidence; archive policy; records owner. Conditional inputs. Filing acceptance; outstanding future-management actions; legal hold; permanent-file items; regulator inspection requirements."}, {"kind": "paragraph", "text": "Mandatory steps. Complete the administrative file-assembly checklist within the approved standards/jurisdiction deadline; verify all workpapers and evidence links; retain version and approval history; distinguish draft superseded artifacts from required evidence; create a manifest/checksum; lock the archive; restrict access; confirm backup and restore eligibility; record archive completion separately from report issue."}, {"kind": "paragraph", "text": "Retention. The approved policy determines category, start event, duration, permitted archival media, geography, access, legal holds, and disposition approval. A legal hold overrides normal deletion. The system shall not hard-code one retention duration for all services and jurisdictions."}, {"kind": "paragraph", "text": "Transformation. Completed engagement → locked archive + immutable manifest + permanent-file updates + next-year validation trigger + reusable structure. Only approved reusable structure rolls forward. Prior opinions, signatures, review clearances, and dates remain historical."}, {"kind": "paragraph", "text": "Renewal branch. Relationship owner reviews satisfaction, outstanding agreed actions, new service needs, next-period deadlines, and continuance date. Future recommendations become explicitly scoped tasks or new opportunities, not unbilled assumed obligations. Archived engagement remains read-only while a new engagement receives a new ID."}, {"kind": "heading", "text": "LC-26. Post-issue changes, suspension, termination, and handover"}, {"kind": "paragraph", "text": "Reopening inputs. Original issued/archived package; reason; discovered fact/change; affected entities/periods; proposed action; authorized partner; retention/legal requirements. Reopening is approved, time-limited, and scoped. Preserve original issue; create a new version; reperform affected procedures, reviews, management approvals, and partner/EQR checks; mark supersession; issue a new delivery/filing record. Previously issued copies remain discoverable with their status."}, {"kind": "paragraph", "text": "Suspension inputs. Reason, scope, start date, client communication, deadlines, billing treatment, responsible owner, and restart conditions. Suspend selected services rather than all entities unless required. Disable new processing where instructed but preserve records and required access. Restart requires verification that conditions and acceptance/terms remain valid."}, {"kind": "paragraph", "text": "Termination inputs. Client/firm request, authorized decision, legal/contractual basis, effective date, outstanding work/deadlines, handover recipient, retention obligations, and access plan. Partner approves professional disposition; billing resolves commercial balances separately; records staff prepare an authorized handover."}, {"kind": "paragraph", "text": "Mandatory handover. Identify documents owned by the client versus firm workpapers; obtain release authority; export approved books, mappings, relevant documents, and manifest; verify recipients; deliver securely; obtain receipt where possible; revoke portal/API/third-party access at the approved effective time; cancel future jobs and invitations; preserve legally required records; record final relationship status."}, {"kind": "paragraph", "text": "Deletion branch. Retention expiry creates a disposition request; legal hold and policy are checked; authorized records approver approves; data and derived search/cache copies are disposed of according to policy; a minimal disposition certificate remains. Backup expiry and any restored-data suppression are handled under the approved backup policy. Termination does not equal immediate deletion."}]}, {"id": 14, "title": "14. Data transformation and approval matrix", "blocks": [{"kind": "table", "rows": [["Transition", "Transformation and source of truth", "Required gate"], ["Inquiry → Lead", "Raw submission retained; normalized contact/service metadata created", "Assignment and duplicate assessment"], ["Lead → Qualified opportunity", "Discovery creates scoped service/entity brief", "Manager scope validation"], ["Evaluation → Accepted prospect", "Answers/evidence produce versioned acceptance decision", "Compliance review and partner acceptance"], ["Proposal → Signed engagement", "Accepted version generates consistent contractual terms", "Authorized client/firm signing"], ["Lead → Client", "Mapped fields become client/entity/contact records; original link retained", "Onboarding verification"], ["Contract → Engagement", "Service lines instantiate project, tasks, PBC, team, timetable", "Current acceptance, terms, permissions"], ["Prior year → New year", "Snapshot comparison creates changed obligations and new engagement", "Continuance approval"], ["Upload → Accepted evidence", "Bytes remain immutable; derivatives retain parser/source lineage", "Administrative and technical acceptance"], ["Source TB → Approved TB", "Parsed/normalized rows and mappings form a snapshot", "Row checks and independent control-total review"], ["Finding → Adjustment", "Workpaper exception produces balanced AJE and impact analysis", "Technical/management approvals as applicable"], ["Journal → Ledger", "Approved journal posts atomically with source key", "Open period and independent approval"], ["TB + AJEs → Adjusted TB", "Include only adjustments not already represented in source", "Reconciliation and manager approval"], ["Adjusted TB → Statements", "Mapping and disclosure rules generate versioned report lines", "Numeric/disclosure review"], ["Workpaper → Cleared file", "Responses/new evidence resolve independent review notes", "Checker clearance then manager approval"], ["Draft → Issued report", "Approved statements and partner conclusion form frozen package", "Management approval, partner release, required EQR"], ["Issued → Archived", "Assembly and manifest preserve approved evidence lineage", "Records completion and archive lock"], ["Archived → Reissued", "New fact creates linked revised package; original retained", "Reopened review and full affected reauthorization"]]}, {"kind": "paragraph", "text": "At every row, both the old and new object IDs, versions, actor, time, policy, and correlation ID are recorded. The interface offers forward/backward navigation along the chain without granting access outside the user's authorized scope."}]}, {"id": 15, "title": "15. Approval gates and closure checklist", "blocks": [{"kind": "paragraph", "text": "G01 — Acceptance. Applicable intake/evidence, conflicts, independence, capacity, and conditions reviewed; partner decision recorded."}, {"kind": "paragraph", "text": "G02 — Activation. Current acceptance, signed terms, entity/period/mode, authorized contacts, team, and required commercial conditions verified."}, {"kind": "paragraph", "text": "G03 — Planning. Applicable scope, strategy, materiality, timetable, work programs, and EQR/specialist decisions approved."}, {"kind": "paragraph", "text": "G04 — Financial intake. Source validity, debit/credit totals, period/entity, mapping, duplicates, and opening/comparative bridges reviewed."}, {"kind": "paragraph", "text": "G05 — Production complete. Reconciliations and procedures completed; required queries resolved; AJEs and unadjusted differences have reviewed treatment; adjusted TB approved."}, {"kind": "paragraph", "text": "G06 — Senior clearance. Evidence, calculations, references, and conclusions reviewed; blocking notes cleared by eligible checkers."}, {"kind": "paragraph", "text": "G07 — Manager completion. Significant judgments, consistency, disclosure, scope completion, and summary memorandum approved."}, {"kind": "paragraph", "text": "G08 — Management approval. Authorized management approves its statements/adjustments and supplies required representations; exact versions recorded."}, {"kind": "paragraph", "text": "G09 — Professional release. Partner approves report/conclusion; required EQR and consultations complete; no stale approvals or outstanding blocking matters."}, {"kind": "paragraph", "text": "G10 — Delivery/filing. Released manifest matches dispatched content; recipient authority and submission evidence verified; failures remain tracked."}, {"kind": "paragraph", "text": "G11 — Archive. Administrative assembly, retention classification, legal holds, manifest, restricted access, and next-year trigger completed."}, {"kind": "paragraph", "text": "G12 — Reopen/offboard. Authorized reason and scope; records preserved; affected approvals rerun; handover/access/retention actions verified."}, {"kind": "paragraph", "text": "No gate shall be represented only by a free-text comment or editable “approved” checkbox. Approval decisions are append-only events with version binding. A rejected decision returns a reason and exact required next actions."}]}, {"id": 16, "title": "16. Communication, reminders, and task automation", "blocks": [{"kind": "paragraph", "text": "AUT-01. Use native Perfex assignment, task, project, contract, proposal, and scheduled-notification capabilities where they satisfy requirements. Implement professional gates and conditional workflows in the STE extension. Hooks are integration points, not proof of a built-in universal workflow engine. [S6]"}, {"kind": "paragraph", "text": "AUT-02. Publish events including LeadCaptured, EvaluationSubmitted, AcceptanceApproved, TermsExecuted, ClientActivated, EngagementCreated, ContinuanceDue, DocumentAccepted, ImportValidated, TBApproved, JournalApproved, JournalPosted, WorkpaperSubmitted, ReviewPointRaised, ReviewPointCleared, PackageChanged, ManagerApproved, ManagementApproved, PartnerAuthorized, EQRCompleted, ReportIssued, FilingAccepted, EngagementArchived, and AccessRevoked."}, {"kind": "paragraph", "text": "AUT-03. Event handlers are idempotent and scope-aware. Conditions are evaluated from persisted approved records, not from the event name alone. Jobs use bounded retries, error classification, a failed-job queue, an operations owner, and manual replay. Replay shall not bypass a gate."}, {"kind": "paragraph", "text": "AUT-04. Recommended operational defaults: inquiry response within one working day; acknowledgement immediately after accepted submission; PBC reminder seven days before and on due date; overdue escalation after three working days; review reminders one working day before due; annual validation 90 days before year-end. These are configurable service targets, not statutory deadlines. Staff absence, holidays, and escalation delegates are applied explicitly."}, {"kind": "paragraph", "text": "AUT-05. Notification templates identify record reference, requested action, owner, and deadline, with an authenticated link. They do not include identity documents, complete financial statements, restricted assessments, or bearer access tokens in notification text. Delivery channels, consent and opt-out rules, retries, and message history are recorded."}, {"kind": "paragraph", "text": "AUT-06. Project/task templates shall define prerequisites, M/C/O applicability, input checklist, output artifact, role, estimated effort, relative dates, review gate, and recurrence. Completing a task cannot post journals, approve audit opinions, or issue reports unless a separately authorized command passes its own gate."}]}, {"id": 17, "title": "17. Service-specific workflows retained from the codebase", "blocks": [{"kind": "paragraph", "text": "The following twelve catalogue entries preserve the codebase's intended service coverage. Their task definitions are configurable templates; the target requirements extend them with explicit inputs, review, and deliverables. Not every service uses a TB or financial-statement audit. All services use the common acceptance, terms, access, versioning, review, release, and retention controls. [S2]"}, {"kind": "heading", "text": "17.1 External audit"}, {"kind": "paragraph", "text": "M inputs: approved audit terms, entity/period, reporting framework, management responsibility, TB/GL, statements, and evidence relevant to scoped assertions. C inputs: inventory attendance, confirmations, group components, specialists, and EQR. O inputs: agreed management presentation."}, {"kind": "paragraph", "text": "M processing: strategy and materiality → inventory/cash/banks/receivables/payables/revenue/expenses/assets/payroll/investments/related-party procedures as applicable → fraud considerations and subsequent events → adjustments and completion → statements/report. The optional expansion to a forensic investigation requires separate authority."}, {"kind": "paragraph", "text": "Output and approval: supported audit opinion/report and required communications; senior → manager → management approval of accounts → partner and required EQR → authorized issue. Client management cannot select the opinion by acceptance button."}, {"kind": "heading", "text": "17.2 Internal audit"}, {"kind": "paragraph", "text": "M inputs: charter/terms, process scope, policies, process owners, control descriptions, relevant populations, and reporting sponsor. C inputs: system access, regulated controls, specialist procedures. O inputs: data analytics and workshops."}, {"kind": "paragraph", "text": "M processing: planning → controls/fraud assessment → process and transaction testing → documented observations → factual validation → management actions with owners/dates → independent conclusion → follow-up plan. Cover inventory, banking, receivables, payables, revenue, procurement, assets, payroll, investments, related parties, and policy compliance only where scoped."}, {"kind": "paragraph", "text": "Output and approval: internal-audit report, control findings, agreed actions, and follow-up status. Process-owner response does not delete the auditor's finding. Manager and authorized assurance lead approve release; follow-up independently verifies closure evidence."}, {"kind": "heading", "text": "17.3 Business valuation"}, {"kind": "paragraph", "text": "M inputs: subject/legal interest, valuation date, purpose, intended users, basis/premise, historical financials, ownership/capital structure, and management assumptions. C inputs: forecasts, asset valuations, debt, discount-rate inputs, market comparables. O inputs: sensitivity cases and site visits."}, {"kind": "paragraph", "text": "M processing: preliminary research → framework → financial/operational/market data collection → normalization of financials → ratio analysis → selection and application of valuation methods → sensitivities → reconciliation of approaches → report."}, {"kind": "paragraph", "text": "Output and approval: versioned valuation model and report with assumptions, limitations, and supporting sources. Independent model reviewer checks inputs/formulas; specialist/partner approves conclusion; management confirms factual inputs, not the independent valuation outcome."}, {"kind": "heading", "text": "17.4 Feasibility study"}, {"kind": "paragraph", "text": "M inputs: proposed venture, objectives, scope, market, capital/operating assumptions, financing plan, timeframe, and decision criteria. C inputs: technical design, environmental/social requirements, permits, and staffing assumptions. O inputs: alternative locations or technology options."}, {"kind": "paragraph", "text": "M processing: preliminary research → market, technical, financial, organizational, environmental/social analysis where applicable → scenario and sensitivity analysis → implementation dependencies → recommendation."}, {"kind": "paragraph", "text": "Output and approval: study, financial model, assumption register, options and recommendation. Domain specialists review their sections; manager integrates findings; engagement partner approves release. Forecasts are labelled as assumptions-based rather than guaranteed outcomes."}, {"kind": "heading", "text": "17.5 Forensic audit / investigation"}, {"kind": "paragraph", "text": "M inputs: written authority, allegation/question, scope, authorized custodians, evidence sources, handling rules, legal liaison where required, and permitted reporting recipients. C inputs: legal hold, interview authority, forensic specialist, regulator reporting requirements. O inputs: advanced analytics."}, {"kind": "paragraph", "text": "M processing: plan → collect/preserve evidence → record chain of custody → analyze records → evaluate indicators → authorized interviews → corroborate findings → document limitations and factual conclusions → legal/technical review → restricted report."}, {"kind": "paragraph", "text": "Output and approval: evidence register, reproducible analyses, interview records, and authorized report. Access and exports are exceptionally restricted. Professional conclusions distinguish evidence, inference, and unresolved facts. No routine client portal disclosure of protected investigation content."}, {"kind": "heading", "text": "17.6 Financial forecasting and projections"}, {"kind": "paragraph", "text": "M inputs: forecast objective/horizon, historical data, model owner, assumptions, business drivers, finance terms, and selected scenarios. C inputs: capex, working capital, tax, FX, funding and covenant assumptions. O inputs: sensitivity and stress cases."}, {"kind": "paragraph", "text": "M processing: scope/data plan → historical review → assumptions evaluation → methodology → model inputs/calculations → integrated forecast statements and cash needs → scenario review → findings."}, {"kind": "paragraph", "text": "Output and approval: forecast model, assumption register, projected statements/cash requirements, and report. Management owns assumptions; independent reviewer validates calculation and consistency; service partner approves report language. An assurance conclusion is included only under separately authorized assurance terms."}, {"kind": "heading", "text": "17.7 AML compliance review"}, {"kind": "paragraph", "text": "M inputs: jurisdiction/profile, regulated activities, policies, customer population, due-diligence records, monitoring procedures, training and records-retention evidence. C inputs: restricted reporting processes, investigation records, and regulatory authorizations. O inputs: system effectiveness analytics."}, {"kind": "paragraph", "text": "M processing: plan → policies/controls review → CDD/KYC sampling → monitoring review → reporting-process evaluation → training/recordkeeping assessment → findings/actions → follow-up. The template's suspicious-activity-reporting task means assess or perform only the separately authorized legal role; it is not an automatic report to authorities."}, {"kind": "paragraph", "text": "Output and approval: restricted compliance review, findings and action plan. Compliance specialist and engagement lead approve; management receives only legally permitted content. Confidential reporting and anti-tipping-off restrictions are represented in access and communication policy."}, {"kind": "heading", "text": "17.8 Management consulting"}, {"kind": "paragraph", "text": "M inputs: business problem, scope, stakeholders, baseline measures, target outcomes, data sources, and decision owner. C inputs: organizational, strategic, operational, financial, market, or change-management data. O inputs: implementation coaching."}, {"kind": "paragraph", "text": "M processing: organizational analysis → option/strategy development → operational/financial evaluation → performance measures → recommendations → agreed implementation support → outcome tracking."}, {"kind": "paragraph", "text": "Output and approval: assessment, roadmap, action owners, and success measures. Manager/partner review recommendations; client management approves its implementation decisions. Consulting participation shall not silently transfer management responsibility to an audit team."}, {"kind": "heading", "text": "17.9 Fixed-asset verification and tagging"}, {"kind": "paragraph", "text": "M inputs: asset register, locations, custodians, ownership evidence, count cut-off, tagging scheme, and reconciliation basis. C inputs: leased assets, disposals, depreciation/valuation policies, and specialist valuations. O inputs: barcode/RFID/mobile capture."}, {"kind": "paragraph", "text": "M processing: scope and register acquisition → location/count plan → categorization → physical verification/tagging → reconcile existence and register completeness → investigate differences → validate authorized valuation/depreciation scope → report/update proposals."}, {"kind": "paragraph", "text": "Output and approval: verified asset listing, tag register, exception schedule, and report. Register amendments require client authorization and accounting review. A tagging exercise does not, by itself, provide a fair-value opinion."}, {"kind": "heading", "text": "17.10 Inventory management audit"}, {"kind": "paragraph", "text": "M inputs: inventory records, sites, count instructions/cut-off, control procedures, valuation policies, and movement history. C inputs: third-party stocks, consignment, work-in-progress, obsolescence, and costing data. O inputs: cycle-count analytics."}, {"kind": "paragraph", "text": "M processing: planning → process/control review → count observation/testing → quantity reconciliation → valuation/costing review → turnover/efficiency and loss-prevention assessment → compliance evaluation → recommendations."}, {"kind": "paragraph", "text": "Output and approval: count/valuation exceptions, control findings, authorized adjustment proposals, and scoped report. Recounts and unresolved stock movements remain tracked; reviewers approve conclusions before client release."}, {"kind": "heading", "text": "17.11 ERP implementation and review"}, {"kind": "paragraph", "text": "M inputs: business requirements, process owners, system landscape, selection criteria, data inventory, access/security needs, migration scope, and acceptance criteria. C inputs: procurement authority, vendor contract, interfaces, segregation-of-duties rules, and cutover permissions. O inputs: phased rollout or independent post-implementation review."}, {"kind": "paragraph", "text": "M processing: plan → selection/contracting → design/configuration → migration/integration → testing/UAT → training → authorized go-live → stabilization → independent review where scoped."}, {"kind": "paragraph", "text": "Output and approval: requirements/design, configuration and mapping records, test results, migration reconciliation, training/handover, and review report. Client process owners approve business decisions and UAT; technical release authority approves deployment. Implementation work and subsequent assurance require independence assessment and appropriate separation."}, {"kind": "heading", "text": "17.12 Corporate training on IFRS and IAS"}, {"kind": "paragraph", "text": "M inputs: audience, needs assessment, learning objectives, selected standards/topics, delivery mode, schedule, materials owner, and assessment approach. C inputs: jurisdiction-specific material, accessibility/language needs, venue, and certification criteria. O inputs: case studies, workshops, follow-up coaching."}, {"kind": "paragraph", "text": "M processing: needs assessment → objectives → material preparation/technical review → logistics → instruction → practical exercises → questions → assessment and feedback → completion records."}, {"kind": "paragraph", "text": "Output and approval: reviewed materials, attendance, assessment results, and participation/completion certificate where criteria are met. Certificates shall not imply statutory accreditation not granted by an authorized body. Training lead and technical reviewer approve materials; attendance does not trigger an audit opinion workflow."}, {"kind": "heading", "text": "17.13 Additional accounting practice templates"}, {"kind": "paragraph", "text": "Recurring bookkeeping: source documents/transactions → posting and bank/control reconciliations → monthly close → management accounts → manager review → client delivery. Each month has an explicit period and close checklist."}, {"kind": "paragraph", "text": "Annual accounts/compilation: approved TB and policies → adjustments → statements/notes → management approval → appropriate compilation/non-assurance report where required. No audit assurance is implied."}, {"kind": "paragraph", "text": "Review engagement: approved terms and applicable review standard → inquiry/analytical and additional required procedures → reviewed statements and limited-assurance conclusion where applicable. Do not substitute an external-audit checklist without tailoring."}, {"kind": "paragraph", "text": "Agreed-upon procedures: named users/purpose, agreed procedures and acceptance → exact procedures performed → factual findings report. The report does not express an audit opinion or assurance conclusion unless separately scoped."}, {"kind": "paragraph", "text": "Tax compliance: applicable registrations/rules, TB, tax records → book-to-tax adjustments → computation/return → technical review → client authorization → submission/acceptance → payment instruction and receipt reconciliation. A payment instruction is not bank execution authority."}, {"kind": "paragraph", "text": "Payroll administration: authorized employee changes, approved pay rules/time/benefits → gross-to-net calculation → independent review → client payroll approval → authorized export → payment/filing evidence → payroll/GL reconciliation. Payroll confidentiality and access are separately scoped."}]}, {"id": 18, "title": "18. Complete target architecture", "blocks": [{"kind": "heading", "text": "18.1 Architectural approach and system boundary"}, {"kind": "paragraph", "text": "ARC-01. Modular application. The target shall use a modular monolith around the Perfex CRM application, with explicit domain services for practice workflow, client accounting, workpapers, and delivery. The existing PHP/CodeIgniter and MySQL deployment model is the integration baseline. Runtime, framework, database, and module versions shall be selected through a documented supported-version compatibility matrix; the source snapshot version is not a requirement to remain on that version. A separate frontend framework or microservice platform is not required to implement this specification."}, {"kind": "paragraph", "text": "ARC-02. Extension boundary. STE functionality shall be packaged through supported modules, hooks, versioned migrations, services, and adapters. Controllers shall handle authentication, authorization, request validation, and response formatting; application services shall enforce transitions; repositories shall enforce scoped persistence. Templates shall render already-authorized view models and shall not implement accounting calculations or approval decisions. Perfex's module and hook mechanisms provide the extension basis. [S6, S12]"}, {"kind": "paragraph", "text": "ARC-03. Accounting boundary. The practice's own invoices, payroll, expenses, receipts, and financial statements shall belong to the OFFICE ledger. Client accounting shall belong to explicit CLIENT_ENTITY ledgers. A CRM customer reference on an office sales invoice identifies the fee payer; it does not cause that invoice to become an entry in the customer's books. Transactions between the two accounting contexts require separate, explicitly authorized entries and reconciliation references."}, {"kind": "paragraph", "text": "ARC-04. Single posting authority. Each accounting entity/book shall have exactly one authoritative posting service and an explicit operating mode. GreenTech capabilities shall be accessed through a verified adapter contract when used. For client books, the deployment shall provide an entity-scoped ledger extension or separately isolated accounting instances that satisfy the same contract. The selected implementation must pass all entity-isolation and accounting tests before activation. Native and custom posting routines shall not both process the same source event."}, {"kind": "paragraph", "text": "ARC-05. Engagement versus legal entity. An engagement groups professional work and deliverables. It is not a substitute for a legal-entity ledger. Several engagements may reference one approved entity-period dataset, while one group engagement may reference several entities only through an explicitly configured consolidation scope. An entity's accounts and transactions persist across engagements and periods without copying them into unrelated clients."}, {"kind": "heading", "text": "18.2 System context"}, {"kind": "paragraph", "text": "Prospect                 Client contacts              Firm staff\n   |                           |                         |\nPublic intake          Authenticated client portal    Staff workspace\n   |                           |                         |\n   +---------------------------+-------------------------+\n                               |\n                   Identity and authorization\n                               |\n           Perfex commercial and engagement application\n                               |\n     +-------------------------+-------------------------+\n     |                         |                         |\nPractice workflow      Accounting and reporting    Audit workpapers\nAcceptance/renewal     Entity books/TB/adjustments  Planning/review\n     |                         |                         |\n     +-------------------------+-------------------------+\n                               |\n              Versioned evidence, approvals, and delivery\n                               |\n         Scoped database | Private documents | Event outbox\n                               |\n    Authorized adapters: email, identity, accounting, storage,\n    bank feeds, e-signature, and jurisdiction filing services"}, {"kind": "paragraph", "text": "External systems are optional integrations unless an engagement explicitly requires them. An unavailable adapter shall create a visible pending/failed job or manual completion task; it shall not imply that a document was received, a transaction posted, a report delivered, or a filing accepted."}, {"kind": "heading", "text": "18.3 Logical components and ownership"}, {"kind": "table", "rows": [["Component", "Authoritative responsibilities", "Interfaces and storage boundary"], ["Perfex commercial core", "Leads, contacts, customers, commercial proposals, contracts, firm invoices, expenses and receipt references", "Core models and supported hooks; office bookkeeping only"], ["STE practice workflow", "Acceptance, continuance, service catalogue, questionnaires, assignments and client status", "Structured workflow records; versioned questionnaire and policy definitions"], ["STE engagement domain", "Engagement scope, periods, milestones, service task templates, strategy, summary and opinion documents", "Links to Perfex projects/tasks; authoritative professional state and deliverable registry"], ["STE financial domain", "Entity/book setup, external TB staging, mappings, adjustments, reporting snapshots, consolidation scope", "Scoped financial schema and posting/reporting contracts; no shared implicit client context"], ["Accounting adapter", "Chart of accounts, authorized journals, transaction import, bank/reconciliation and report data exchange", "Official module or approved external ledger integration; idempotent source references"], ["Workpaper and review service", "Evidence references, tests, conclusions, notes, reviewer assignment, version-bound sign-offs", "Workpaper versions, review notes, approval decisions and dependency links"], ["Document service", "Original files, derivative previews, metadata, versioning, permissions, legal hold and retention", "Private object storage or approved document provider; database holds metadata and hashes"], ["Workflow and job service", "Transition validation, reminders, template instantiation, background processing and retries", "Transactional outbox, job records and execution history"], ["Reporting and delivery", "Statements, notes, package manifests, issue authorization, portal delivery and acknowledgements", "Read-only scoped projections, immutable issued artifacts and dispatch records"], ["Integration gateway", "OAuth credentials, provider mappings, webhooks, external submissions and status verification", "Secret references and integration configuration; no credentials in business documents"], ["Administration and operations", "Access policy, reference data, configuration versions, release controls, monitoring and restore", "Separate administration permissions and auditable configuration changes"]]}, {"kind": "paragraph", "text": "Module names such as ste_practice, ste_engagement, and ste_financial are proposed implementation namespaces, not assertions that these packages already exist. Closely related domains may share a module while retaining these ownership boundaries."}, {"kind": "heading", "text": "18.4 Data and persistence architecture"}, {"kind": "paragraph", "text": "ARC-06. Transaction store. The relational database shall store client/entity identity, engagement configuration, questionnaire snapshots, structured workpapers, ledger data where managed locally, import batches, approval decisions, document metadata, and outbox records. Every business table shall have its declared scope, key, foreign keys, lifecycle status, concurrency version, and retention classification."}, {"kind": "paragraph", "text": "ARC-07. Evidence store. Original and issued document bytes shall be stored privately, outside source control and outside anonymous web access. A document record shall resolve to an opaque storage key, version, content hash, byte length, media type, owner scope, and retention class. A provider's URL is not itself an authorization decision. Expiring download links shall be issued only after a new permission check."}, {"kind": "paragraph", "text": "ARC-08. Read models. Dashboards and financial reports may use indexed views, materialized summaries, or caches. Cache keys shall include practice, legal entity, book, period, snapshot version, currency, and applicable permission scope. Financial read models shall be reproducible from the authoritative transaction/snapshot records. Cached reports shall never become a second editable ledger."}, {"kind": "paragraph", "text": "ARC-09. Audit events. Record creation, sensitive access, status changes, approvals, downloads, mapping changes, postings, reversals, delivery, reopening, and administrative actions shall emit attributable events. Events shall include an event ID, actor, service identity where applicable, action, object/version, scope, timestamp, correlation ID, and outcome. Protect audit events against ordinary application editing and retain their relationship to source evidence."}, {"kind": "paragraph", "text": "ARC-10. Consistency. Operations that must succeed together shall share a database transaction. External calls shall follow committed outbox events, not hold database transactions open. Long-running operations shall expose progress and final results; retries shall not duplicate journals, approval records, client conversions, or delivery packages. A posted journal, its lines, source link, numbering, and posting event shall commit atomically."}, {"kind": "heading", "text": "18.5 Deployment architecture"}, {"kind": "paragraph", "text": "Internet / approved internal access\n              |\nTLS gateway and request protection\n              |\n       Application instances\n  Perfex + STE modules + authorization\n       |                 |\n Private SQL          Private document storage\n       |\n Transaction outbox --> Background workers\n                            |\n             PDF rendering / import / notifications\n                            |\n                 Approved external services\n\nSeparate operational services:\nSecret store | Monitoring | Encrypted backups | Restore environment"}, {"kind": "paragraph", "text": "ARC-11. Environment separation. Development, test, staging, and production shall use separate configuration, identities, storage, and databases. Development and automated tests shall use synthetic or approved de-identified data. Production integrations shall be disabled in non-production by default. Email/filing/payment integrations in tests shall use sandbox recipients and endpoints."}, {"kind": "paragraph", "text": "ARC-12. Scaling. Web requests shall not wait for large imports, document generation, or bulk notifications. Workers shall scale independently where needed. Scheduled jobs shall use a lock/lease so the same schedule occurrence cannot be executed concurrently. Shared sessions, file storage, and cache configuration shall support multiple web instances when that topology is enabled."}, {"kind": "paragraph", "text": "ARC-13. Operations. Backups shall cover database records, document versions, encryption-key dependencies, configuration, and recovery instructions. Restore verification shall confirm data/document referential integrity and report reproducibility. Monitoring shall distinguish user-facing failures, queued jobs, external-provider failures, and processing timeouts without exposing document contents or secrets."}, {"kind": "heading", "text": "18.6 Financial lineage and assurance boundary"}, {"kind": "paragraph", "text": "Managed books:\nAuthorized source transaction -> Approved journal -> Posted GL\n                                      |\n                                      v\n                         Ledger snapshot / trial balance\n                                      |\nExternal books:                       |\nClient TB -> Validated immutable source TB\n                |                     |\n                +--> Reporting adjustments / mapping\n                                      |\n                             Adjusted reporting TB\n                                      |\n              Lead schedules -> Statements -> Notes\n                                      |\n                Review -> Management approval -> Partner gate\n                                      |\n                        Immutable issued package"}, {"kind": "paragraph", "text": "The external client's accounting system remains authoritative unless the mandate explicitly delegates bookkeeping to the firm. A reporting adjustment shall not silently write back to that system. An auditor's proposed adjustment requires management's decision and, where posted externally, verified posting evidence. For a later TB containing that adjustment, the system shall reconcile and retire the corresponding reporting-layer duplication through an approved superseding version, preserving its history."}]}, {"id": 19, "title": "19. Domain data model and field-level requirements", "blocks": [{"kind": "heading", "text": "19.1 Common field contract"}, {"kind": "paragraph", "text": "DATA-01. Every mutable domain record shall include an immutable identifier, practice identifier, applicable client/entity/engagement/period identifiers, current status, creation/update actor and timestamp, and concurrency version. The server shall derive authorized scope from identity and persisted relationships. A user-supplied entity or approver ID shall never override this check."}, {"kind": "paragraph", "text": "DATA-02. Required fields shall be validated when the relevant transition is requested. Drafts may be incomplete and shall show missing requirements. Conditional fields shall declare their triggering condition and validation rule. Optional fields may remain null and shall not be replaced by fabricated values, zero, or an empty reference record. Dates, monetary amounts, identifiers, and free-text explanations shall have different types and validation rules."}, {"kind": "paragraph", "text": "DATA-03. Use decimal arithmetic for money and percentages; preserve source precision and currency. Reporting rounding is separate from ledger precision. Each accounting policy shall declare the precision and rounding convention. Journal validation shall operate on the values actually posted after approved quantization, not on displayed rounded totals."}, {"kind": "heading", "text": "19.2 Required logical records"}, {"kind": "table", "rows": [["Record", "Mandatory attributes", "Conditional/optional attributes and relationships"], ["Lead and inquiry", "Lead ID, source, received time, name/business identity, contact route, requested service, owner, status", "Referral, campaign, provisional deadline, duplicate candidate and disposition"], ["Client relationship", "Client ID, legal/display name, relationship owner, lifecycle status, acceptance decision reference", "Group relationship, billing contact, approved service preferences"], ["Legal entity", "Entity ID, client ID, legal name, entity type, jurisdiction, registration identifier or approved alternative, reporting currency/framework", "Branches, parent, functional currency, tax registrations, business sectors"], ["Contact and access grant", "Contact ID, verified identity/contact route, organization relation, role, scope and grant status", "Signatory authority evidence, delegated authority, portal expiry, language"], ["Ownership/control party", "Party ID, entity ID, name, relationship type, effective period, verified source", "Ownership percentage, indirect chain, control basis and beneficial-owner verification"], ["Acceptance/continuance case", "Case ID, entity/service scope, questionnaire version, assessment, reviewer, decision, conditions", "Predecessor response, independence safeguards, escalation, next review trigger"], ["Questionnaire response", "Response ID, template version, respondent, answers and submission status", "Supporting document versions, prior-year comparison, clarifications"], ["Proposal and terms", "Commercial document ID, entity/service scope, version, fees/currency, responsibilities, validity, acceptance evidence", "Discounts, retainer, alternate scope, recurring terms and change orders"], ["Engagement", "Engagement ID, client/entity scope, service template/version, period scope, owner/team, deadlines, status", "Group components, specialists, quality reviewer, predecessor engagement"], ["Financial period", "Period ID, entity/book, start/end, fiscal label, reporting basis and close status", "Short/long period, comparative period mapping and reopening authorization"], ["Task/work package", "Task ID, engagement, objective, owner, due date, requiredness, dependency and completion evidence", "Time budget, optional checklist, client-visible instruction"], ["Document/version", "Document ID, version ID, scope, original name, storage key, type, hash, uploader, received time, visibility", "PBC request, derivative relation, signature evidence, hold and retention trigger"], ["PBC request/query", "Request ID, engagement/period, requested evidence, owner/respondent, due date, status", "Alternatives, reminder history, rejection reason and closure evidence"], ["Import batch", "Batch ID, entity/book/period, mode, source version/hash, format/mapping version, totals and status", "External job ID, superseded batch, row-level exceptions and approval"], ["TB snapshot and line", "Snapshot ID, source/adjusted type, entity/book/period, source lineage; line account/dimension and debit/credit amounts", "Comparative columns, currency, approved reporting adjustments"], ["Account/reporting mapping", "Mapping version, entity account key, destination account/report line, effective scope, reviewer", "Tax/cash-flow/disclosure mapping, split rule and allocation rationale"], ["Journal header and line", "Entity/book/period, number, date, source, reason, status; line account, debit/credit, currency and dimensions", "Client decision, external posting proof, reversal link, recurrence, evidence"], ["Reconciliation", "Reconciliation ID, entity/period, control account, GL/source balances, reconciling items, conclusion, preparer/reviewer", "Confirmation response, subsequent clearance, approved outstanding items"], ["Workpaper version", "Workpaper ID/version, engagement, objective/assertions, source references, procedures, results, conclusion", "Population/sample, specialist findings, cross-references and materiality version"], ["Review note", "Note ID, target object/version, author, severity/category, required action, assignee, status", "Reply/evidence history, superseded reference and clearance authority"], ["Approval decision", "Decision ID, gate, exact object/version/hash, actor/role, decision, time and rationale", "Delegation record, conditions, rejection reason and supersession"], ["Financial report version", "Report ID/version, entity/group, period, currency, framework, TB/mapping/template versions and status", "Comparative restatement, note references, management authorization"], ["Delivery package", "Package ID/version, manifest, issued files/hashes, authorized recipients, issue approval and status", "External submission ID, delivery/filing acknowledgement and replacement notice"], ["Recurrence/deadline", "Schedule ID, service/obligation, entity, rule version, period rule, responsible owner and next occurrence", "Holiday calendar, approved extension, reminder and escalation policy"], ["Office billing record", "Practice invoice/credit/time/receipt ID, engagement reference, amount/currency, authorization and status", "Payment allocation, write-off, expense evidence and external receipt"], ["Hold/offboarding record", "Case ID, client/engagement scope, reason category, authority, effective state and actions", "Handover manifest, legal hold, destruction authorization and certificate"]]}, {"kind": "heading", "text": "19.3 Cardinalities and integrity rules"}, {"kind": "paragraph", "text": "DATA-04. One client relationship may have many legal entities and contacts. One legal entity may have many periods and engagements. An engagement shall identify one primary entity and may include named component entities through an explicit membership table. A contact's access to one entity shall not imply access to siblings. An entity-period snapshot may be referenced by several engagements without transferring ownership."}, {"kind": "paragraph", "text": "DATA-05. Use scoped uniqueness for entity account codes, journal numbers, import source keys, and schedule occurrences. Unique keys shall include the practice/entity/book scope where applicable. Journal lines shall reference accounts from the same legal entity and book as the header. All related records shall resolve through valid foreign keys or versioned external identifiers; dangling references shall be rejected or isolated for migration review."}, {"kind": "paragraph", "text": "DATA-06. Enforce total debits equals total credits in the posting service transaction, together with row checks for valid amounts and accounts. Ordinary row-level constraints alone are not a substitute for cross-line balance validation. A transaction shall reject negative debit/credit representations unless normalized from an approved source convention before validation. A line shall not contain both a non-zero debit and non-zero credit after normalization."}, {"kind": "paragraph", "text": "DATA-07. Financial periods shall not overlap within one entity/book calendar unless explicitly modeled as a separate accounting book. Multiple financial statement presentations may reference the same period. Engagement dates, financial-period dates, tax-period dates, and report issuance timestamps are distinct attributes and must not overwrite one another."}, {"kind": "paragraph", "text": "DATA-08. Approval records and issued artifacts shall be append-only to ordinary users. A newer version references the superseded version and preserves the old decision. Changing a material dependency shall mark dependent drafts stale and require recalculation/re-review. Issued versions remain historical records and are replaced only by an authorized reissue procedure."}, {"kind": "heading", "text": "19.4 Source-to-target compatibility mapping"}, {"kind": "paragraph", "text": "The source mapping is an integration design and shall be confirmed during implementation against the selected licensed versions. It does not require renaming every Perfex table."}, {"kind": "table", "rows": [["Existing concept", "Target interpretation", "Required transformation"], ["Perfex customer/contact", "Client relationship and authorized contacts", "Preserve IDs in a mapping registry; add separate legal-entity/access-grant records"], ["Perfex project", "Engagement workspace", "Link to stable engagement ID, entity scope, service template and period membership"], ["Project tasks/milestones", "Work-package execution", "Apply role-based assignments, dependencies, completion evidence and review gates"], ["Strategy/summary/opinion/announcement records", "Typed engagement documents", "Version content, assign purpose and owners, bind reviews/signatures to exact versions"], ["Accounting accounts and journals", "Entity/book-scoped accounting objects", "Map source IDs; assign confirmed ownership and preserve debit/credit/source lineage"], ["Accounting history", "Posted transaction evidence or imported historical ledger", "Reconcile to headers and source systems; preserve provenance and posting status"], ["Customer/project attachments", "Managed document/evidence versions", "Import authorized files with ownership, hashes, privacy classification and retention"], ["Comments and signatures", "Discussion/review and signing evidence", "Distinguish comments from formal review clearance; preserve identity/version evidence"], ["Recurring tasks and reminders", "Service/obligation schedules", "Add occurrence keys, deadlines, approved rules and controlled renewal state"]]}]}, {"id": 20, "title": "20. Interfaces, API contracts, and processing sequences", "blocks": [{"kind": "heading", "text": "20.1 Interface principles"}, {"kind": "paragraph", "text": "API-01. APIs shall expose business commands, not unrestricted table writes. Every request shall be authenticated where appropriate, authorized for its object scope, validated server-side, and logged with a correlation ID. Public intake is a separate rate-limited interface with no accounting/approval access. Optional API availability shall not remove these controls from internal UI requests."}, {"kind": "paragraph", "text": "API-02. The proposed /ste/v1/ interface namespace is a target contract. Create/submit/post/approve/issue commands shall accept an idempotency key. Updates shall carry a current object version or equivalent conditional request. Conflicting changes shall return a conflict response and preserve both users' work; they shall not silently overwrite a reviewed version."}, {"kind": "table", "rows": [["Command family", "Required request contract", "Required response/result"], ["Create inquiry", "Intake fields, service request, source and consent/notice evidence as applicable", "Lead ID, receipt status and follow-up reference"], ["Submit acceptance", "Case ID/version, completed answers/evidence and requested decision route", "Submitted version, next reviewer and remaining requirements"], ["Convert lead", "Lead ID/version, approved acceptance and signed terms references", "Existing-or-new client/entity/contact mappings, no duplicate conversion"], ["Instantiate engagement", "Client/entity, period/service scope, template version and team", "Engagement/project IDs, created task/document manifests and pending inputs"], ["Stage TB or transactions", "Scope, operating mode, source document version, schema/mapping version and expected totals", "Batch ID, asynchronous status, row exceptions and validation totals"], ["Approve/post journal", "Journal ID/version, approval evidence and posting authorization", "Posted number, ledger version, source/event IDs, or explicit rejection"], ["Submit/review workpaper", "Workpaper ID/version, evidence, conclusion, assignee and decision type", "State, note IDs, review decision and stale dependency notices"], ["Generate/issue package", "Scoped report versions, manifest, required decisions and authorized recipients", "Draft/issued package ID, artifact hashes and dispatch job references"], ["Close/reopen engagement", "Engagement version, gate checklist, reason and required authority", "Closure/reopen event, access state and required re-review tasks"]]}, {"kind": "paragraph", "text": "API-03. Responses shall distinguish validation failure, missing authorization, version conflict, duplicate accepted request, pending job, external failure, and successful completion. Error messages shall identify correctable field issues without disclosing another client's record existence. Unauthorized object access may return a non-disclosing not-found response according to security policy. Large result sets shall be paginated and scoped before searching/counting."}, {"kind": "heading", "text": "20.2 Event and integration contract"}, {"kind": "paragraph", "text": "API-04. Each event shall contain event ID/type/schema version, source aggregate ID/version, practice/entity/engagement scope where applicable, actor/service identity, occurred-at timestamp, correlation/causation IDs, and non-sensitive payload references. Consumers shall deduplicate by event ID and enforce current authorization/configuration when executing external actions."}, {"kind": "paragraph", "text": "API-05. Outbound and inbound integrations shall use approved credentials with least privilege, explicit entity mapping, authenticated transport, timeouts, retry limits, and failure queues. Validate webhook signatures and replay protection. Provider callbacks shall be matched to the originating job and permitted state transition. External acceptance shall be verified from provider evidence rather than inferred from an HTTP request being sent."}, {"kind": "paragraph", "text": "API-06. OAuth authorization shall record consenting authority, approved scopes, tenant/account, refresh-token secret reference, permitted entities, and revocation status. Tokens shall be encrypted in a secret store or protected encrypted configuration, not in ordinary client fields. Disconnecting an integration shall stop new jobs and invalidate cached authorization, while retaining past evidence. Delegated user access shall not be confused with application-wide authority."}, {"kind": "paragraph", "text": "API-07. A document integration shall maintain logical document ID, provider item/version ID, hash, storage policy and permission mapping. A bank-feed integration shall bind each account to an entity, import overlapping ranges safely, and detect duplicates using provider transaction identity plus reconciliation rules. A filing integration shall retain payload version, client authorization, submission and acceptance receipts, errors, and any amended filing linkage."}, {"kind": "heading", "text": "20.3 End-to-end command sequence"}, {"kind": "paragraph", "text": "An authorized user submits a validated lead conversion command. The service verifies current acceptance and signed terms, creates or links the client/legal entity, and commits the mapping and outbox event."}, {"kind": "paragraph", "text": "The engagement service creates the project, period links, task templates, document placeholders and ownership records once. The notification worker invites authorized contacts only after successful creation."}, {"kind": "paragraph", "text": "A contact uploads a PBC document. The document service stores the original, creates metadata/hash, validates the upload, and links it to the request; an accountant accepts its evidential adequacy separately."}, {"kind": "paragraph", "text": "The import worker stages the TB, applies approved mappings, and records every exception. A reviewer approves the batch. The system commits an immutable source snapshot or authorized opening/transaction posting according to the chosen operating mode."}, {"kind": "paragraph", "text": "The preparer completes workpapers and proposes adjustments. Reviewer and management decisions are recorded independently. An authorized posting or reporting-adjustment command creates the new financial version."}, {"kind": "paragraph", "text": "Reports bind to the adjusted TB, policies, mapping and template versions. Review notes must be resolved by the authorized reviewer. Material changes invalidate downstream draft approvals."}, {"kind": "paragraph", "text": "Management approves its responsibilities and statements. The partner completes professional sign-off and the quality reviewer completes their gate where applicable. The release command rechecks all gates against exact versions."}, {"kind": "paragraph", "text": "Delivery creates an immutable manifest and sends only the authorized package. Acknowledgement and filing acceptance remain separate states. Closure schedules retention and continuance without copying prior approvals into the next period."}]}, {"id": 21, "title": "21. User experience, navigation, and reporting catalogue", "blocks": [{"kind": "heading", "text": "21.1 Required workspaces"}, {"kind": "table", "rows": [["Workspace", "Mandatory information and actions", "Visibility/control"], ["Lead workbench", "Inquiry, owner, source, discovery, duplicate resolution, proposal and next action", "Commercial staff by assignment; acceptance material separately restricted"], ["Client 360", "Legal entities, contacts, signed terms, acceptance, active services, deadlines and billing", "Scope-aware summary; sensitive ownership/compliance fields by role"], ["Acceptance/annual review", "Versioned questionnaire, evidence, prior-year delta, conditions and decision", "Respondent versus assessor views; firm-only assessment never exposed automatically"], ["Engagement cockpit", "Entity/period/service, team, milestones, gates, PBC status, financial/workpaper versions", "Central context banner and authorized actions; no ambiguous current-client selection"], ["PBC and queries", "Requested items, upload, adequacy review, questions, reminders and alternatives", "Client sees only its requests and approved visibility; internal notes separate"], ["TB/import centre", "Batch settings, mappings, exceptions, totals, comparative sources and approval", "Draft editing versus accepted immutable snapshots"], ["Accounting workspace", "Book/period, transactions, journals, reconciliation, close/reopen and source links", "Maker/checker/posting roles and entity-scoped account options"], ["Workpaper/review desk", "Indexed files, evidence, procedures, notes, responses, sign-offs and dependency status", "Preparer/reviewer queues; clients do not see internal workpapers by default"], ["Reporting/delivery", "Statement package, notes, version comparison, approvals, manifest and receipts", "Draft versus issued badge; issue authority separate from download/view"], ["Practice operations", "Team capacity, time/expenses, work in progress, billing, recurring obligations and closure", "Firm-only operating information; office accounting distinct from client books"], ["Administration", "Templates, jurisdiction policies, roles, integrations, audit events and migrations", "Privileged changes attributable and approval-controlled where required"]]}, {"kind": "paragraph", "text": "UX-01. Display legal entity, engagement, financial period, operating mode, currency, and draft/issued status on financial and review screens. Required fields shall be visibly distinguished from optional fields, with conditional sections appearing when relevant. Disabled transitions shall explain the missing input/gate rather than simply failing after submission."}, {"kind": "paragraph", "text": "UX-02. Autosave may preserve a draft but shall not submit, approve, post, send, or sign it. Destructive actions and issue/reissue commands shall display consequences and require the appropriate authority. Search, breadcrumbs, counts and downloads shall respect the same scope as the underlying record. Accessible keyboard navigation and readable validation messages are mandatory."}, {"kind": "paragraph", "text": "UX-03. A staff dashboard shall offer “my preparation,” “my reviews,” “awaiting client,” “awaiting partner,” and “failed/pending jobs” queues. The client dashboard shall show requests, contractual documents, authorized deliverables, commercial invoices, and upcoming actions. Internal materiality, audit procedures, review discussions, and firm economics remain internal unless explicitly released."}, {"kind": "heading", "text": "21.2 Report catalogue and parameters"}, {"kind": "paragraph", "text": "REP-01. Financial reports shall include trial balance, journal, general ledger, balance sheet/statement of financial position, profit or loss and applicable comprehensive income, changes in equity, cash flow, comparative reports, account history, AR/AP ageing, reconciliation summaries/details, and approved budget comparisons. Framework-compliant statements shall additionally include the necessary notes and presentation checks; a report printout alone is not treated as a complete financial statement set. [S4, S7, S9]"}, {"kind": "paragraph", "text": "REP-02. Parameters shall include authorized entity/group, book, period/date range, source/adjusted/issued version, currency, accounting/reporting basis, mapping version and comparison basis. Account/dimension/customer/vendor filters are optional within that entity. A firm-wide management report shall be explicitly named and authorized; missing entity input shall not default a client financial report to all entities."}, {"kind": "paragraph", "text": "REP-03. Operational reports shall include lead conversion, acceptance/continuance due, outstanding client documents, engagement progress, overdue review notes, unresolved differences, staffing/time budget, work in progress, billing and collection, filing status, completion and retention due. Measures shall have documented definitions and drill-down to authorized records. “Completed” means the approved stage is complete, not merely that a task was checked."}, {"kind": "paragraph", "text": "REP-04. Reproducibility requires source version IDs and generation timestamp on report metadata, consistent totals between export formats, and drill-down from each reported amount to mapped TB lines and supporting journals/adjustments. Issued PDFs shall identify their immutable package/version; editable exports shall be marked as exports, not replacements for signed issued artifacts."}]}, {"id": 22, "title": "22. Non-functional, security, and operational requirements", "blocks": [{"kind": "heading", "text": "22.1 Authorization, confidentiality, and secure processing"}, {"kind": "paragraph", "text": "NFR-01. All business access shall be deny-by-default and checked on the server for role, practice, entity, engagement, document classification, and current record state. Perfex staff/contact permissions provide a base; STE domain checks shall enforce the additional entity and professional-workflow restrictions. UI menu visibility is not an access-control boundary. [S14]"}, {"kind": "paragraph", "text": "NFR-02. Staff authentication shall support enforced multi-factor authentication and approved session policy. Client contacts shall verify their identity and signatory authority where required. Privileged roles shall be periodically reviewed. Disabling an identity, changing an assignment, revoking a contact grant, or ending an engagement shall revoke the corresponding access promptly, including background jobs and download-token issuance."}, {"kind": "paragraph", "text": "NFR-03. Validate uploads by approved extension, content type, file size, and processing policy. Preserve original evidence bytes and perform preview/conversion in an isolated worker. User filenames shall not determine executable paths. Do not execute imported spreadsheet macros or embedded programs. Documents, exported reports, signed evidence and temporary processing files shall retain their proper visibility and retention controls."}, {"kind": "paragraph", "text": "NFR-04. Secrets shall be managed outside source code and business records. Encryption shall protect network traffic, sensitive stored data and backups according to approved policy. Key rotation shall preserve access to historical encrypted data through controlled versioning, re-encryption, and recovery testing. Replacing an application encryption key shall not be treated as a simple configuration edit without assessing data dependencies."}, {"kind": "paragraph", "text": "NFR-05. Application logs shall contain operational identifiers and redacted error details, not passwords, tokens, full financial documents, personal identity documents, or signature bytes. Support access to client data shall be time-bound, authorized and audited. Administrative ability shall not automatically grant business approval authority."}, {"kind": "paragraph", "text": "NFR-06. Source control shall contain code, migrations, safe configuration examples, synthetic fixtures and documentation. Client documents, production database contents, credentials, application keys, live configuration, session data and operational logs shall be stored in their authorized operational repositories rather than source control. Build artifacts shall be reproducible from approved source and dependency manifests."}, {"kind": "heading", "text": "22.2 Reliability, capacity, and performance"}, {"kind": "paragraph", "text": "The following are proposed engineering acceptance targets, not measurements of the source application. The technical owner and business owner shall approve the reference deployment and representative workload before performance acceptance."}, {"kind": "table", "rows": [["Area", "Proposed acceptance target", "Verification condition"], ["Interactive operations", "95th-percentile response within 2 seconds for ordinary forms/lists", "Representative data and 100 concurrent authenticated sessions, excluding external-provider latency"], ["Large TB import", "Process a 100,000-row valid batch within 5 minutes", "Background job, approved hardware/storage, full validation and mapping; progress remains visible"], ["Financial report generation", "Complete a standard scoped report within 60 seconds over 1 million ledger lines", "Approved indexing/reference workload; larger jobs asynchronous with explicit status"], ["Availability", "99.5% monthly application availability", "Measurement boundaries and planned maintenance exclusions agreed in service policy"], ["Recovery point", "No more than 15 minutes of committed-data loss", "Coordinated database/document recovery design and monitored backup/replication"], ["Recovery time", "Restore the agreed production service within 4 hours", "Rehearsed runbook, available keys/backups, dependency and access verification"], ["Financial integrity", "Zero duplicate postings and zero unexplained scope/balance differences", "Idempotency, fault injection, migration and cross-entity tests"]]}, {"kind": "paragraph", "text": "NFR-07. Scheduled tasks shall recover from interruptions, keep progress checkpoints where necessary, and expose failed jobs for authorized retry. A retry shall preserve the original source reference and decision history. Partial imports remain staged; they shall not create a partly accepted TB or partially posted journal."}, {"kind": "paragraph", "text": "NFR-08. Backup and restore exercises shall test real restoration of database, documents, identity configuration and encryption dependencies, using protected non-production environments. A backup-success notification alone is insufficient evidence of recoverability. Restore results shall be reviewed and retained."}, {"kind": "paragraph", "text": "NFR-09. Imports and reports shall support bounded memory, pagination/streaming where needed, cancellation before commit, and safe timeout handling. Cancellation after a financial commit shall report that the posting succeeded and route any correction through reversal; it shall not imply rollback when none occurred."}, {"kind": "heading", "text": "22.3 Professional records and maintainability"}, {"kind": "paragraph", "text": "NFR-10. Retention policies shall be effective-dated by record class, engagement type and jurisdiction. Legal hold overrides scheduled disposal. Final audit-file assembly is a controlled administrative activity, not permission to backdate evidence or alter an issued conclusion. Later additions shall identify who added them, when, why, and who reviewed them."}, {"kind": "paragraph", "text": "NFR-11. Maintain a supported dependency inventory, automated build checks, schema migration validation, security/dependency checks, and targeted regression tests. Vendor upgrades shall be tested against the extension contract and representative workflows before promotion. Source provenance and permitted use shall be documented for commercial and open-source components."}, {"kind": "paragraph", "text": "NFR-12. Business policy changes shall be versioned and reviewed. Template updates apply to new engagements by default; changing an active engagement requires an impact preview and authorization. Previous issued reports remain bound to the policy/template versions used at issuance."}, {"kind": "paragraph", "text": "NFR-13. Financial calculation, import, mapping, and approval logic shall have automated tests independent of the UI. At least one end-to-end test shall exercise each enabled service template's creation, work execution, review, deliverable, and closure path. Specialist integrations may use contract tests and approved sandbox evidence before production activation."}]}, {"id": 23, "title": "23. Implementation transition and modernization requirements", "blocks": [{"kind": "paragraph", "text": "This section specifies delivery requirements for establishing the target platform. It is not a retrospective assessment of the source application."}, {"kind": "heading", "text": "23.1 Approved software foundation"}, {"kind": "paragraph", "text": "TR-01. Licensed and verifiable baseline. Obtain and retain authorized Perfex and Accounting module source packages for the selected supported versions. Record product, vendor, version, applicable licence, package checksum, dependency manifest, and approved deployment use. Keep protected read-only baselines for upgrade comparison and release reproducibility."}, {"kind": "paragraph", "text": "TR-02. Functional reconciliation. Prepare a three-way implementation map covering vendor CRM behavior, vendor accounting behavior, and required STE behavior. Record which workflows will be retained through supported configuration, implemented as STE extensions, or served through an accounting/document integration. Preserve business intent and required outputs without requiring direct edits to vendor core files."}, {"kind": "heading", "text": "23.2 Configuration and information handling"}, {"kind": "paragraph", "text": "TR-03. Operational separation. Establish safe configuration templates, environment-specific secret management, least-privilege service identities, private document storage, and synthetic development/test datasets. Authorized operational credentials shall be rotated under a controlled plan. Encryption-key changes shall include dependency mapping and recoverability verification as required by NFR-04. Any repository-history changes or irreversible operational changes require explicit owner authorization and a recovery plan."}, {"kind": "paragraph", "text": "TR-04. Reproducible schema. Implement every target table, column, index, constraint, seed reference and version change through reviewed migrations. A clean deployment plus migrations shall create the expected schema without manual database editing. Forward upgrades, repeat execution protection, backup prerequisites and supported rollback/recovery procedures shall be documented and tested."}, {"kind": "heading", "text": "23.3 Financial and professional workflow implementation"}, {"kind": "paragraph", "text": "TR-05. Entity-scoped accounting. Implement entity/book ownership on all financial records and queries. Confirm transaction sources, account ownership, opening balances, fiscal periods, mapping, reporting basis, and firm-versus-client distinctions before importing financial data. Enforce scope through services, joins, report queries, document access, background workers and caches."}, {"kind": "paragraph", "text": "TR-06. Review and immutable evidence. Implement preparer/checker separation, review-note resolution, manager approval, management authorization, partner sign-off, conditional quality review, issue authorization and controlled reopening as separate decisions. Bind each to an exact object version and retain the evidence and audit trail."}, {"kind": "paragraph", "text": "TR-07. STE audit domain. Implement strategy memorandum, materiality, summary memorandum, audit opinion and announcement-letter requirements as typed professional documents with versioned templates, ownership, evidence links, review state and controlled issuance. Retain the project-centric user experience while using explicit engagement/entity/period relationships."}, {"kind": "heading", "text": "23.4 Data transition and cutover"}, {"kind": "paragraph", "text": "TR-08. Migration package. The migration plan shall inventory authorized clients, contacts, entities, engagements, periods, accounting records, documents, schedules and approval evidence. Produce a source-to-target mapping registry, transformation rules, row/file counts, financial control totals, exception register and reconciliation report. This is a data-transition exception register, not a code-risk report."}, {"kind": "paragraph", "text": "TR-09. Attribution. Assign records to legal entities using documented evidence and authorized mapping decisions. Do not infer ownership solely from a report heading, filename, project label, or proximity in a spreadsheet. Records with unresolved ownership shall remain in restricted staging until resolved; they shall not be assigned arbitrarily to a default client. Preserve original source IDs and documents for traceability."}, {"kind": "paragraph", "text": "TR-10. Historical approvals. Preserve historical sign-off evidence as historical evidence. Do not generate new signatures, backdate review approvals, or represent migrated content as re-performed work. Where an original approval cannot be demonstrated, mark the historical status accurately and obtain any new required acceptance/review for current use."}, {"kind": "paragraph", "text": "TR-11. Rehearsal and reconciliation. Run at least one complete migration rehearsal with agreed sample and full-scope control totals. Reconcile entity-period TB totals, balances by control account, opening/closing continuity, document hashes/counts, engagement statu
