 advanced analytics."}, {"kind": "paragraph", "text": "M processing: plan → collect/preserve evidence → record chain of custody → analyze records → evaluate indicators → authorized interviews → corroborate findings → document limitations and factual conclusions → legal/technical review → restricted report."}, {"kind": "paragraph", "text": "Output and approval: evidence register, reproducible analyses, interview records, and authorized report. Access and exports are exceptionally restricted. Professional conclusions distinguish evidence, inference, and unresolved facts. No routine client portal disclosure of protected investigation content."}]}, {"title": "17.6 Financial forecasting and projections", "blocks": [{"kind": "paragraph", "text": "M inputs: forecast objective/horizon, historical data, model owner, assumptions, business drivers, finance terms, and selected scenarios. C inputs: capex, working capital, tax, FX, funding and covenant assumptions. O inputs: sensitivity and stress cases."}, {"kind": "paragraph", "text": "M processing: scope/data plan → historical review → assumptions evaluation → methodology → model inputs/calculations → integrated forecast statements and cash needs → scenario review → findings."}, {"kind": "paragraph", "text": "Output and approval: forecast model, assumption register, projected statements/cash requirements, and report. Management owns assumptions; independent reviewer validates calculation and consistency; service partner approves report language. An assurance conclusion is included only under separately authorized assurance terms."}]}, {"title": "17.7 AML compliance review", "blocks": [{"kind": "paragraph", "text": "M inputs: jurisdiction/profile, regulated activities, policies, customer population, due-diligence records, monitoring procedures, training and records-retention evidence. C inputs: restricted reporting processes, investigation records, and regulatory authorizations. O inputs: system effectiveness analytics."}, {"kind": "paragraph", "text": "M processing: plan → policies/controls review → CDD/KYC sampling → monitoring review → reporting-process evaluation → training/recordkeeping assessment → findings/actions → follow-up. The template's suspicious-activity-reporting task means assess or perform only the separately authorized legal role; it is not an automatic report to authorities."}, {"kind": "paragraph", "text": "Output and approval: restricted compliance review, findings and action plan. Compliance specialist and engagement lead approve; management receives only legally permitted content. Confidential reporting and anti-tipping-off restrictions are represented in access and communication policy."}]}, {"title": "17.8 Management consulting", "blocks": [{"kind": "paragraph", "text": "M inputs: business problem, scope, stakeholders, baseline measures, target outcomes, data sources, and decision owner. C inputs: organizational, strategic, operational, financial, market, or change-management data. O inputs: implementation coaching."}, {"kind": "paragraph", "text": "M processing: organizational analysis → option/strategy development → operational/financial evaluation → performance measures → recommendations → agreed implementation support → outcome tracking."}, {"kind": "paragraph", "text": "Output and approval: assessment, roadmap, action owners, and success measures. Manager/partner review recommendations; client management approves its implementation decisions. Consulting participation shall not silently transfer management responsibility to an audit team."}]}, {"title": "17.9 Fixed-asset verification and tagging", "blocks": [{"kind": "paragraph", "text": "M inputs: asset register, locations, custodians, ownership evidence, count cut-off, tagging scheme, and reconciliation basis. C inputs: leased assets, disposals, depreciation/valuation policies, and specialist valuations. O inputs: barcode/RFID/mobile capture."}, {"kind": "paragraph", "text": "M processing: scope and register acquisition → location/count plan → categorization → physical verification/tagging → reconcile existence and register completeness → investigate differences → validate authorized valuation/depreciation scope → report/update proposals."}, {"kind": "paragraph", "text": "Output and approval: verified asset listing, tag register, exception schedule, and report. Register amendments require client authorization and accounting review. A tagging exercise does not, by itself, provide a fair-value opinion."}]}, {"title": "17.10 Inventory management audit", "blocks": [{"kind": "paragraph", "text": "M inputs: inventory records, sites, count instructions/cut-off, control procedures, valuation policies, and movement history. C inputs: third-party stocks, consignment, work-in-progress, obsolescence, and costing data. O inputs: cycle-count analytics."}, {"kind": "paragraph", "text": "M processing: planning → process/control review → count observation/testing → quantity reconciliation → valuation/costing review → turnover/efficiency and loss-prevention assessment → compliance evaluation → recommendations."}, {"kind": "paragraph", "text": "Output and approval: count/valuation exceptions, control findings, authorized adjustment proposals, and scoped report. Recounts and unresolved stock movements remain tracked; reviewers approve conclusions before client release."}]}, {"title": "17.11 ERP implementation and review", "blocks": [{"kind": "paragraph", "text": "M inputs: business requirements, process owners, system landscape, selection criteria, data inventory, access/security needs, migration scope, and acceptance criteria. C inputs: procurement authority, vendor contract, interfaces, segregation-of-duties rules, and cutover permissions. O inputs: phased rollout or independent post-implementation review."}, {"kind": "paragraph", "text": "M processing: plan → selection/contracting → design/configuration → migration/integration → testing/UAT → training → authorized go-live → stabilization → independent review where scoped."}, {"kind": "paragraph", "text": "Output and approval: requirements/design, configuration and mapping records, test results, migration reconciliation, training/handover, and review report. Client process owners approve business decisions and UAT; technical release authority approves deployment. Implementation work and subsequent assurance require independence assessment and appropriate separation."}]}, {"title": "17.12 Corporate training on IFRS and IAS", "blocks": [{"kind": "paragraph", "text": "M inputs: audience, needs assessment, learning objectives, selected standards/topics, delivery mode, schedule, materials owner, and assessment approach. C inputs: jurisdiction-specific material, accessibility/language needs, venue, and certification criteria. O inputs: case studies, workshops, follow-up coaching."}, {"kind": "paragraph", "text": "M processing: needs assessment → objectives → material preparation/technical review → logistics → instruction → practical exercises → questions → assessment and feedback → completion records."}, {"kind": "paragraph", "text": "Output and approval: reviewed materials, attendance, assessment results, and participation/completion certificate where criteria are met. Certificates shall not imply statutory accreditation not granted by an authorized body. Training lead and technical reviewer approve materials; attendance does not trigger an audit opinion workflow."}]}, {"title": "17.13 Additional accounting practice templates", "blocks": [{"kind": "paragraph", "text": "Recurring bookkeeping: source documents/transactions → posting and bank/control reconciliations → monthly close → management accounts → manager review → client delivery. Each month has an explicit period and close checklist."}, {"kind": "paragraph", "text": "Annual accounts/compilation: approved TB and policies → adjustments → statements/notes → management approval → appropriate compilation/non-assurance report where required. No audit assurance is implied."}, {"kind": "paragraph", "text": "Review engagement: approved terms and applicable review standard → inquiry/analytical and additional required procedures → reviewed statements and limited-assurance conclusion where applicable. Do not substitute an external-audit checklist without tailoring."}, {"kind": "paragraph", "text": "Agreed-upon procedures: named users/purpose, agreed procedures and acceptance → exact procedures performed → factual findings report. The report does not express an audit opinion or assurance conclusion unless separately scoped."}, {"kind": "paragraph", "text": "Tax compliance: applicable registrations/rules, TB, tax records → book-to-tax adjustments → computation/return → technical review → client authorization → submission/acceptance → payment instruction and receipt reconciliation. A payment instruction is not bank execution authority."}, {"kind": "paragraph", "text": "Payroll administration: authorized employee changes, approved pay rules/time/benefits → gross-to-net calculation → independent review → client payroll approval → authorized export → payment/filing evidence → payroll/GL reconciliation. Payroll confidentiality and access are separately scoped."}]}]}</script><script type="application/json" id="role-data">{

function onboarding(){const e=E(),q=e.questionnaire;return head('Acceptance is a decision, not a checkbox.','A guided preview of intake, supporting evidence and professional clearance.',btn('Read the exact questionnaire','source','', 'data-section="7"','book'))+context()+tabs([['assessment','Assessment'],['questions','Question bank'],['clearances','Clearances & terms']],'onboardTab')+note('This screen demonstrates the intake route. Completing demo declarations is not a KYC verification, screening result or professional acceptance.')+(ui.onboardTab==='assessment'?`<div class="grid-main"><div class="stack">${assessmentItems.map(([title,sub,ids],i)=>panel(title,sub,`<div class="panel-pad" style="padding-top:0"><div class="between"><span class="caption">${ids} · source requirements</span>${badge(q.answers[i]?'Demo information confirmed':'Awaiting information',q.answers[i]?'green':'amber')}</div><label class="checkbox mt16"><input type="checkbox" data-change="assessment-item" data-id="${i}" ${q.answers[i]?'checked':''}>I have reviewed the synthetic information and recorded the required demo evidence.</label><div class="mt12">${btn('Read source questions','source','ghost sm','data-section="7"')}</div></div>`)).join('')}</div><div class="stack"><div class="panel panel-pad"><span class="eyebrow">ASSESSMENT SUMMARY</span><h2 class="mt12">${Object.values(q.answers).filter(Boolean).length} of 4 sections</h2><div class="progress mt12" style="width:100%"><i style="width:${Object.values(q.answers).filter(Boolean).length*25}%"></i></div><p class="sub mt16">Scores and forms may route work. Only an authorized partner can record acceptance.</p><div class="divider"></div>${badge(q.status)}<div class="stack mt16">${btn('Submit demo assessment','assessment-submit','primary')}${btn('Record partner acceptance','assessment-accept','')}</div><p class="role-note">Use the Engagement partner role for the final decision. This is a simulation, not identity verification.</p></div><div class="panel panel-pad"><h3>Always distinguish</h3><p class="sub mt12">Information received → verified evidence → specialist clearance → partner decision → engagement authorization.</p></div></div></div>`:ui.onboardTab==='questions'?`<div class="panel panel-pad"><h2>Source intake and annual-validation questions</h2><p class="sub">Read-only source text. Q01–Q40 and Y01–Y30 are preserved in the document reference.</p>${sourceBlocks(PRD.sections.find(s=>s.id===7).blocks)}</div>`:`<div class="grid2">${panel('Required clearances','Each professional decision remains separate.',`<div class="panel-pad" style="padding-top:0"><div class="controlbox"><span class="statusicon">${icon('check')}</span><div><h4>Independence / service permissibility</h4><p>Synthetic scenario cleared; no real assessment performed.</p></div></div><div class="controlbox mt12"><span class="statusicon">${icon('check')}</span><div><h4>Capacity & competence</h4><p>Illustrative team assignment recorded.</p></div></div><div class="controlbox mt12"><span class="statusicon warn">${icon('info')}</span><div><h4>External screening</h4><p>Not connected. No sanctions or identity check is performed.</p></div></div></div>`)}${panel('Engagement terms','Commercial acceptance is not activation.',`<div class="panel-pad" style="padding-top:0">${badge(e.terms?'Effective terms recorded':'Terms pending')}<p class="sub mt16">Signed scope, entity, period, responsibilities, fees, data terms and signatory authority are required in production.</p><div class="mt20">${btn('Record demo terms','record-terms','soft')}</div></div>`)}</div>`)+footer('LC-04–07 · Q01–40');}
function documents(){const e=E(),items=e.pbc.filter(p=>ui.docFilter==='All'||p.status===ui.docFilter);return head('Evidence, with a clear chain of custody.','Every request has an owner, a period and a separate adequacy decision.',btn('New PBC request','new-pbc','primary','','plus'))+context()+`<div class="metric-grid">${metric('Requested',e.pbc.length,'Client evidence requests','folder')}${metric('Awaiting client',e.pbc.filter(p=>['Requested','Clarification required'].includes(p.status)).length,'Files or clarification outstanding','clock','amber')}${metric('Ready for review',e.pbc.filter(p=>p.status==='Received').length,'Received does not mean accepted','eye','purple')}${metric('Accepted',e.pbc.filter(p=>p.status==='Accepted').length,'Adequate for the stated request','checkcircle','blue')}</div><div class="toolbar"><select class="select" id="doc-filter" aria-label="Filter PBC requests">${['All','Requested','Received','Accepted','Clarification required'].map(s=>`<option ${ui.docFilter===s?'selected':''}>${s}</option>`).join('')}</select><span class="caption">Provider status: SharePoint is not connected</span></div>${panel('PBC request register','Sample files are visual references. Real uploads stay local and retain metadata only.',`<div class="tablewrap"><table><thead><tr><th>Request / document</th><th>Client owner</th><th>Due date</th><th>Status</th><th>Version</th><th class="right">Actions</th></tr></thead><tbody>${items.map(p=>`<tr><td><div class="row"><div class="document-icon ${p.file?.endsWith('.pdf')?'pdf':''}">${p.file?.endsWith('.pdf')?'PDF':'DOC'}</div><div><button class="tablelink" data-action="pbc-detail" data-id="${p.id}"><b>${esc(p.title)}</b></button><div class="cell-sub">${p.id} · ${esc(p.file||'No file received')}</div></div></div></td><td><span class="small">${esc(p.owner)}</span></td><td><span class="small">${shortDate(p.due)}</span></td><td>${badge(p.status)}</td><td class="mono">${p.version?'v'+p.version:'—'}</td><td class="right">${btn(p.file?'View request':'Upload','pbc-detail','sm',`data-id="${p.id}"`,p.file?'eye':'upload')}</td></tr>`).join('')}</tbody></table></div>`)}<div class="grid2 mt24"><div class="panel panel-pad"><h3>Receipt → review → accepted evidence</h3><div class="service-track mt16"><span>Requested</span>${icon('arrow')}<span>Received</span>${icon('arrow')}<span>Technical review</span>${icon('arrow')}<span>Accepted</span></div><p class="sub mt16">Replacement files retain their prior metadata and return to review. Internal review notes never become client-visible just because a query is shared.</p></div><div class="panel panel-pad"><div class="between"><h3>Document integration</h3>${badge('Not connected','gray')}</div><p class="sub mt12">The production architecture can resolve a logical document to an approved provider. This prototype does not upload to SharePoint, launch Office, or apply retention policies.</p>${btn('Read document requirements','source','ghost sm mt12','data-section="9"')}</div></div>${footer('LC-11–12 · API-07')}`;}
function accounting(){const e=E();return head('Accounting, from source to statement.','Preserve the original. Explain the adjustments. Review the exact reporting version.',`${btn('Export TB CSV','export-tb','','','download')}${btn('Import demo CSV','import-tb','primary','','upload')}`)+context()+tabs([['tb','Trial balance'],['mapping','Account mapping'],['adjustments','Adjustments'],['reconciliations','Reconciliations'],['statements','Financial statements']],'accountTab')+(e.builtGeneration!==e.generation?note(`<b>Package v${e.packageRevision} is stale.</b> Inputs changed to generation ${e.generation}. Rebuild, then obtain fresh approvals. Historical sign-offs remain attached to their original version.`,'amber',`<span class="banner-action">${btn('Rebuild package','build-package','sm soft')}</span>`):'')+({tb:tbView,mapping:mappingView,adjustments:adjustmentsView,reconciliations:reconciliationView,statements:statementsView}[ui.accountTab]||tbView)()+footer('LC-13–19 · GOV-01–03');}
function tbView(){const e=E(),t=totals(),raw=e.rows.reduce((s,r)=>s+r.balance,0),debits=e.rows.filter(r=>r.balance>0).reduce((s,r)=>s+r.balance,0);const rs=t.rows.map(r=>{const rawrow=e.rows.find(x=>x.code===r.code);const rawBal=rawrow?.balance||0;return `<tr><td class="mono">${esc(r.code)}</td><td><b>${esc(r.name)}</b><div class="cell-sub">${esc(r.type)} · ${e.id}</div></td><td class="right num">${moneyView(rawBal)}</td><td class="right num ${r.balance-rawBal?'teal':''}">${r.balance-rawBal?moneyView(r.balance-rawBal):'—'}</td><td class="right num bold">${moneyView(r.balance)}</td><td>${badge(e.mappingApproved?'Mapped':'Review required',e.mappingApproved?'green':'amber')}</td></tr>`;}).join('');return `<div class="grid3 mb16">${metric('Source debits',cash(debits),`Source version ${e.sourceVersion} · debit-positive convention`,'file')}${metric('Trial balance residual',cash(raw),raw===0?'Debits and credits agree':'Source requires correction','checkcircle',raw===0?'':'amber')}${metric('Adjusted profit',cash(t.profit),'Reporting adjustments applied once','trend','purple')}</div>${panel('Source and adjusted trial balance','QAR · Debit balances positive / credit balances in parentheses',`<div class="tablewrap"><table><thead><tr><th>Account</th><th>Description</th><th class="right">Source</th><th class="right">Adjustments</th><th class="right">Adjusted</th><th>Mapping</th></tr></thead><tbody>${rs}<tr class="table-summary"><td colspan="2">Signed-balance control</td><td class="right">${moneyView(raw)}</td><td class="right">${moneyView(t.balance-raw)}</td><td class="right">${moneyView(t.balance)}</td><td>${badge(t.balance===0?'Balanced':'Unbalanced',t.balance===0?'green':'red')}</td></tr></tbody></table></div><div class="panel-foot"><span>Received source → approved mapping → adjusted snapshot → report</span><span class="mono">TB-v${e.sourceVersion} / generation ${e.generation}</span></div>`,btn('Source fixture','source','ghost sm','data-section="25"'))}<div class="grid2 mt20"><div class="panel panel-pad"><h3>Try a controlled source replacement</h3><p class="sub mt8">Create a replacement TB already containing the depreciation entry. The reporting layer must not apply it a second time.</p><div class="mt16">${btn('Replace TB with posted adjustment','replace-tb','soft','','refresh')}</div></div><div class="panel panel-pad"><h3>Demonstrate approval invalidation</h3><p class="sub mt8">Add a synthetic QAR 1,000 credit sale: receivables and revenue change. Existing package approvals become stale.</p><div class="mt16">${btn('Simulate source change','source-change','','','layers')}</div></div></div>${note('The initial 8-account fixture and QAR 500 adjustment come from PRD §25. Other clients and supplemental schedules are illustrative. This is not a production ledger.','').replace('class="banner ','class="banner mt20 ')}`;}
function mappingView(){const e=E();return note('Mappings classify source accounts. Changing an account classification creates a new input generation and requires a fresh reviewer decision.')+panel('Account-to-statement mapping','Select the destination classification, then switch to Senior reviewer to approve.',`<div class="tablewrap"><table><thead><tr><th>Source code</th><th>Source account</th><th>Statement classification</th><th>Review</th></tr></thead><tbody>${e.rows.map(r=>`<tr><td class="mono">${esc(r.code)}</td><td>${esc(r.name)}</td><td><select class="select" data-change="mapping" data-code="${esc(r.code)}" aria-label="Classification for ${esc(r.name)}">${['asset','liability','equity','revenue','expense'].map(t=>`<option value="${t}" ${r.type===t?'selected':''}>${{asset:'Assets → Financial position',liability:'Liabilities → Financial position',equity:'Equity → Equity statement',revenue:'Revenue → Profit or loss',expense:'Expenses → Profit or loss'}[t]}</option>`).join('')}</select></td><td>${badge(e.mappingApproved?'Approved':'Review required')}</td></tr>`).join('')}</tbody></table></div><div class="panel-foot"><span>Prototype supports one classification per account; split allocations are a production requirement.</span>${btn('Approve mapping','approve-mapping','primary sm')}</div>`) + `<div class="panel panel-pad mt20"><h3>Reporting traceability</h3><div class="lineage mt16"><span>Source account</span>${icon('arrow')}<span>Entity account</span>${icon('arrow')}<span>Approved mapping</span>${icon('arrow')}<span>Statement line</span>${icon('arrow')}<span>Supporting note</span></div></div>`;}
function adjustmentsView(){const e=E();return `<div class="grid-main"><div class="stack">${panel('AJ-001 · Depreciation adjustment','Based on the worked example in STE-PRD-001 §25.3.',`<div class="panel-pad" style="padding-top:0"><div class="between">${badge(e.journalState)}${badge(e.sourceReflection?'Reflected in source':'Reporting layer',e.sourceReflection?'blue':'purple')}</div><div class="tablewrap mt20"><table><thead><tr><th>Account</th><th class="right">Debit</th><th class="right">Credit</th></tr></thead><tbody><tr><td>Depreciation expense</td><td class="right">${fmt(e.adjustment)}</td><td class="right">—</td></tr><tr><td>Accumulated depreciation</td><td class="right">—</td><td class="right">${fmt(e.adjustment)}</td></tr></tbody></table></div><div class="info-grid mt20"><div><label>Prepared by</label><span>Adam Khan</span></div><div><label>Technical review</label><span>Sara Malik · sample record</span></div><div><label>Management</label><span>${e.journalState==='Applied'?'Demo authorization recorded':'Authorization pending'}</span></div></div><div class="divider"></div><p class="small muted">${e.sourceReflection?'The replacement trial balance already includes this entry. Additional reporting-layer effect is QAR 0.00.':'The approved reporting adjustment is included once. The client’s external ledger is not changed by this application.'}</p><div class="row mt16 wrap">${btn('Revise proposed amount','revise-adjustment','','','file')}${e.journalState!=='Applied'?btn('Management authorize & apply demo','apply-adjustment','primary'):''}</div></div>`)}${panel('Correction lineage','Every change keeps a source and decision trail.',`<div class="panel-pad" style="padding-top:0"><div class="lineage"><span>WP-C1</span>${icon('arrow')}<span>AJ-001</span>${icon('arrow')}<span>Management decision</span>${icon('arrow')}<span>TB-v${e.sourceVersion}</span>${icon('arrow')}<span>Package-v${e.packageRevision}</span></div></div>`)}</div><div class="stack"><div class="panel panel-pad"><h3>Four different outcomes</h3><div class="status-line mt16">${icon('check')}Technical treatment reviewed</div><div class="status-line">${icon('check')}Management authorization</div><div class="status-line">${icon('layers')}Included in reporting</div><div class="status-line">${icon('globe')}Externally posted: separate evidence</div><p class="sub mt16">A downloaded journal file is not evidence of external posting. A rejected entry remains in the differences register.</p></div>${note('All journal actions are local simulations. No client or firm ledger receives a posting.','amber')}</div></div>`;}
function reconciliationView(){const e=E();return panel('Source-bound reconciliations','Opening balances, supporting schedules and explained differences.',`<div class="tablewrap"><table><thead><tr><th>Area</th><th>Reference</th><th>Supporting basis</th><th>Status</th><th></th></tr></thead><tbody>${e.reconciliations.map((r,i)=>`<tr><td><b>${r.name}</b></td><td class="mono">${r.ref}</td><td class="small muted">${r.evidence}</td><td>${badge(r.status)}</td><td>${btn('Open schedule','reconciliation','sm',`data-id="${i}"`)}</td></tr>`).join('')}</tbody></table></div>`)+`<div class="panel panel-pad mt20"><h3>Unexplained differences cannot be hidden</h3><p class="sub mt8">The production workflow classifies timing, error, omission, estimates and disputed items. This prototype displays sample reconciliation outcomes; it does not perform bank matching.</p><div class="mt12">${btn('Read detailed reconciliation requirements','source','ghost sm','data-section="10"')}</div></div>`;}
function statementPaper(e=E(),release=null){const t=release?.totals||totals(e),rev=release?.revision||e.packageRevision,c=C(e.client);return `<article class="paper"><div class="watermark">${release?'DEMO ISSUED ARTIFACT — NOT AN AUDITOR’S REPORT':'ILLUSTRATIVE DRAFT — NOT FOR PROFESSIONAL USE'}</div><div class="letterhead"><div><h2>${esc(c.name)}</h2><p>Illustrative financial statements · FY ${e.year}</p></div><div class="right"><strong>QAR</strong><div class="caption">Package v${rev}</div><div class="caption">STE-PRD-001 demonstration</div></div></div><h3>Statement of financial position</h3><table><thead><tr><th>Line item</th><th class="right">Amount</th></tr></thead><tbody>${t.rows.filter(r=>r.type==='asset').map(r=>`<tr><td>${esc(r.name)}</td><td class="right num">${moneyView(r.balance)}</td></tr>`).join('')}<tr class="statement-total"><td>Total assets</td><td class="right">${fmt(t.assets)}</td></tr>${t.rows.filter(r=>r.type==='liability').map(r=>`<tr><td>${esc(r.name)}</td><td class="right">${moneyView(-r.balance)}</td></tr>`).join('')}<tr><td>Total liabilities</td><td class="right">${fmt(t.liabilities)}</td></tr><tr><td>Opening equity</td><td class="right">${fmt(t.openingEquity)}</td></tr><tr><td>Current-period profit / (loss)</td><td class="right">${moneyView(t.profit)}</td></tr><tr class="statement-total"><td>Total liabilities and equity</td><td class="right">${fmt(t.liabilities+t.openingEquity+t.profit)}</td></tr></tbody></table><h3>Statement of profit or loss</h3><table><tbody>${t.rows.filter(r=>['revenue','expense'].includes(r.type)).map(r=>`<tr><td>${esc(r.name)}</td><td class="right">${moneyView(r.type==='revenue'?-r.balance:r.balance)}</td></tr>`).join('')}<tr class="statement-total"><td>Profit / (loss) for the period</td><td class="right">${moneyView(t.profit)}</td></tr></tbody></table><h3>Equity movement</h3><p>Opening equity ${cash(t.openingEquity)} + current result ${cash(t.profit)} = closing equity ${cash(t.openingEquity+t.profit)}. This simplified illustration assumes no distributions or other comprehensive income.</p><h3>Cash-flow and disclosure support</h3>${e.supplements?`<p><b>Illustrative supporting schedule, not derived from closing TB alone.</b> The original example assumes opening cash QAR 8,000 and a QAR 1,000 increase in receivables: operating cash QAR 2,000, no investing or financing movements, closing cash QAR 10,000. These demo assumptions apply only to the original Example Trading fixture; source changes require new supporting schedules.</p><p>Disclosure checklist: accounting basis, asset policy, related parties, going concern and subsequent events require explicit applicability and review. This preview is not a complete framework-compliant statement set.</p>`:`<p><strong>Supporting schedules require review.</strong> Opening balances, cash movements, noncash changes and disclosure information must be supplied. A closing trial balance is insufficient.</p>`}<div class="divider"></div><div class="caption">Source: ${e.id} · TB-v${e.sourceVersion} · input generation ${release?.generation||e.generation}<br>No real signature, audit opinion, management attestation or filing is created by this prototype.</div></article>`;}
function statementsView(){const e=E(),t=totals();return `<div class="toolbar">${btn('Rebuild current package','build-package','primary','','refresh')}${btn('Export preview HTML','export-report','','','download')}${btn('Print preview','print-report','','','file')}${linkBtn('Approval desk','reviews')}</div><div class="grid3 mb16">${metric('Total assets',cash(t.assets),'Statement of financial position','chart')}${metric('Closing equity',cash(t.openingEquity+t.profit),'Opening equity + current-period result','layers','purple')}${metric('Statement equation',t.assets===t.liabilities+t.openingEquity+t.profit?'Balanced':'Review required','Assets = liabilities + equity','checkcircle','blue')}</div>${!e.supplements?note('After a source change, the illustrative cash-flow/disclosure support must be reconfirmed. This demo confirmation does not create real evidence.','amber',`<span class="banner-action">${btn('Review demo supplements','supplements','sm')}</span>`):''}${statementPaper()}<div class="row mt20 wrap">${btn('Review demo supplements','supplements','soft')}${btn('Read statement requirements','source','ghost','data-section="10"')}</div>`;}

iv><h3 class="mt12">${esc(w.risk)}</h3><p class="sub mt8">${esc(w.assertion)}</p><p class="small mt16">${esc(w.objective)}</p><div class="mt16">${btn('View linked procedure','workpaper','soft sm',`data-id="${w.id}"`,'link')}</div></section>`).join('')}</div>`:ui.auditTab==='sampling'?samplingView():memorandaView())+footer('AUD-01–05 · LC-10');}

async function sha256(text){
 const bytes=typeof text==='string'?new TextEncoder().encode(text):new Uint8Array(text);
 if(globalThis.crypto?.subtle){const digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');}
 // Standard SHA-256 fallback for local, opaque-origin previews. Used for demo
 // content identity only, never authentication, signing, or adversarial integrity.
 const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
 const len=Math.ceil((bytes.length+9)/64)*64,data=new Uint8Array(len);data.set(bytes);data[bytes.length]=128;
 const view=new DataView(data.buffer),bits=bytes.length*8;view.setUint32(len-8,Math.floor(bits/4294967296));view.setUint32(len-4,bits>>>0);
 const rr=(x,n)=>(x>>>n)|(x<<(32-n)),W=new Uint32Array(64);
 for(let off=0;off<len;off+=64){for(let i=0;i<16;i++)W[i]=view.getUint32(off+i*4);for(let i=16;i<64;i++){let x=W[i-15],y=W[i-2];W[i]=((rr(x,7)^rr(x,18)^(x>>>3))+W[i-16]+(rr(y,17)^rr(y,19)^(y>>>10))+W[i-7])>>>0;}
 let [a,b,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+W[i])>>>0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}[a,b,c,d,e,f,g,h].forEach((x,i)=>H[i]=(H[i]+x)>>>0);}
 return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}

 'import-tb':()=>openModal('Import a synthetic trial balance',`${note('Local CSV demonstration only. No file is sent to a server; XLSX parsing is not included. Use synthetic data, maximum 1 MiB / 2,000 rows.','amber')}<p class="small">Required headers:</p><div class="hash mt12">Code,Account,Type,Balance</div><p class="sub mt12">Type must be asset, liability, equity, revenue or expense. Amounts use a debit-positive convention and at most two decimal places. Signed balances must total zero.</p><div class="row mt20">${btn('Download CSV template','tb-template','soft','','download')}</div><p class="sub mt16">A successful import creates a new local source version and invalidates dependent approvals. It does not post to a ledger.</p>`,`${btn('Cancel','close-modal')}${btn('Choose CSV','pick-tb','primary','','upload')}`),

 'build-package':()=>{const e=E();if(!e.sourceAccepted||!e.rows.length)throw Error('An accepted source dataset is required.');if(!e.mappingApproved)throw Error('A reviewer must approve the mapping first.');if(totals(e).balance!==0)throw Error('The trial balance does not balance.');if(e.journalState==='Management pending')throw Error('Resolve the proposed journal before building.');if(e.builtGeneration===e.generation){toast('The current package already matches these inputs.');return;}e.packageRevision++;e.builtGeneration=e.generation;e.candidate=null;log('Rebuilt package v'+e.packageRevision+' for input generation '+e.generation);render();toast('New draft package created. Historical approvals were not copied.');},
 'supplements':()=>openModal('Review illustrative supplemental information',`${note('These are demo assumptions, not information inferred from the closing trial balance. A production workflow requires actual movement schedules and management disclosures.','amber')}<div class="info-grid"><div><label>Original fixture opening cash</label><span>QAR 8,000</span></div><div><label>Original fixture closing cash</label><span>QAR 10,000</span></div><div><label>Original receivables movement</label><span>Increase of QAR 1,000</span></div></div><p class="small muted mt20">The source’s worked example does not supply cash-flow movements. This supplemental illustration exists only to show the review interaction. Any imported or changed source needs separate professionally prepared support.</p><label class="checkbox mt20"><input type="checkbox" id="supp-confirm">I understand these are synthetic assumptions and confirm the demonstration review only.</label>`,`${btn('Cancel','close-modal')}${btn('Confirm demo review','confirm-supplements','primary')}`),

 'respond-note':d=>{if(!roleAllowed('preparer'))return;const text=required('review-response','Response');const r=E().reviews.find(r=>r.id===d.id);if(r.status==='Cleared')throw Error('A reviewer must reopen this point before a new response.');r.history.push({status:r.status,response:r.response,version:r.version});r.response=text;r.respondedBy=actor().name;r.status='Responded';const w=E().workpapers.find(w=>w.id===r.wp);if(w){w.version++;w.status='Submitted';w.conclusion=text;r.version=w.version;}changed('Response submitted for '+r.id+'; new workpaper revision requires review');render();toast('Response saved. Switch to Senior reviewer for independent clearance.');},
 'clear-note':d=>{if(!roleAllowed('reviewer'))return;const r=E().reviews.find(r=>r.id===d.id);if(r.status!=='Responded')throw Error('A preparer response is required before clearance.');if(r.respondedBy===actor().name)throw Error('The responder cannot clear the same point.');r.status='Cleared';r.clearedBy=actor().name;const w=E().workpapers.find(w=>w.id===r.wp);if(w&&E().reviews.filter(n=>n.wp===w.id).every(n=>n.status==='Cleared'))w.status='Cleared';log('Reviewer independently cleared '+r.id+' at workpaper v'+r.version,r.id,'checkcircle');render();toast('Review point cleared for the submitted revision.');},

 'prepare-release':async()=>{if(!roleAllowed('partner'))return;const e=E(),blockers=releaseBlockers();if(blockers.length)throw Error(blockers.join('; '));const manifest={kind:'SYNTHETIC_DEMO_NOT_FOR_PROFESSIONAL_USE',engagement:e.id,client:e.client,revision:e.packageRevision,generation:e.generation,totals:totals(e),approvals:clone(e.approvals)};const serialized=JSON.stringify(canonical(manifest));const hash=await sha256(serialized);if(e.generation!==manifest.generation||e.packageRevision!==manifest.revision)throw Error('The package changed during candidate creation. Try again.');e.candidate={manifest,serialized,hash,revision:e.packageRevision,generation:e.generation};log('Exact demo release candidate prepared',e.id,'lock');render();toast('Candidate manifest frozen and hashed locally.');},

function adminPage(){return head('Platform user administration','Operate the system without assuming a professional role.')+note('These are synthetic personas, not real directory accounts. Technical administration has no automatic access to financial content or report approval.','amber')+`<div class="metric-grid">${metric('Demo personas',14,'From the 14 source roles','users')}${metric('Pending access',rv().accessRequests.filter(r=>r.state==='Pending verification').length,'Separate authority verification','lock','purple')}${metric('Live directories',0,'Entra is not connected','cloud','blue')}${metric('Professional sign-off',0,'Not granted to administrators','shield','amber')}</div>`+queuePanel('User states','Disabling a demo persona blocks its frontend business actions only.',rv().users.map(u=>({title:u.name,meta:u.label,status:u.status,action:'r-user-open',extra:`data-id="${u.id}"`,label:'Review state'})))+footer('§2.1 · GOV-04 · NFR-02');}
function accessRequestsPage(){return head('Approved access operations','Verify entity scope and signing authority before applying a requested role.')+queuePanel('Pending verification','Client-role nominations never become firm staff grants.',rv().accessRequests.map(r=>({title:r.name,meta:r.id+' · '+ROLES[r.role]?.label,status:r.state,action:'r-access-verify',extra:`data-id="${r.id}"`,label:'Verify request'})))+note('The prototype does not provision accounts or expand the 14 fixed role personas. Approval records here illustrate the handoff only.')+footer('LC-07 · GOV-04 · NFR-01–02');}
function operationsPage(){const integrations=[['Microsoft Entra ID','Interactive identity and session lifecycle'],['SharePoint / Microsoft Graph','Selected-resource documents and permission mapping'],['Microsoft 365','Authenticated human document editing'],['Purview / records','Approved retention and observed record controls'],['Email / signing / filing','Separately authorized channels and artifacts'],['Backup and restore','Cross-store recovery and outward-action quarantine']];return head('Integration and operations','Configuration examples, health placeholders and safe recovery boundaries.',btn('Prepare configuration change','r-config-new','soft','','settings'))+note('Every connection is OFF. A configuration draft does not connect an account, create credentials or make a provider request.','amber')+panel('External capability status','No credentials are requested or stored.',`<div class="config-list">${integrations.map(([name,desc])=>`<div class="config-row"><div><h4>${name}</h4><p>${desc}</p></div>${demoStatus('Not connected')}</div>`).join('')}</div>`)+`<div class="mt20">${queuePanel('Configuration change requests','Separate review and environment-specific authorization are required.',rv().draftChanges.map(c=>({title:c.title,meta:c.reason,status:'Draft — not applied',action:'r-config-detail',extra:`data-id="${c.id}"`,label:'View draft'})))}</div>`+panel('Recovery rule','No blind replay of restored operations.',`<div class="panel-pad" style="padding-top:0"><p class="small muted">Pause outward actions, restore records, reconcile provider state and permissions, verify issued-package identities, then obtain authority before resuming. This screen does not execute a restore.</p></div>`)+footer('ARC-11–13 · NFR-04–09');}
function myTimePage(){return head('My time entries','Record your own effort. Independent review is a separate action.',btn('Record time','log-time','primary','','plus'))+queuePanel('Your submitted time','No self-approval.',state.times.filter(t=>t.name===actor().name&&authorizedEng(t.eng)).map(t=>({title:t.task,meta:t.eng+' · '+t.hours+' hours',status:t.status||'Submitted',due:t.date,route:'overview',label:'My workspace'})))+footer('BIL-01–02');}
let pendingRoleCommand=null;
function textField(id,label,placeholder='',value=''){return `<div class="field mt16"><label for="${id}">${esc(label)} *</label><textarea id="${id}" class="input" placeholder="${esc(placeholder)}">${esc(value)}</textarea></div>`;}
function checkField(id,label,checked=false){return `<label class="checkline"><input type="checkbox" id="${id}" ${checked?'checked':''}><span>${esc(label)}</span></label>`;}
function showCommand(title,body,capability,run,label='Record demo action'){pendingRoleCommand={role:state.role,capability,run,selected:state.selected};openModal(title,note('Local demonstration only. No real user, financial transaction, document provider or professional signature is changed.','amber')+body,`${btn('Cancel','close-modal')}${btn(label,'r-confirm','primary')}`,true);}
function reqText(id){return required(id,'Required explanation');}
function checked(id){return !!document.getElementById(id)?.checked;}
function getCase(id){const c=rv().cases.find(x=>x.id===id&&ROLES[state.role].demoClients.includes(x.client));if(!c)throw Error('The requested record is unavailable.');return c;}
function scopedInvoice(id){const i=visibleInvoices().find(x=>x.id===id);if(!i)throw Error('The requested record is unavailable.');return i;}
function requestedContact(id){const r=rv().accessRequests.find(x=>x.id===id);if(!r||(state.role!=='admin'&&!ROLES[state.role].demoClients.includes(r.client)))throw Error('The requested record is unavailable.');return r;}
function roleDetail(k){const r=ROLES[k];if(!r)return;openModal(r.label,`<p class="sub">Source-defined role; proposed screen/grant design.</p><h3 class="mt16">${esc(r.home)}</h3><p class="small mt12">${esc(r.scope)}</p><div class="grid2 mt20"><div><h4 class="mb16">Features and functionalities</h4><ul class="feature-list">${r.features.map(f=>`<li>${icon('arrow')}${esc(f)}</li>`).join('')}</ul><h4 class="mt20 mb16">Eligible actions</h4>${roleList(r.can)}</div><div><h4 class="mb16">Explicit restrictions</h4>${roleList(r.cannot,true)}<h4 class="mt20 mb16">Workflow handoff</h4><p class="small muted">${esc(r.handoff)}</p></div></div><p class="policy-footnote">Source ${esc(r.refs.join(' · '))}. This role has ${ROLE_PERMISSIONS.filter(p=>p.roles.includes(k)).length} proposed scoped activity families. Individual authority, ownership and workflow gates remain mandatory.</p>`,`${btn('Close','close-modal')}${btn('Enter this role view','r-switch-role','primary',`data-role="${k}"`)}`,true);}
function switchRole(k){if(!ROLES[k])return;closeModal();pendingRoleCommand=null;uploadTarget=null;state.role=k;ensureContext();ui.selectedReview=E()?.reviews[0]?.id||'';ui.route='overview';location.hash='overview';save();render();toast('Simulated persona: '+ROLES[k].label+'. No real identity changed.');}
function invoiceDialog(id){const i=scopedInvoice(id);let foot=btn('Close','close-modal');if(i.status==='Draft')foot+=btn('Submit for independent review','r-invoice-submit','primary',`data-id="${i.id}"`);if(i.status==='Approved for issue')foot+=btn('Issue approved demo invoice','invoice-issue','primary',`data-id="${i.id}"`);if(['Issued','Partially paid'].includes(i.status))foot+=btn('Record demo receipt','invoice-receipt','primary',`data-id="${i.id}"`);openModal(i.id+' · firm billing only',note('Synthetic commercial record. Not a payment request, tax invoice or bank receipt.','amber')+`<div class="info-grid"><div><label>Client</label><span>${esc(state.clients.find(c=>c.id===i.client)?.name)}</span></div><div><label>Amount</label><span>${cash(i.amount)}</span></div><div><label>Outstanding</label><span>${cash(i.amount-i.paid)}</span></div></div><p class="sub mt16">${esc(i.description)}</p><div class="mt12">${demoStatus(i.status)}</div><p class="sub mt12">Preparer: ${esc(i.preparedBy)} · Reviewer: ${esc(i.commercialApproval?.by||'Pending')}</p>${['Issued','Partially paid'].includes(i.status)?`<div class="field mt16"><label for="receipt-amount">Demo receipt amount *</label><input class="input" id="receipt-amount" value="${((i.amount-i.paid)/100).toFixed(2)}" inputmode="decimal"></div>`:''}`,foot);}
Object.assign(actions,{
 'r-role-directory':()=>go('role-guide'),'r-my-privileges':()=>go('privileges'),
 'r-filter-group':d=>{roleUi.group=d.group;render();},'r-switch-role':d=>switchRole(d.role),'r-role-detail':d=>roleDetail(d.role),
 'r-export-catalog':()=>download(JSON.stringify({source:'STE-PRD-001 revision 1.0',status:'PROPOSED_ROLE_UI_NOT_PRODUCTION_AUTHORIZATION',roles:ROLES},null,2),'AuditSphere_role_catalogue.json','application/json'),
 'r-export-permissions':()=>download(JSON.stringify({status:'PROPOSED_SCOPED_ACTIVITY_POLICY',permissions:ROLE_PERMISSIONS},null,2),'AuditSphere_role_privileges.json','application/json'),
 'r-confirm':()=>{const c=pendingRoleCommand;if(!c||c.role!==state.role||c.selected!==state.selected||!permission(c.capability)||!roleEnabled())throw Error('This action is unavailable. Reopen it in an authorized role.');c.run();save();pendingRoleCommand=null;closeModal();render();toast('Recorded in the local demonstration only.');},
 'r-intake-open':d=>{const c=getCase(d.id);showCommand(c.id+' · collection checklist',`<p class="small">This is the coordinator’s receipt checklist, not independent verification.</p>${['Entity profile supplied','Ownership/director evidence received','Contact and signatory information received','Scope and terms information collected'].map((label,i)=>checkField('intake-'+i,label,c.checks[i])).join('')}<div class="field mt16"><label for="intake-next">Requested transition</label><select class="input" id="intake-next"><option value="draft">Save collection draft</option><option value="submit">Submit to compliance</option></select></div>`,'intake.write',()=>{const vals=[0,1,2,3].map(i=>checked('intake-'+i));const submit=val('intake-next')==='submit';if(submit&&!vals.every(Boolean))throw Error('Complete all required collection checks before submission.');c.history.push({stage:c.stage,actor:actor().name,time:new Date().toISOString()});c.checks=vals;c.preparedBy=actor().name;c.stage=submit?'Awaiting compliance':'Collecting';c.compliance=null;c.decisionBy=null;addRoleEvent('Intake '+c.id+' '+(submit?'submitted':'saved'),c.client);},'Save / submit checklist');},
 'r-compliance-open':d=>{const c=getCase(d.id);if(!['Awaiting compliance','Compliance hold'].includes(c.stage)){openModal(c.id+' · compliance state',`<p class="small">Current state: ${esc(c.stage)}. An independent review needs a submitted collection file. Existing decisions remain historical.</p>${c.comment?`<p class="sub mt16">${esc(c.comment)}</p>`:''}`,btn('Close','close-modal'));return;}showCommand(c.id+' · restricted disposition',`<p class="small">Prepared by ${esc(c.preparedBy)}. Checks below attest only to the synthetic scenario.</p>${checkField('comp-identity','Identity and ownership evidence reviewed')}${checkField('comp-conflicts','Applicable conflicts and independence concerns considered')}${checkField('comp-open','No unresolved mandatory information/prohibition for an acceptance recommendation')}<div class="field mt16"><label for="comp-decision">Disposition</label><select class="input" id="comp-decision"><option>Compliance hold</option><option>Recommend acceptance</option><option>Recommend decline</option></select></div>${textField('comp-reason','Evidence-based rationale')}`,'compliance.decide',()=>{const decision=val('comp-decision'),reason=reqText('comp-reason');if(c.preparedBy===actor().name)throw Error('An independent checker is required.');if(decision==='Recommend acceptance'&&![checked('comp-identity'),checked('comp-conflicts'),checked('comp-open')].every(Boolean))throw Error('An acceptance recommendation needs all mandatory review checks.');c.compliance=decision;c.comment=reason;c.reviewedBy=actor().name;c.stage=decision==='Compliance hold'?'Compliance hold':'Awaiting partner';c.history.push({decision,reason,actor:actor().name,time:new Date().toISOString()});addRoleEvent('Compliance disposition recorded for '+c.id,c.client);});},
 'r-partner-case':d=>{const c=getCase(d.id);showCommand(c.id+' · partner decision',`<p class="small">Clearance outcome: ${esc(c.compliance||'Pending')}. This view does not disclose restricted case documents.</p><div class="field mt16"><label for="accept-decision">Decision</label><select class="input" id="accept-decision"><option>Hold</option><option>Accept</option><option>Decline</option></select></div>${textField('accept-reason','Decision rationale and permitted scope')}`,'acceptance.decide',()=>{const decision=val('accept-decision'),reason=reqText('accept-reason');if(decision==='Accept'&&(c.compliance!=='Recommend acceptance'||c.stage!=='Awaiting partner'||!c.checks.every(Boolean)))throw Error('Current independent clearances and a submitted partner decision are required.');if(c.preparedBy===actor().name||c.reviewedBy===actor().name)throw Error('Do not self-approve this assessment.');c.stage=decision==='Accept'?'Accepted':decision==='Decline'?'Declined':'Partner hold';c.decisionBy=actor().name;c.history.push({decision,reason,actor:actor().name,time:new Date().toISOString()});state.engagements.filter(e=>e.client===c.client).forEach(e=>{e.acceptance=decision==='Accept';e.generation++;e.candidate=null;});addRoleEvent('Partner '+decision.toLowerCase()+' for '+c.id,c.client);});},
 'r-task-open':d=>{const t=rv().tasks.find(x=>x.id===d.id&&authorizedEng(x.eng));if(!t)throw Error('Unavailable task.');showCommand(t.id+' · ownership and date',`<p class="small">${esc(t.title)} · ${t.eng}</p><div class="field-grid mt16"><div class="field"><label for="task-owner">Responsible existing role</label><select class="input" id="task-owner">${['preparer','reviewer','manager','partner','eqr'].map(k=>`<option value="${k}" ${t.owner===k?'selected':''}>${ROLES[k].name} · ${ROLES[k].label}</option>`).join('')}</select></div><div class="field"><label for="task-due">Due date *</label><input class="input" type="date" id="task-due" value="${t.due}"></div></div>${textField('task-reason','Assignment/change reason')}`,'team.assign',()=>{const owner=val('task-owner'),due=required('task-due','Due date'),reason=reqText('task-reason');const e=state.engagements.find(e=>e.id===t.eng);if(!ROLES[owner].demoClients.includes(e.client))throw Error('The selected individual does not have this engagement scope.');if(owner!==t.owner)throw Error('This task requires its existing professional function. Use a separately verified same-function substitute in production; do not turn a preparer into a reviewer by assignment.');t.due=due;addRoleEvent('Task deadline updated: '+t.id+' · '+reason,e.client);});},
 'r-time-review':d=>{const t=state.times[Number(d.index)];if(!t||!authorizedEng(t.eng))throw Error('Unavailable time entry.');showCommand('Review time entry',`<p class="small">${esc(t.name)} · ${esc(t.task)} · ${t.hours} hours</p>${textField('time-reason','Review explanation')}`,'time.review',()=>{if(t.name===actor().name)throw Error('You cannot independently approve your own time.');t.status='Approved';t.reviewedBy=actor().name;t.reviewReason=reqText('time-reason');addRoleEvent('Time entry reviewed',state.engagements.find(e=>e.id===t.eng).client);});},
 'r-renewal-note':d=>{if(!authorizedEng(d.id))throw Error('Unavailable relationship.');showCommand('Record renewal follow-up',textField('renewal-reason','New-period facts / follow-up needed'),(state.role==='onboarding'?'intake.write':'lead.write'),()=>{rv().events.unshift({text:'Renewal coordination: '+reqText('renewal-reason'),scope:state.engagements.find(e=>e.id===d.id).client,role:state.role,actor:actor().name,time:new Date().toISOString()});});},
 'r-contact-new':()=>nominationDialog('client.nominate'),'r-invitation-new':()=>nominationDialog('intake.write'),

 'r-pbc-assign':d=>{const p=E().pbc.find(p=>p.id===d.id);if(!p)throw Error('Unavailable request.');showCommand('Assign client contributor',`<p class="small">${esc(p.title)}</p><div class="field mt16"><label for="pbc-owner">Verified contributor for this entity</label><select class="input" id="pbc-owner"><option>Rami Nasser</option></select></div>${textField('pbc-owner-reason','Assignment reason')}`,'pbc.assign',()=>{p.contributor=val('pbc-owner');addRoleEvent('PBC contributor assigned: '+p.id+' · '+reqText('pbc-owner-reason'),E().client);});},

 'r-journal-consent':()=>showCommand('Management adjustment decision',`<p class="small">Proposed amount ${cash(E().adjustment)}. Existing status: ${esc(E().journalState)}. Approved reporting adjustments do not automatically post into an external or firm ledger.</p><div class="field mt16"><label for="aj-consent">Decision</label><select class="input" id="aj-consent"><option>Accept</option><option>Reject</option></select></div>${textField('aj-consent-reason','Management reason')}`,'journal.consent',()=>{const e=E();if(e.journalState!=='Management pending')throw Error('This journal is not awaiting a new management decision.');if(!e.journalTechnical||e.journalTechnical.amount!==e.adjustment||e.journalTechnical.revision!==(e.journalRevision||1))throw Error('Current independent technical review is required first.');const accepted=val('aj-consent')==='Accept';e.journalState=accepted?'Applied':'Rejected';e.journalManagement={by:actor().name,decision:val('aj-consent'),reason:reqText('aj-consent-reason')};changed('Management '+(accepted?'accepted':'rejected')+' reporting adjustment');}),
 'r-management-approve':()=>showCommand('Approve the exact management package',`<p class="small">Package v${E().packageRevision} · input generation ${E().generation}. This is management’s responsibility, not approval of the auditor’s opinion.</p>${checkField('mgmt-responsible','I accept management responsibility for the presented accounts in this synthetic scenario')}${textField('mgmt-reason','Approval statement')}`,'management.approve',()=>{approvalPrecheck('client');if(!checked('mgmt-responsible'))throw Error('Management responsibility must be confirmed.');E().approvals.client={generation:E().generation,packageRevision:E().packageRevision,actor:actor().name,time:new Date().toISOString(),scope:'client',statement:reqText('mgmt-reason')};addRoleEvent('Management approved exact package v'+E().packageRevision,E().client);}),

 'r-ack-delivery':d=>{const r=E().releases.find(r=>r.id===d.id&&r.delivered);if(!r)throw Error('No delivered package is available.');rv().acknowledgements[E().id+'/'+r.id]={by:actor().name,time:new Date().toISOString()};addRoleEvent('Client acknowledged delivered package '+r.id,E().client);render();toast('Demo acknowledgement recorded; not account approval.');},

const GENERIC_ACTIONS=new Set(['menu','close-modal','search','activity','about','reset','confirm-reset','source','service-detail','lifecycle-detail','r-role-directory','r-my-privileges','r-filter-group','r-switch-role','r-role-detail','r-export-catalog','r-export-permissions','tour','tour-requirements']);
function allowedAction(name,d={}){
 if(GENERIC_ACTIONS.has(name))return true;
 if(!roleEnabled())return false;
 if(name==='r-confirm')return !!pendingRoleCommand&&pendingRoleCommand.role===state.role&&permission(pendingRoleCommand.capability);
 if(BASE_ACTION_RULES[name])return permission(BASE_ACTION_RULES[name]);
 if(name==='r-renewal-note')return ['relationship','onboarding'].includes(state.role);
 if(name==='r-contact-detail')return ['client_admin','onboarding','admin'].includes(state.role);
 if(name==='r-ack-delivery'||name==='client-query'||name==='save-client-query')return isClientRole();
 if(name==='invoice')return state.role==='billing';
 if(name==='lead-detail')return state.role==='relationship';
 if(name==='package-approve')return state.role===d.key&&permission({manager:'manager.approve',client:'management.approve',partner:'partner.approve',eqr:'eqr.complete'}[d.key]);
 if(['open-reviews','open-approvals'].includes(name))return routeAllowed('reviews');
 if(name==='open-overview')return true;
 if(name==='eng-open')return !isClientRole()&&state.role!=='admin'&&!!d.id&&authorizedEng(d.id);
 if(name==='client-detail')return routeAllowed('clients')&&visibleClients().some(c=>c.id===d.id);
 if(name==='service-for-eng')return routeAllowed('services');
 if(name==='pbc-detail')return ['preparer','reviewer','manager','client_finance'].includes(state.role)&&(!d.id||E().pbc.some(p=>p.id===d.id&&(state.role!=='client_finance'||p.contributor===actor().name)));
 if(['preview-report','export-report','print-report'].includes(name))return permission('financial.read')||(state.role==='client'&&isCurrent('manager'));
 if(['released-preview','released-download'].includes(name))return ['partner','records'].includes(state.role)||(isClientRole()&&E().releases.some(r=>r.id===d.id&&r.delivered));
 if(name==='release-export')return ['partner','records'].includes(state.role);
 if(['tb-template','export-tb','reconciliation','supplements'].includes(name))return permission('financial.read');
 if(['workpaper','planning','sample-result','summary-memo','announcement','report-memo','select-review'].includes(name))return ['preparer','reviewer','manager','partner'].includes(state.role);
 if(name==='offboarding')return ['records','partner'].includes(state.role);
 if(name==='tab')return !isClientRole()&&state.role!=='admin';
 if(name==='tour-accounting')return routeAllowed('accounting');
 return false;
}

function filteredEvents(){return rv().events.filter(ev=>{if(isClientRole())return ev.scope==='CL-001'&&['client_admin','client_finance','client'].includes(ev.role);if(state.role==='admin')return ev.role==='admin';if(state.role==='billing')return ['billing','manager'].includes(ev.role)&&/invoice|receipt|commercial|billing|proposal/i.test(ev.text);if(state.role==='compliance')return ev.role==='compliance'&&ROLES[state.role].demoClients.includes(ev.scope);if(ev.role==='compliance'||ev.role==='admin')return false;return ev.role===state.role||(ev.scope&&ROLES[state.role].demoClients.includes(ev.scope));});}
actions.activity=()=>openModal('Your local activity',`<p class="sub mb16">Editable browser history, not a secure audit log.</p>${filteredEvents().map(ev=>`<div class="activity"><div class="activity-dot">${icon('clock')}</div><div><p>${esc(ev.text)}</p><small>${esc(ev.actor)} · ${esc(ev.time)}</small></div></div>`).join('')||'<div class="empty">No visible role activity yet.</div>'}`,btn('Close','close-modal'));
actions.tour=()=>openModal('Explore the complete role handoffs',`<p class="small">Use the top-right simulator to switch among 14 source roles. It is a presentation control, not a real login.</p>${[['1','Commercial → onboarding → compliance → partner','Prepare a proposal, collect CASE-003 evidence, submit for compliance, then obtain a distinct partner decision.'],['2','Client administrator → finance contributor','Nominate a contact, assign a document request, then upload a built-in synthetic sample as the contributor.'],['3','Preparer → senior → manager','Respond to review points, clear them independently, rebuild the package as preparer, then record manager review.'],['4','Client signatory → partner → quality reviewer','Approve the presented accounts, attest representations, respond to EQR concerns as manager, then record EQR as its independent reviewer.'],['5','Partner → records administrator','Issue the frozen demo package, record authorized dispatch, assemble its manifest and demonstrate hold/disposition blocking.'],['6','Billing officer → manager → billing officer','Prepare/submit an invoice, review it independently, then issue and record a bounded synthetic receipt.']].map(([n,t,p])=>`<div class="tour-step"><div class="stepnum">${n}</div><div><h4>${t}</h4><p>${p}</p></div></div>`).join('')}<p class="policy-footnote">System administration is a separate technical view. No role selection grants actual provider access, signs a document or creates a production approval.</p>`,`${btn('Close','close-modal')}${btn('Explore all roles','r-role-directory','primary')}`,true);
actions.about=()=>openModal('AuditSphere · all-role visualization',`<h3>14 source roles · 44 proposed activity families</h3><p class="sub mt16">Source: STE-PRD-001 revision 1.0, §§2 and 21, supported by the lifecycle and approval requirements. Role duties are source-derived; dashboard layouts and narrower default permissions are proposed design decisions.</p><p class="sub mt16">This extends the earlier interactive prototype with role-specific homepages, navigation, record projections, command checks and handoffs. It preserves the original prototype and source documents.</p><p class="sub mt16">No backend, authentication, enforceable multi-user security, secure storage, live Microsoft integration, legal signature, real financial posting, complete methodology or production retention is implemented. Source files and all demo data remain inspectable by anyone who has this HTML. Use synthetic data only.</p>`,btn('Close','close-modal'),true);
updateSearch=function(query){const q=query.toLowerCase();const items=ROLES[state.role].routes.map(route=>({title:ROLE_ROUTES[route][0],sub:'Permitted workspace',route}));if(['preparer','reviewer','manager','partner'].includes(state.role))items.push(...visibleEngagements().map(e=>({title:state.clients.find(c=>c.id===e.client)?.name,sub:e.id,eng:e.id})));const matches=items.filter(x=>(x.title+' '+x.sub).toLowerCase().includes(q)).slice(0,12),target=document.getElementById('search-results');if(target)target.innerHTML=matches.length?matches.map(x=>`<button class="search-result" ${x.route?`data-route="${x.route}"`:`data-action="eng-open" data-id="${x.eng}"`}>${icon(x.route?'grid':'users')}<div><b class="small">${esc(x.title)}</b><small>${esc(x.sub)}</small></div></button>`).join(''):'<div class="empty">No matching records in this role’s scope.</div>';};
render=function(){initRoleState();ensureContext();if(!routeAllowed(ui.route)){ui.route='overview';if(location.hash!=='#overview')history.replaceState(null,'','#overview');}const r=ROLES[state.role],title=ROLE_ROUTES[ui.route]?.[0]||r.home;const main=roleEnabled()?scopedView(()=>pages[ui.route]()):roleHome();const groups=['Commercial','Professional','Client','Operations'];document.getElementById('app').innerHTML=`<div class="mobile-overlay" data-action="menu" id="mobile-overlay"></div><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">${icon('layers')}</div><div class="brandname">Audit<span>Sphere</span></div></div><div class="workspaceselect"><span class="firmavatar">STE</span><span>STE Audit & Accounting<div style="font-size:9px;color:#8daba7;margin-top:1px">${esc(r.group)} workspace</div></span></div><div class="portal-nav-context">${esc(r.label)}<br><span class="role-mini">${isClientRole()?'CLIENT PORTAL':'ROLE-SCOPED WORKSPACE'}</span></div><nav class="side-scroll" aria-label="Role navigation"><div class="nav-label">YOUR WORKSPACE</div>${r.routes.filter(routeAllowed).map((route,i)=>`${route==='role-guide'?'<div class="nav-label">DESIGN REFERENCE</div>':''}<button class="navitem ${route===ui.route?'active':''}" data-route="${route}" ${route===ui.route?'aria-current="page"':''}>${icon(ROLE_ROUTES[route][1])}<span>${route==='overview'?'My dashboard':esc(ROLE_ROUTES[route][0])}</span></button>`).join('')}</nav><div class="side-footer"><div class="side-demo"><strong>14-role interactive visualization</strong>All data is synthetic.<br>No real login or secure access control.</div><button class="navitem" data-action="reset">${icon('refresh')}Reset local demo</button></div></aside><div class="shell"><header class="topbar"><div class="topbar-left"><button class="icon-btn mobile-menu" data-action="menu" aria-label="Open navigation">${icon('menu')}</button><div class="role-breadcrumb">${esc(r.group)} / <b>${esc(title)}</b></div><button class="search-trigger" data-action="search">${icon('search')}Search your workspace<kbd>/</kbd></button></div><div class="topbar-right"><button class="icon-btn" data-action="tour" aria-label="Explore role handoffs">${icon('play')}</button><button class="icon-btn" data-action="activity" aria-label="Your local activity">${icon('bell')}</button><div class="persona">${avatar(r.initials,r.group==='Client'?'blue':'')}<div><label for="role-select">DEMO PERSONA · NOT A LOGIN</label><select id="role-select" aria-label="Switch simulated user role">${groups.map(g=>`<optgroup label="${g}">${Object.entries(ROLES).filter(([k,v])=>v.group===g).map(([k,v])=>`<option value="${k}" ${k===state.role?'selected':''}>${esc(v.label)}</option>`).join('')}</optgroup>`).join('')}</select></div></div></div></header><main class="main" id="main" tabindex="-1">${main}</main></div>`;document.title=`${r.label} · AuditSphere Role Prototype`;};
// A centralized frontend guard keeps the visualization internally consistent.
// It does not protect HTML/localStorage from a user with developer tools.
for(const [name,fn] of Object.entries(actions)){actions[name]=async function(d={}){if(!allowedAction(name,d))throw Error('This action is not permitted for the selected demo role.');if(d.eng&&!authorizedEng(d.eng)&&state.role!=='admin')throw Error('The requested record is unavailable.');return fn(d);};}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(target&&!allowedAction(target.dataset.action,target.dataset)){event.preventDefault();event.stopImmediatePropagation();toast('This action is not permitted for this role.','warn');}},true);
document.addEventListener('change',event=>{const t=event.target;if(t.id==='role-select'){event.stopImmediatePropagation();switchRole(t.value);return;}if(t.id==='eng-select'&&!authorizedEng(t.value)){event.stopImmediatePropagation();render();toast('The requested context is unavailable.','warn');return;}if(t.id==='document-picker'&&!permission('pbc.upload')||t.id==='tb-picker'&&!permission('tb.import')){event.stopImmediatePropagation();toast('This upload action is outside the selected role.','warn');return;}if(t.dataset.change==='mapping'&&!permission('mapping.write')||t.dataset.change==='assessment-item'&&!permission('intake.write')||t.dataset.change==='annual'&&state.role!=='partner'){event.stopImmediatePropagation();render();toast('This edit is outside the selected role.','warn');}},true);
const resetAction=actions['confirm-reset'];actions['confirm-reset']=async d=>{await resetAction(d);initRoleState();state.role='manager';render();save();};
// No v1 state is migrated or deleted; v2 uses its own localStorage key.
initRoleState();ensureContext();render();save();

</script></body></html>
