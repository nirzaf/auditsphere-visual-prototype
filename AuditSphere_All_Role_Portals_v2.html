@media(max-width:620px){.topbar{padding:0 15px;gap:8px}.topbar-right{gap:7px}.topbar-right>.demo-pill{display:none}.persona select{width:204px;max-width:59vw;font-size:11px}.persona .avatar{display:none}.main{padding:20px 15px}.role-card-grid{grid-template-columns:1fr}.role-banner{padding:20px}.role-banner h2{font-size:22px}.grid2{grid-template-columns:1fr}.profile-tabs{gap:6px}.config-row{align-items:flex-start}.config-row .btn{white-space:normal}.role-scope{font-size:10px}.role-banner p{font-size:11px}.pagehead{flex-direction:column}.pagehead .head-actions{flex-wrap:wrap}.role-breadcrumb{display:none}.metric-grid{grid-template-columns:repeat(2,1fr)}.case-timeline b{font-size:10px}.tablewrap{max-width:100%}}
</style></head><body><div id="app"></div><div id="modal-root"></div><div class="toast-stack" id="toasts" aria-live="polite"></div><input type="file" id="document-picker" class="hidden" accept=".pdf,.docx,.xlsx,.csv,.txt,.png,.jpg,.jpeg"><input type="file" id="tb-picker" class="hidden" accept=".csv,text/csv"><noscript>JavaScript is needed for this local demonstration. No actual authentication or provider operations are implemented.</noscript><script type="application/json" id="prd-data">{"title": "STE Audit & Accounting Practice Platform", "documentId": "STE-PRD-001", "revision": "1.0", "sha256": "2008eab24851566d995db9bd96a046d6cd7b1ff75611341a379e7db1af5b2925", "sections": [{"id": 1, "title": "1. Purpose, scope, and operating principles", "blocks": [{"kind": "heading", "text": "1.1 Business objectives"}, {"kind": "paragraph", "text": "OBJ-01. Establish one controlled workspace for each client relationship, with separate legal entities, engagements, periods, workpapers, financial datasets, and deliverables."}, {"kind": "paragraph", "text": "OBJ-02. Make every transition explainable: identify its required inputs, permitted actor, processing rules, resulting records, reviewer, approval evidence, and next permitted state."}, {"kind": "paragraph", "text": "OBJ-03. Support accounting production and independent assurance without confusing management's responsibility for accounts with the auditor's responsibility for an opinion."}, {"kind": "paragraph", "text": "OBJ-04. Preserve traceability from an issued financial-statement line to its reporting mapping, adjusted trial balance, adjustment, source account, and underlying evidence."}, {"kind": "paragraph", "text": "OBJ-05. Make the platform reproducible, maintainable, upgradeable, and operationally supportable through licensed baselines, controlled extensions, migrations, documented interfaces, and tested releases."}, {"kind": "heading", "text": "1.2 Scope"}, {"kind": "paragraph", "text": "The system shall manage acquisition; discovery; acceptance and continuance; proposals and engagement letters; client portal access; entity setup; recurring service calendars; document collection; trial-balance and transaction imports; bookkeeping; reconciliations; adjusting entries; financial statements; audit workpapers; review notes; approval and sign-off; regulatory submission where contracted; billing; delivery; archiving; annual validation; suspension; termination; and data handover."}, {"kind": "paragraph", "text": "The twelve service definitions represented in the codebase are retained in section 17. Bookkeeping, annual accounts, tax compliance, payroll administration, compilation, review, and agreed-upon procedures are additional target service templates where the firm chooses to offer them. They shall not silently inherit an external-audit opinion or audit-only approval checklist. [S2]"}, {"kind": "paragraph", "text": "Scope boundaries. A general-purpose ERP rewrite, autonomous professional opinions, automatic bank payment execution, public multi-firm SaaS commercialization, and jurisdictional certification are not prerequisites. Inventory, payroll, purchasing, fixed-asset, and other integrations are activated only for contracted service requirements. An import or reconciliation capability does not imply authority to move money."}, {"kind": "heading", "text": "1.3 Requirement conventions"}, {"kind": "paragraph", "text": "M — mandatory: required to complete the named stage. Drafts may be saved with missing fields, but cannot pass the gate. C — conditional: becomes mandatory when its stated condition applies. O — optional: may be omitted without blocking the stage. Optional work becomes a tracked obligation once included in the signed scope."}, {"kind": "paragraph", "text": "Every requirement identifier is stable. Lifecycle requirements use LC-01 to LC-26; architectural requirements use ARC; security and quality requirements use NFR; transition requirements use TR. A configured alternative must name the policy, owner, rationale, and acceptance test. “Not applicable” is a decision with evidence, not an empty field."}]}, {"id": 2, "title": "2. Roles, responsibilities, and authority", "blocks": [{"kind": "heading", "text": "2.1 Roles"}, {"kind": "table", "rows": [["Role", "Authorized responsibilities", "Restriction"], ["Relationship owner", "Lead qualification, discovery, proposals, relationship communication", "Cannot self-approve compliance or professional conclusions"], ["Onboarding coordinator", "Collect profiles, evidence, signatures, and access requests", "Cannot approve own acceptance assessment"], ["Compliance officer", "Identity, ownership, conflicts, AML applicability, acceptance recommendation", "Restricted records remain outside the general client portal"], ["Engagement partner / lead auditor", "Acceptance, significant judgments, engagement quality, final report authorization", "Cannot substitute commercial acceptance for audit evidence"], ["Engagement manager", "Scope, staffing, timetable, production oversight, engagement review", "Cannot approve work they materially prepared without an independent substitute"], ["Preparer / associate", "Imports, accounting work, reconciliations, draft workpapers, responses", "Cannot approve or clear their own work"], ["Senior reviewer", "First-level review and clearance of review points", "Must not be the preparer of the reviewed version"], ["Engagement quality reviewer", "Independent evaluation when an EQR is required", "Separate eligibility and independence requirements apply"], ["Client administrator", "Nominate contacts, manage requests within authorized entities", "Cannot grant firm-staff roles or expand entity scope"], ["Client finance contributor", "Supply documents, answer queries, propose factual corrections", "Cannot post into the firm's ledger or clear firm review notes"], ["Client authorized signatory", "Accept engagement terms, approve management matters and accounts", "Does not approve the auditor's independent opinion"], ["Billing officer", "Firm invoices, collections, credits, time and expense administration", "Billing status does not determine professional conclusions"], ["Records administrator", "File assembly, retention, legal holds, controlled disposition", "Cannot alter signed workpaper content"], ["System administrator", "Deployment, configuration, backups, access operations", "Technical privilege does not confer professional signing authority"]]}, {"kind": "paragraph", "text": "A small team may combine compatible roles. It shall still assign a different qualified individual to the checker function. Where internal separation is impractical, an authorized external reviewer is a supported option; self-approval is not."}, {"kind": "heading", "text": "2.2 Common approval record"}, {"kind": "paragraph", "text": "GOV-01. Each approval shall store object ID, object version, tenant/entity/engagement scope, stage, decision, approver identity, role at approval, timestamp, statement of approval, conditions, evidence links, and the object's content hash. Permitted decisions are Approve, Return for rework, Reject, and Request clarification. Conditional acceptance is available only at stages whose policy permits it."}, {"kind": "paragraph", "text": "GOV-02. A new material version shall invalidate dependent approvals and notify affected reviewers. No approver may approve a version different from the version displayed. Concurrent edits shall produce a revision conflict rather than silently overwrite content."}, {"kind": "paragraph", "text": "GOV-03. Client acceptance, journal authorization, workpaper clearance, management approval of accounts, partner opinion approval, EQR completion, release authorization, and archive completion are separate records. None is inferred merely from task completion, a signature image, a comment, or an email being sent."}, {"kind": "paragraph", "text": "GOV-04. Delegation requires scope, start/end, reason, qualified delegate, and authorizer. Delegates inherit restrictions, not extra privilege. Inactive staff cannot approve. Access removal shall trigger reassignment of open responsibilities without rewriting historical attribution."}]}, {"id": 3, "title": "3. Core records, ownership, and information model", "blocks": [{"kind": "heading", "text": "3.1 Required hierarchy"}, {"kind": "paragraph", "text": "Practice / tenant\n  ├─ Firm office entity → firm billing and office ledger\n  └─ Client relationship\n       ├─ Contacts and authority grants\n       ├─ Acceptance / annual validation snapshots\n       └─ One or more legal entities\n            ├─ Entity accounting configuration and ledger(s)\n            ├─ Financial periods\n            └─ Engagements / Perfex projects\n                 ├─ Service scope and signed terms\n                 ├─ Team, timetable, budget, and tasks\n                 ├─ PBC requests and document versions\n                 ├─ Imported TB snapshots and adjustments\n                 ├─ Workpapers, review notes, approvals\n                 └─ Report packages, delivery, and archive"}, {"kind": "paragraph", "text": "DAT-01. A client relationship may contain several legal entities. A legal entity may have several engagements in one year and engagements over many years. Financial periods belong to the entity, not exclusively to one project. Multiple engagements may refer to one immutable period snapshot without posting the same entry twice."}, {"kind": "paragraph", "text": "DAT-02. A group engagement shall explicitly list participating entities and consolidation scope. Group-level reporting does not grant access to unrelated clients. Consolidation entries belong to a consolidation ledger and do not overwrite subsidiary books."}, {"kind": "paragraph", "text": "DAT-03. Every business record shall have a stable system ID; human-readable reference; tenant ID; applicable entity, engagement, and period IDs; version; status; creator/updater; timestamps; classification; source; and retention category. Foreign keys and queries shall enforce consistent scope. Client IDs, project IDs, and ledger IDs are not interchangeable."}, {"kind": "paragraph", "text": "DAT-04. Firm invoices for professional fees belong to the firm's office ledger. Client bookkeeping entries belong to the client's entity ledger. A fee invoice shall not become client-ledger income merely because its CRM customer or project is selected. Posting a corresponding client expense requires its own authorized source and workflow."}, {"kind": "heading", "text": "3.2 Three supported accounting modes"}, {"kind": "table", "rows": [["Mode", "Authoritative books", "System transformation", "Posting rule"], ["Managed bookkeeping", "Entity ledger within the platform's approved accounting boundary", "Source transactions → approved journal → posted ledger → TB", "One posting authority and one source-event key"], ["External books / audit workspace", "Client's approved external accounting system", "External TB snapshot + approved audit adjustments → adjusted reporting TB", "Audit adjustments do not automatically alter external books"], ["Reporting-only / advisory", "Approved uploaded financial datasets", "Validated dataset → mapping / schedules / model → deliverable", "No operational GL posting unless separately contracted"]]}, {"kind": "paragraph", "text": "The mode is mandatory per engagement and immutable after financial processing begins except through a controlled conversion. An external-books adjustment separately records Proposed, Client-approved, Included in reporting, Exported, and Confirmed posted externally. A later replacement TB shall identify whether it already includes each adjustment."}, {"kind": "heading", "text": "3.3 Data-entry rules"}, {"kind": "paragraph", "text": "Dates use a locale-aware display and an unambiguous stored date; event timestamps are stored in UTC with source timezone retained. Monetary values use fixed-precision decimals and a currency code; exchange rates use higher precision. Identifiers preserve leading zeros. Empty, zero, unknown, and not applicable are distinct values. Rich text is sanitized; descriptions remain separate from structured fields."}, {"kind": "paragraph", "text": "Every field definition shall specify label, type, allowed values, M/C/O status, condition, maximum length, validation, source, edit permissions, confidentiality, and whether a change invalidates downstream work. Defaults must be visible and editable where authorized. Imported values preserve original text alongside normalized values."}]}, {"id": 4, "title": "4. Firm setup and configurable policy", "blocks": [{"kind": "paragraph", "text": "SET-01 — mandatory before onboarding. Configure firm identity and offices; currencies and rounding; timezone and working calendar; service catalogue; document numbering; lead sources and statuses; role permissions; approval routes; client categories; accepted file types and limits; email sender; templates; storage; and data-retention policy. Named owners approve the configuration."}, {"kind": "paragraph", "text": "SET-02 — mandatory before production work. Configure entity accounting policies, financial year-end, period calendar, reporting frameworks, chart templates, import layouts, reconciliation tolerances, materiality policy, report templates, staff rates, budgets, and delivery/filing checklists. Accounting-method defaults must not silently override the engagement's reporting basis."}, {"kind": "paragraph", "text": "SET-03 — conditional. Jurisdiction profiles shall define relevant registrations, turnover/assets/headcount tests, measurement windows, currency conversion, threshold operators, filing dates, extensions, holiday rules, evidence, source authority, effective periods, and reviewer. No country-specific threshold or tax rate is hard-coded as globally applicable."}, {"kind": "paragraph", "text": "SET-04 — optional. Enable bank feeds, external e-signing, cloud document storage, SSO, SMS, scheduling integrations, accounting APIs, consolidation, or specialist service packs only with approved configuration, authorization, and tests. A disabled integration shall not prevent a supported manual workflow."}, {"kind": "paragraph", "text": "SET-05. Configuration and templates are versioned: Draft → Reviewed → Published → Retired. Existing engagements retain their selected versions. Applying a new policy to active work requires an impact review; historical signed outputs are not restyled or recalculated automatically."}]}, {"id": 5, "title": "5. State model and universal processing contract", "blocks": [{"kind": "heading", "text": "5.1 Separate state machines"}, {"kind": "paragraph", "text": "Lead: New → Screening → Discovery → Evaluation → Qualified → Proposal drafting → Proposal sent → Negotiation → Accepted subject to onboarding → Converted. Alternative endings: Duplicate-linked, Disqualified, Lost, Deferred, Withdrawn."}, {"kind": "paragraph", "text": "Client relationship: Prospect → Onboarding → Active → Continuance due → Active renewed. Alternatives: Restricted, Suspended, Terminating, Terminated, Archived. Closing one engagement does not terminate the client."}, {"kind": "paragraph", "text": "Engagement: Draft → Acceptance pending → Terms pending → Ready to activate → Active/planning → Collection → Production → Senior review → Manager review → Management clearance → Partner final review → Release authorized → Delivered → File assembly → Archived. Permitted branches include Returned, On hold, Scope change, Reopened, and Withdrawn."}, {"kind": "paragraph", "text": "Workpaper: Not started → Preparing → Submitted → In review → Returned → Resubmitted → Cleared → Manager approved → Partner signed where required → Locked. Review note: Open → Responded → Cleared, or Reopened. Journal: Draft → Validated → Submitted → Approved → Posted → Reversed. “Posted” is never a deletable draft."}, {"kind": "paragraph", "text": "Report package: Draft → Internally reviewed → Management approved → Partner authorized → Issued → Superseded if formally reissued. Filing: Not required, Pending authorization, Ready, Submitted, Accepted, Rejected, Corrected, or Closed."}, {"kind": "heading", "text": "5.2 Rules applied at every lifecycle stage"}, {"kind": "paragraph", "text": "WF-01. Entry checks validate actor, object scope, prerequisites, required fields, current revision, and outstanding blocking items on the server. UI visibility alone is not enforcement."}, {"kind": "paragraph", "text": "WF-02. Save draft is distinct from Submit, Approve, Post, Issue, and Archive. The server derives statuses and totals; a client request cannot set them arbitrarily."}, {"kind": "paragraph", "text": "WF-03. On a valid transition, the system atomically updates business records, approval/state history, and an outbox event. Notifications run after commit. A failed email does not undo an approved business state or falsely show a successful delivery."}, {"kind": "paragraph", "text": "WF-04. Each action has an idempotency key, actor, correlation ID, and outcome. Retries shall not create duplicate clients, projects, documents, journals, or invoices. Partial batch imports are not silently accepted; policy must explicitly permit and report partial processing."}, {"kind": "paragraph", "text": "WF-05. Required missing information yields “Awaiting information,” the exact missing fields, owner, due date, and next action. A hold pauses only designated operational timers, not legal deadlines. Optional steps may be skipped with an explicit reason; mandatory professional requirements cannot be waived by an administrator."}]}, {"id": 6, "title": "6. Acquisition and commercial onboarding", "blocks": [{"kind": "heading", "text": "LC-01. Capture the inquiry"}, {"kind": "paragraph", "text": "Entry and owner. A web form, referral, phone call, email, event, or authorized manual entry creates an inquiry owned by the relationship team."}, {"kind": "paragraph", "text": "Required inputs. Contact name; business or individual name; one valid contact channel; inquiry source; service interest; jurisdiction or “not yet established”; received timestamp; privacy notice acknowledgement where collected through a public form. Optional inputs. Registration number, website, preferred language, referral partner, estimated turnover band, target completion date, location, and a non-sensitive introductory attachment."}, {"kind": "paragraph", "text": "Mandatory processing. Validate contact formats and source; rate-limit public submissions; normalize names and domains; search candidate duplicates by registration/contact details; assign an owner and response target; create the lead and original inquiry record. Marketing consent is separate from service communication permission."}, {"kind": "paragraph", "text": "Optional processing. Route by service, language, office, or referral; send a scheduling link; enrich public company data with source attribution. Public forms shall not request sensitive beneficial-owner identity scans at this stage."}, {"kind": "paragraph", "text": "Transformation and exit. Raw submission → normalized Lead + Contact candidate + source/consent record + screening task. The original submission remains immutable. Suspected duplicates go to human resolution, not automatic destructive merging. Lead enters Screening after assignment. Automated acknowledgement contains a reference, not a claim of engagement acceptance. [S5]"}, {"kind": "heading", "text": "LC-02. Initial screening and duplicate resolution"}, {"kind": "paragraph", "text": "Required inputs. Lead ID; service fit; requested deadline; industry; jurisdiction; duplicate assessment; assigned screener. Conditional inputs. Conflict-screening names and immediate independence concerns where assurance is requested. Optional inputs. Initial fee range, estimated transaction volume, and preliminary records-quality assessment."}, {"kind": "paragraph", "text": "Mandatory steps. Confirm contactability; check whether the firm offers the service and can meet the timetable; determine whether the lead is new, an existing client requesting another service, or a duplicate. Preserve source attribution when linking duplicate inquiries. Record rejection/defer reasons without exposing confidential internal assessments to the prospect."}, {"kind": "paragraph", "text": "Review and outputs. The relationship owner approves Qualified for discovery, More information, Deferred, or Disqualified. A duplicate merge requires an authorized reviewer, a surviving ID, field-level conflict decisions, and retained aliases/history. Existing clients receive a new opportunity linked to the same client, not a second client identity."}, {"kind": "paragraph", "text": "Automation. Create discovery task and reminders; stop proposal automation for disqualified leads; keep a consent-aware follow-up date for deferred leads. Reopened leads return through current screening rather than inherit expired qualification."}, {"kind": "heading", "text": "LC-03. Discovery and service definition"}, {"kind": "paragraph", "text": "Required inputs. Legal entities in scope; services; objectives and intended users; reporting/assessment period; deadline; responsible client contact; current accounting environment; approximate scale; expected deliverables; reason for seeking the service. Conditional inputs. Prior auditor/accountant, regulated status, group structure, external-bookkeeping system, audit requirements, inventory locations, payroll size, and cross-border operations. Optional inputs. Site visit, prior reports, process diagrams, and an early data sample."}, {"kind": "paragraph", "text": "Mandatory steps. Hold and record the discovery discussion; confirm client expectations; distinguish bookkeeping, preparation, audit, and advisory services; identify access needs and management responsibilities; identify specialist skills; prepare a scoped service brief with inclusions, exclusions, assumptions, dependencies, timeline, and cost basis."}, {"kind": "paragraph", "text": "Review. Engagement manager validates technical scope and deliverability. Assurance requests also receive a preliminary independence assessment. No firm commitment is made solely by a salesperson selecting an audit service."}, {"kind": "paragraph", "text": "Transformation. Lead information → versioned Discovery brief → draft Opportunity/service lines → acceptance questionnaire selection → resource estimate. Recording one entity for billing does not imply that all group entities are engagement subjects."}, {"kind": "paragraph", "text": "Exit and automation. Discovery approved creates a formal evaluation case. Missing records or unrealistic deadlines produce a clarification task and revised estimate, not an invented completion date."}, {"kind": "heading", "text": "LC-04. New-client evaluation and acceptance"}, {"kind": "paragraph", "text": "Required inputs. Completed applicable questionnaire from section 7; evidence checklist; entity/ownership identifiers; service scope; conflicts and independence assessments; competence/capacity assessment; commercial viability; appointed approver. Conditional inputs. Identity verification, beneficial ownership, PEP/sanctions checks, predecessor communication, regulator requirements, and enhanced due diligence according to jurisdiction and service."}, {"kind": "paragraph", "text": "Mandatory steps. Verify supplied information; classify inherent client/engagement risk under an approved policy; document discrepancies; identify safeguards and unresolved items; obtain compliance review and partner acceptance. Automated scores produce a recommendation only. They cannot override a prohibited relationship or perform professional acceptance autonomously."}, {"kind": "paragraph", "text": "Optional steps. Additional director interviews, site inspection, specialist consultation, third-party verification, and reference checks, with consent and lawful basis where required."}, {"kind": "paragraph", "text": "Review and gate. Coordinator prepares → Compliance checks → Partner accepts, accepts with permitted conditions, requests more information, or declines. Conditional acceptance has an owner, deadline, and activation restrictions. A service that creates a prohibited independence relationship is not unlocked by a warning acknowledgement. [S8]"}, {"kind": "paragraph", "text": "Transformation. Questionnaire answers + evidence → immutable Acceptance snapshot + decision + permitted services/entities + conditions + next review date. Only accepted scope proceeds to a binding engagement. Declined records follow the approved retention/privacy policy."}, {"kind": "heading", "text": "LC-05. Scope, pricing, proposal, and negotiation"}, {"kind": "paragraph", "text": "Required inputs. Accepted service scope; entity list; deliverables; periods; client responsibilities; milestones; fee model; currency; taxes where applicable; payment terms; proposal validity; exclusions; assumptions; pricing approver. Optional inputs. Alternative packages, discounts, retainers, capped time charges, travel, training, and additional-work rates."}, {"kind": "paragraph", "text": "Mandatory steps. Estimate effort by role; apply approved rates; calculate fees and taxes; check margin/discount authorization; generate versioned proposal; obtain internal approval; issue to the authorized contact; record sent, viewed where available, accepted, declined, or expired status."}, {"kind": "paragraph", "text": "Negotiation. Each change creates a new version and comparison. Changes to services, entities, independence, deadlines, or financial responsibility re-enter the relevant assessment. Prior versions remain superseded, not overwritten. Internal pricing notes are never included in client outputs."}, {"kind": "paragraph", "text": "Transformation and gate. Approved opportunity → proposal lines and terms → client acceptance evidence → engagement-letter draft. Client acceptance is tied to proposal version and signatory authority. It does not itself activate professional work or create financial postings."}, {"kind": "paragraph", "text": "Automation. Expiry reminders and follow-up tasks are allowed. Automatic price discounts, binding scope expansion, and self-approved fee write-offs are not. An expired acceptance requires revalidation or reissue."}, {"kind": "heading", "text": "LC-06. Engagement letter and contractual authorization"}, {"kind": "paragraph", "text": "Required inputs. Accepted proposal/version; approved client acceptance; legal names; service/period; reporting framework; intended users; roles of management and firm; deliverables; fees; confidentiality and data terms; information-access obligations; agreed timetable; termination terms; authorized signatories. Conditional inputs. Group components, specialist reliance, subcontractor/data-processing terms, regulatory clauses, and engagement-specific assurance language."}, {"kind": "paragraph", "text": "Mandatory steps. Generate the correct service template; reconcile it to the approved proposal; obtain partner/authorized commercial review; verify signatory authority; collect client and firm signatures where required; preserve signed document hash, evidence, and version; record effective period and renewal basis."}, {"kind": "paragraph", "text": "Optional steps. Wet signature upload with verification, approved external e-signature provider, annexed service schedules, or a separately negotiated data-processing agreement."}, {"kind": "paragraph", "text": "Gate. Unsigned, expired, materially changed, or mismatched terms block activation. Preliminary administrative collection may be permitted under documented policy, but is not commencement of an audit. An extension requires authorized addendum; a new service may require a new letter."}, {"kind": "paragraph", "text": "Transformation. Approved proposal + acceptance → binding terms snapshot + contract record + engagement eligibility. The firm shall distinguish an electronic signature from a scanned signature image and retain whatever identity/intent evidence the chosen method requires."}, {"kind": "heading", "text": "LC-07. Convert to client and activate portal"}, {"kind": "paragraph", "text": "Required inputs. Approved acceptance; signed effective terms; validated legal entities; primary contact; billing identity; firm relationship owner; contact authorization matrix; communication language. Conditional inputs. Deposit confirmation if contractual, portal access consent, multi-entity delegation, and designated data owner. Optional inputs. Secondary billing contact, SSO, backup signatory, and notification subscriptions."}, {"kind": "paragraph", "text": "Mandatory steps. Convert or link the lead once; preserve mapped custom fields and source IDs; create client and entity records; separate billing contacts from management signatories; assign staff; provision least-privilege portal invitations; verify contact channel and MFA according to policy; test accessible entities/projects; complete welcome and handover checklist."}, {"kind": "paragraph", "text": "Review and transformation. Onboarding coordinator prepares; manager verifies entity/contact mapping and activation conditions. Lead → Client + Entities + Contacts + approved grants + onboarding checklist. One individual may have different roles for different entities. Corporate email domain membership alone does not grant access."}, {"kind": "paragraph", "text": "Exit. Relationships become Active only after gates pass. Invitations have expiry and revocation. Failed invitations remain Pending invitations; they are not treated as active users. A rejected invitation can be reissued without duplicating the contact."}]}, {"id": 7, "title": "7. Automated intake and annual-validation questions", "blocks": [{"kind": "heading", "text": "7.1 Form behavior and response design"}, {"kind": "paragraph", "text": "INT-01. Use Perfex Web-to-Lead and simple custom fields for the first inquiry; use a dedicated authenticated questionnaire/workflow for detailed acceptance and annual validation. External surveys are supported through validated, authenticated callbacks. Public lead forms shall not expose previously supplied confidential data. Perfex's documented forms and hooks provide entry points; advanced conditional questionnaires and gates are target extensions. [S5, S6]"}, {"kind": "paragraph", "text": "INT-02. Each question stores question ID, questionnaire version, respondent, entity, engagement/period, answer type, raw answer, normalized answer, evidence, submission time, validation state, and reviewer. Repeatable arrays capture owners, directors, banks, registrations, countries, and related parties. Choices include Yes, No, Unknown, and Not applicable where meaningful; unknown mandatory information prevents acceptance until resolved."}, {"kind": "paragraph", "text": "INT-03. Autosave does not equal attestation. Final submission shows unanswered requirements, change summary, and a respondent declaration. A reopened response becomes a new revision. Internal screening conclusions and restricted AML records are stored separately from client-visible answers."}, {"kind": "heading", "text": "7.2 Identity, ownership, and authority"}, {"kind": "paragraph", "text": "Q01 (M, text). What is the exact legal name and any trading names? Retain spelling in the original language; aliases do not replace the legal identity."}, {"kind": "paragraph", "text": "Q02 (M, structured). What are the entity type, registration jurisdiction, registration number, and incorporation date? Evidence: registration extract. Where unincorporated, capture the applicable individual/partnership identifier instead."}, {"kind": "paragraph", "text": "Q03 (M, address). What are the registered and principal operating addresses? Q04 (M, multi-select/text). What activities are conducted and in which countries? Q05 (M, date/rule). What is the financial year-end, including first or changed accounting periods?"}, {"kind": "paragraph", "text": "Q06 (C, repeatable ownership). Who are the direct owners and ultimate beneficial owners, with percentage, control basis, and effective dates? Apply the approved identification threshold; do not assume one worldwide threshold."}, {"kind": "paragraph", "text": "Q07 (M, repeatable contacts). Who are the directors, finance lead, authorized management signatories, and document contributors? Capture role evidence. Q08 (C, group tree). Which parents, subsidiaries, branches, and affiliates exist, and which are in scope?"}, {"kind": "paragraph", "text": "Q09 (C, controlled declaration). Are there PEP connections, sanctions considerations, or source-of-funds/source-of-wealth requirements under applicable rules? Detailed compliance evidence is restricted. Q10 (M, attestation). Who is authorized to instruct the firm and approve release to specified recipients?"}, {"kind": "heading", "text": "7.3 Financial and operational profile"}, {"kind": "paragraph", "text": "Q11 (M, decimal/currency). What were prior-year revenue, assets, liabilities, and employee counts, and what is expected this year? Each amount needs period and basis: finalized, draft, forecast, or estimated."}, {"kind": "paragraph", "text": "Q12 (M, band/integer). What are the transaction volumes and number of entities/bank accounts/currencies? Q13 (C, list). What borrowings, covenants, leases, guarantees, or financing plans exist? Q14 (C, list). What inventory types, locations, valuation methods, and count dates apply?"}, {"kind": "paragraph", "text": "Q15 (C, structured). Is there a fixed-asset register; what categories, useful lives, additions, disposals, and tagging arrangements exist? Q16 (C, structured). What payroll populations, benefit schemes, deductions, and approved pay cycles exist?"}, {"kind": "paragraph", "text": "Q17 (M, description). What are the main revenue streams, recognition policies, customer concentration, and significant contracts? Q18 (C, list). Which related-party transactions, intercompany balances, or group reporting packages exist? Q19 (C, declaration). Are there significant losses, cash constraints, covenant breaches, or going-concern considerations?"}, {"kind": "heading", "text": "7.4 Books, systems, controls, and evidence"}, {"kind": "paragraph", "text": "Q20 (M, selection). Which accounting/ERP system is used, who controls it, and will the platform manage books, import an external TB, or perform reporting-only work? Q21 (M, date/status). What is the latest finalized period and which periods remain open?"}, {"kind": "paragraph", "text": "Q22 (M, checklist). Are the TB, GL, bank statements, receivable/payable ageing, inventory, fixed assets, payroll, and tax records available? “No” creates a remediation/document task for the client, not a fabricated balance."}, {"kind": "paragraph", "text": "Q23 (M, status). When were bank and control accounts last reconciled? Q24 (M, structured). What financial-statement framework, functional currency, presentation currency, and accounting policies apply?"}, {"kind": "paragraph", "text": "Q25 (C, system inventory). What interfaces, export formats, fiscal calendars, account dimensions, and access methods are available? Q26 (M, declaration). Who prepares, approves, posts, and closes records? Q27 (C, description). What system changes, migrations, outages, or control changes occurred during the period?"}, {"kind": "paragraph", "text": "Q28 (O, evidence). Supply process maps, management reports, budgets, and board packs. Q29 (M, authorization). What data may be shared with the firm, external specialists, and approved storage providers, and for which purpose?"}, {"kind": "heading", "text": "7.5 Compliance, prior providers, and engagement suitability"}, {"kind": "paragraph", "text": "Q30 (C, repeatable). What tax/regulatory registrations, filing obligations, and deadlines apply? Q31 (C, declaration). Are there late filings, unresolved assessments, investigations, or penalties? Q32 (C, structured). Are there cross-border, transfer-pricing, withholding, or customs obligations?"}, {"kind": "paragraph", "text": "Q33 (M, description). Why is the firm being appointed or changed? Q34 (C, authorization). May the firm contact the predecessor, and are records/disagreements outstanding? Q35 (C, evidence). What prior audit opinions, significant findings, uncorrected differences, and management letters exist?"}, {"kind": "paragraph", "text": "Q36 (M, declaration). Are there litigation, fraud allegations, regulatory restrictions, or significant subsequent events relevant to the requested work? Q37 (M, confirmation). Can management accept responsibility for the information, financial statements, and decisions and provide unrestricted access required by the engagement?"}, {"kind": "paragraph", "text": "Q38 (M, firm-only). Does the firm have competence, time, resources, and specialist capability? Q39 (M for assurance, firm-only). What financial, business, family, fee, prior-service, or self-review relationships affect independence? Q40 (M, firm-only). Is acceptance supported, with which safeguards, restrictions, responsible owner, and review date?"}, {"kind": "heading", "text": "7.6 Annual change questionnaire"}, {"kind": "paragraph", "text": "For every annual question, display the last approved value and request: Unchanged, Changed, Previously unknown now known, or No longer applicable. A changed answer requires new value, effective date, explanation, and supporting evidence where prescribed."}, {"kind": "paragraph", "text": "Y01–Y05. Confirm legal name/status, registrations, addresses, financial year-end, and activities. Y06–Y10. Confirm owners/control, directors/signatories, group structure, countries, and related parties. Y11–Y15. Update actual/prior and expected/current revenue, assets, headcount, financing, and going-concern facts. Y16–Y20. Confirm accounting framework/currency, ERP/interfaces, reconciliations, inventory/assets, and payroll. Y21–Y25. Update tax/regulatory obligations, litigation/investigations, fraud/control changes, prior findings, and significant events. Y26–Y30. Confirm services/deadlines, management responsibilities, portal access, data-sharing choices, and signatory attestation."}, {"kind": "paragraph", "text": "Client answers shall be reviewed together with the firm's updated independence, capacity, competence, fee dependency, and continuance assessments. “No change” does not bypass the firm's reassessment."}]}, {"id": 8, "title": "8. Annual continuance, engagement creation, and planning", "blocks": [{"kind": "heading", "text": "LC-08. Annual validation and continuance"}, {"kind": "paragraph", "text": "Trigger and owner. The next review date, a configured pre-year-end interval, a new service, or a material change creates a continuance case. Recommended scheduling default: initiate 90 days before year-end, with the actual timetable approved per client. The relationship remains active for existing authorized work unless a specific restriction is applied."}, {"kind": "paragraph", "text": "Required inputs. Prior approved client/entity snapshot; latest annual questionnaire; actual and forecast financial metrics; updated ownership/control and contacts; prior findings; current service plan; responsible reviewer. Conditional inputs. Renewed identity/registration evidence, revised regulatory tests, updated independence checks, predecessor or group-component information, and new engagement terms. Optional inputs. Client satisfaction feedback and future advisory interests."}, {"kind": "paragraph", "text": "Mandatory steps. Compare field by field; compute absolute and percentage changes; evaluate effective-dated threshold rules; identify scope, disclosure, filing, staffing, or fee changes; verify new evidence; review continuance; record approval or restrictions. Prior-year zero values produce an absolute change and “percentage not meaningful,” not division by zero. Currency and measurement-window differences are normalized or flagged for review before comparison."}, {"kind": "paragraph", "text": "Transformation. Prior snapshot + attested new answers → Delta report + obligation changes + new annual snapshot + continuance decision. A threshold flag is an assessment task until a qualified reviewer confirms its applicability; turnover growth alone does not establish a legal obligation."}, {"kind": "paragraph", "text": "Gate and automation. Partner approves continuance and any new conditions. The next engagement may be prepared in Draft while review is open, but cannot activate without current authorization. Reminders escalate to the relationship owner and manager. Old sign-offs, completed tasks, signatures, and prior conclusions are never copied as current-year evidence."}, {"kind": "heading", "text": "LC-09. Create the engagement and service plan"}, {"kind": "paragraph", "text": "Required inputs. Active client; entity or explicit group scope; accepted service; financial period or assessment dates; signed terms; accounting mode; engagement manager; partner/lead auditor for assurance; reviewer; deadline; deliverables; template version; confidentiality; budget. Conditional inputs. EQR determination, specialist team, branch/component scope, tax authorization, engagement-specific access grants, and deposit gate."}, {"kind": "paragraph", "text": "Mandatory steps. Create one engagement ID linked to one Perfex project; bind the legal scope and period; instantiate applicable task/workpaper/PBC templates; assign responsibilities; calculate dates against the business calendar; identify dependencies; create initial strategy/summary/opinion/announcement objects only where relevant to the service."}, {"kind": "paragraph", "text": "Optional steps. Copy the previous year's structure, links to permanent-file documents, account mappings, and standing client preferences. Every copied item carries “requires current-period confirmation.” Annual numeric balances, sample selections, approval dates, review clearance, and signed conclusions are excluded from roll-forward."}, {"kind": "paragraph", "text": "Review and gate. Manager reviews scope, budget, schedule, and permissions; partner approves assurance scope and resourcing. Changes after activation use a change request with impact on fees, deliverables, and deadlines. Staff can have parallel tasks, but downstream approval gates remain enforced."}, {"kind": "paragraph", "text": "Transformation. Contract service lines → Engagement + Project link + scope snapshot + team + milestones + task instances + PBC request plan. A create retry returns the same engagement rather than multiplying projects. Template updates affect future instances unless expressly adopted."}, {"kind": "heading", "text": "LC-10. Planning, strategy memorandum, materiality, and announcement"}, {"kind": "paragraph", "text": "Required inputs for audit. Engagement scope; approved entity profile; preliminary TB or financial metrics; prior reports and findings; business/process understanding; applicable reporting/auditing framework; team; timetable. Conditional inputs. Inventory attendance, bank confirmations, group instructions, specialist work, fraud considerations, significant estimates, IT controls, and EQR plan. For non-audit services, use the service-specific project plan rather than artificial audit materiality."}, {"kind": "paragraph", "text": "Mandatory steps. Document objectives, relevant assertions, significant areas, planned approach, information dependencies, communication plan, and allocation of work. Prepare the Strategy Memorandum. Record planning, interim, final, and completion stages; partner, manager, senior, and specialist assignments; engagement-specific rationale for planned procedures."}, {"kind": "paragraph", "text": "Materiality processing. Preserve source metric, source version, currency, benchmark options (revenue, profit/income, assets, net assets, or justified custom basis), percentage, calculated candidate, chosen benchmark, selection rationale, performance percentage/amount, and clearly-trivial threshold/rationale. Calculations are performed on the server using decimals. Negative/near-zero benchmarks require a considered alternative. A configured percentage is a starting point, not an automatic professional conclusion."}, {"kind": "paragraph", "text": "Review. Preparer drafts → senior reviews → manager recommends → partner approves strategy and materiality. Changes in actual results, scope, or assessed conditions create a revised materiality version and identify affected samples, workpapers, and unadjusted-difference evaluations."}, {"kind": "paragraph", "text": "Announcement letter. When required, generate the audit announcement from approved entity/engagement/team/scope data; include intended dates, locations, requested support, contact persons, and required records. Manager approves operational details; authorized signatory approves release. Delivery and client acknowledgement are tracked separately from engagement-letter acceptance."}, {"kind": "paragraph", "text": "Outputs. Approved plan and materiality snapshot → task/workpaper scope and sample parameters; approved announcement → communication record and PBC deadlines. Planning may proceed while documents are collected, but dependent procedures cannot be signed off without their required evidence. [S2, S3]"}]}, {"id": 9, "title": "9. Document collection, evidence, and query management", "blocks": [{"kind": "heading", "text": "LC-11. Issue the PBC request and receive documents"}, {"kind": "paragraph", "text": "Required inputs. Engagement/period; request template; document category; description; expected period/entity; assigned client contributor; firm owner; due date; confidentiality; acceptance criteria. Conditional inputs. Required bank accounts, tax registrations, locations, ledger formats, confirmation addresses, and signatory evidence. Optional inputs. Preferred file layout, example template, recurring request, and links to unchanged permanent-file documents."}, {"kind": "paragraph", "text": "Mandatory steps. Generate a Prepared By Client (PBC) register; remove non-applicable items through authorized review; send authenticated portal requests; receive upload or approved connector reference; validate file type, size, readable structure, ownership and scope; record immutable file version and hash; assign category and request; check completeness, period coverage, legibility, and totals against the request."}, {"kind": "paragraph", "text": "States. Requested → Awaiting client → Uploaded → Under validation → Accepted, or Rejected/resubmission requested. A received file is not automatically accepted. A request can require several documents; each has its own version and reviewer."}, {"kind": "paragraph", "text": "Transformation. Uploaded bytes + source metadata → Document version + request linkage + validation results + workpaper references. Original bytes are retained; normalized extracted data becomes a separate derivative with parser version and lineage. No automatic renaming overwrites an existing file."}, {"kind": "paragraph", "text": "Review and automation. Coordinator validates administrative completeness; accountant/auditor validates technical adequacy. Accepted documents unlock only their dependent tasks. Reminders include the outstanding items, due date, and responsible contact; avoid unnecessary sensitive data in email. A client can see its requests and permitted files, not internal workpaper notes or unrelated entities."}, {"kind": "heading", "text": "9.1 Minimum request catalogue"}, {"kind": "paragraph", "text": "The service template shall cover registration/ownership records, prior signed financial statements, prior management letter, current/prior TB, complete GL, bank statements, bank reconciliations and confirmations, receivable/payable ageing, significant invoices/contracts, inventory listings/counts, fixed-asset register, payroll/benefits, tax returns and reconciliations, borrowing/covenant schedules, leases, equity movements, related parties, board minutes, litigation correspondence, budgets/forecasts, subsequent events, and management representations where applicable."}, {"kind": "paragraph", "text": "For each category, the request identifies the required span, expected format, responsible owner, completeness test, and linked procedure. A full GL requires an opening balance basis, coverage dates, account/reference/date/debit/credit fields, and control totals. A bank statement requires account identity and statement opening/closing balances; an asset register requires cost, accumulated depreciation, additions/disposals, and period-end carrying amount."}, {"kind": "heading", "text": "LC-12. Resolve missing data and client queries"}, {"kind": "paragraph", "text": "Required inputs. Query ID; related request/workpaper/account; precise question; reason; client-visible wording; owner; due date; required evidence; blocking classification. Optional inputs. Meeting request, structured response options, or permitted temporary estimate."}, {"kind": "paragraph", "text": "Mandatory steps. Open a query rather than embed the only request in a document comment; notify the assigned client contact; preserve each response; validate the reply against the question; accept, request clarification, or reopen. Internal review notes can spawn a client query, but internal judgments and restricted assessments are not exposed automatically."}, {"kind": "paragraph", "text": "Review and outputs. The original issuer or authorized independent reviewer clears the query. The client's “answered” action does not mean “resolved.” Accepted response → updated source/evidence version → affected calculation/workpaper marked for reconsideration. The system records which dependencies were satisfied."}, {"kind": "paragraph", "text": "Exceptions. Missing documents can result in alternative procedures, revised timetable, limited deliverable, or withdrawal only through the authorized professional decision. Any approved estimate is flagged, quantified, explained, and revisited. Time pressure cannot silently mark a mandatory evidence requirement complete."}]}, {"id": 10, "title": "10. Financial intake, trial balances, and accounting production", "blocks": [{"kind": "heading", "text": "LC-13. Import and validate financial data"}, {"kind": "paragraph", "text": "Required batch metadata. Tenant/entity; engagement; financial period; accounting mode; source system; source file/version; original file hash; as-of date or movement range; currency; TB convention; parser/layout version; importer; batch key. Conditional metadata. Functional/presentation currencies, exchange-rate source, department/cost-centre dimensions, opening/closing period convention, prior-year restatement status, and authorized migration cut-off."}, {"kind": "paragraph", "text": "Required TB row fields. Source account code and name; current balance as debit/credit or explicitly declared signed balance; source row number; currency when multiple currencies are supplied. A signed-balance file shall declare “debit positive” or “credit positive.” Optional or conditional fields. Opening debit/credit, period movements, closing debit/credit, prior comparatives, account type, parent, dimensions, source reference, and narrative. Account type and reporting mapping become mandatory before reporting acceptance."}, {"kind": "paragraph", "text": "Required transaction fields for detailed GL import. External transaction ID or reproducible fingerprint; account code; transaction date; description; debit/credit; currency; source document reference; opening-balance context. Counterparty, due date, tax code, FX rate, reconciliation state, project/cost centre, and subledger IDs are conditional to the source and service."}, {"kind": "paragraph", "text": "Mandatory processing. Stage without posting; detect layout; validate dates/decimals/currency; preserve account-code zeros; reject incompatible entity/period; detect duplicate batches and transactions; check opening + debit movements − credit movements = closing under the declared convention; check TB debits = credits; identify missing mappings and anomalous signs; compare prior closing to current opening; report every row outcome."}, {"kind": "paragraph", "text": "Duplicate policy. Duplicate account rows may be legitimate by dimension/currency. Aggregate only under an explicit mapping rule; preserve the component rows. Re-uploading identical content returns the existing batch. A corrected file becomes a new batch with an explicit supersession relationship."}, {"kind": "paragraph", "text": "Review and gate. Preparer resolves errors; senior reviews control totals, mappings, reconciliation to source, and import purpose. Only an approved batch becomes the active source snapshot. No unexplained difference is hidden in a suspense account or rounding plug. Accepted “not applicable” cases require a reason and authorized reviewer."}, {"kind": "paragraph", "text": "Outputs. Raw file → Staged rows → normalized account balances/transactions → Validation results → approved TB snapshot or posting candidates. A TB snapshot used for audit is not automatically an opening-balance journal. A closing TB loaded to establish books must not also be added to the same period's detailed GL and double-counted."}, {"kind": "heading", "text": "10.1 Import options and replacement rules"}, {"kind": "paragraph", "text": "The interface shall offer an explicit choice among Opening balances, Period movements, Closing TB snapshot, Detailed transactions, and Audit-only reporting snapshot. It displays the financial effect before confirmation. CSV and XLSX are primary structured formats; legacy formats may use a controlled conversion with retained originals. PDF/image-derived data requires human verification and is not accepted as inherently equivalent to a structured ledger export."}, {"kind": "paragraph", "text": "Replacement after review creates a new candidate snapshot. The system calculates differences by account/dimension, identifies applied adjustments already represented in the replacement, and marks impacted reconciliations/reports for review. It shall never merge the new TB and old adjustments without a signed reconciliation decision."}, {"kind": "heading", "text": "LC-14. Map accounts and establish the reporting basis"}, {"kind": "paragraph", "text": "Required inputs. Approved source account list; entity chart/version; account classification; reporting framework/version; report-line mapping; period; material accounts; control-account designations. Conditional inputs. Note mappings, cash-flow categories, tax treatment, inventory/asset/payroll control accounts, consolidation mapping, and FX policy. Optional inputs. Departments, projects, branches, segments, budgets, and analytics tags."}, {"kind": "paragraph", "text": "Mandatory steps. Match each source account to the correct entity account; confirm type and normal balance; define parent/subaccount relationships; map each account to reporting line and disclosure schedules; validate unmapped/nonzero accounts and duplicate/conflicting mappings; compare to prior year; approve mapping version. Mapping by description alone requires human confirmation."}, {"kind": "paragraph", "text": "Data transformation. SourceAccount → EntityAccount → ReportingLine → Note/Schedule reference. A firm chart is a template, not a shared balance pool. Mapping changes restate presentation only when explicitly selected; they never rewrite original source codes or posted entries."}, {"kind": "paragraph", "text": "Review and gate. Senior reviews classification; manager approves material policy changes; partner approves significant assurance-related presentation judgments. Reporting remains blocked while required mappings are unresolved. Prior mappings may be suggested but require current-period confirmation."}, {"kind": "heading", "text": "LC-15. Bookkeeping and transaction posting"}, {"kind": "paragraph", "text": "Required inputs. Approved source transaction/document; entity; period; journal date; account IDs; balanced debit/credit lines; currency; description; creator; source-event key. Conditional inputs. Tax treatment, counterparty, due date, FX rate, subledger, cost centre, approval threshold, and external-posting authorization."}, {"kind": "paragraph", "text": "Mandatory sequence. Capture/import source → validate → propose account/tax mapping → review exceptions → obtain required approval → post atomically → update subledger/control balances → produce event and immutable posting reference. Posting requires an open period, valid entity accounts, nonnegative line amounts, and a rule preventing unintended debit and credit on the same line. At least two economically meaningful lines are required."}, {"kind": "paragraph", "text": "Office versus client processing. Perfex fee invoices/payments/expenses shall map to the firm office entity. External client invoices/bills/receipts map only to the selected client's books through its integration. Source-event uniqueness prevents repeated webhook or import posting. Cancellation of a posted source creates a linked reversal/correction, not deletion of historical ledger rows. [S4]"}, {"kind": "paragraph", "text": "Optional steps. Recurring entries, bank rules, allocation, accrual templates, automated draft mapping, and low-risk auto-posting may be enabled by an approved policy. Auto-posting still enforces balance, scope, period, duplicate, authorization, and audit-trail controls and routes exceptions for review."}, {"kind": "paragraph", "text": "Outputs and gate. Posted journal + immutable lines + source lineage + reconciliation eligibility. Any header/line/subledger failure rolls back the posting as a unit. Bookkeeping work for an audit client requires an approved independence determination; management retains decision responsibility."}, {"kind": "heading", "text": "LC-16. Reconcile accounts and prepare schedules"}, {"kind": "paragraph", "text": "Required inputs. Entity/period; active TB/GL version; supporting statement/subledger; reconciliation type; preparer; reviewer; cut-off; tolerance policy. Conditional inputs. Bank opening/ending balance, uncleared transactions, confirmations, inventory count, assets roll-forward, ageing, tax returns, loan schedules, payroll registers, and intercompany counterparties."}, {"kind": "paragraph", "text": "Mandatory steps. Tie the GL balance to the approved TB; derive independent supporting balance; compare; classify each reconciling item as timing, error, omission, estimate, disputed, or unexplained; attach evidence; age outstanding items; propose an adjustment or follow-up; explain the remaining difference; submit workpaper for review."}, {"kind": "paragraph", "text": "Bank-specific processing. Statement opening + deposits − withdrawals = statement closing; compare to book balance; match using amount/date/reference rules with confidence and human exceptions; record outstanding checks/deposits, charges, interest, and transfers. An unmatched bank feed transaction does not disappear when a reconciliation is marked complete. Cross-bank transfers require both sides and prevent duplicate expense recognition."}, {"kind": "paragraph", "text": "Control-account processing. AR/AP ageing ties to control accounts; fixed assets reconcile opening cost/depreciation, additions, disposals, charges, impairment, and closing values; inventory reconciles quantities and valuation; payroll ties gross-to-net, deductions, liabilities, and bank payments; taxes tie computation, returns, payments, and ledger; loans/leases tie principal, interest, maturities, and covenants; equity and related parties tie authorized movements and disclosures."}, {"kind": "paragraph", "text": "Review and transformation. Supporting evidence + GL → reconciliation version + reconciling items + proposed AJEs + reviewer conclusion. Senior clears only explained/treatment-approved differences; material unresolved matters remain blocking. Cleared workpapers are invalidated by a changed source balance or related adjustment."}, {"kind": "heading", "text": "LC-17. Propose, approve, and resolve adjusting entries"}, {"kind": "paragraph", "text": "Required inputs. Adjustment reference; entity/engagement/period; type; reason; affected accounts; debits/credits; evidence/workpaper; source snapshot; preparer; anticipated statement/disclosure effect. Conditional inputs. Reversal date, tax effect, FX basis, client management approval, external-posting authority, and restatement rationale. Optional inputs. Recurring schedule or group-consolidation reference."}, {"kind": "paragraph", "text": "Types. Correction, accrual, depreciation/amortization, estimate, reclassification, tax, opening-balance correction, prior-period restatement, or consolidation-only adjustment. Audit-only AJEs remain distinct from operational ledger journals."}, {"kind": "paragraph", "text": "Mandatory sequence. Draft → server validation → independent technical review → manager approval if threshold/type requires → client management acceptance where it changes their accounts → posting or inclusion in the reporting adjustment layer by authorized actor. Rejected/withdrawn items retain their explanation; they are not silently dropped."}, {"kind": "paragraph", "text": "Integrity rules. Debits equal credits in functional currency at approved precision. Foreign-currency differences use explicit balancing/FX lines where required. Date and accounts belong to the same entity and permitted period. The preparer cannot approve their own adjustment. An approved entry edited before posting returns to Draft and requires new approval. Posted entries are reversed and replaced, never overwritten."}, {"kind": "paragraph", "text": "Unadjusted differences. Record amount, account/assertion, cause, quantitative/qualitative significance, tax effect, prior-year accumulation where relevant, management's reason, and the partner's conclusion. A resolved audit conclusion may retain an uncorrected difference; “all adjustments resolved” does not mean “every proposed adjustment posted.”"}, {"kind": "paragraph", "text": "Transformation. Workpaper finding → AJE version → approval → posted journal or reporting-layer adjustment → adjusted TB change → affected reconciliations/reports flagged for re-review. Exported AJEs record receipt and confirmed external-posting status. They are not marked externally posted merely because a file was downloaded."}, {"kind": "heading", "text": "LC-18. Assemble and validate the adjusted trial balance"}, {"kind": "paragraph", "text": "Required inputs. Approved unadjusted TB snapshot; approved adjustment set; posted-ledger cut-off where managed bookkeeping applies; mapping version; reporting currency; period. Conditional inputs. Prior comparatives, restatement bridge, consolidation eliminations, and FX translation. Optional inputs. Draft scenario TB, explicitly excluded from final issue."}, {"kind": "paragraph", "text": "Mandatory processing. Compute adjusted balances by account and dimension; validate debits/credits; show unadjusted, adjustment, and adjusted columns; tie control accounts and retained earnings; reconcile opening balances to the prior approved close; identify suspense/unmapped balances; document residual differences; record approved unadjusted items separately."}, {"kind": "paragraph", "text": "Accounting identity. For a debit-positive account convention: adjusted balance = approved source balance + included debit adjustments − included credit adjustments. In managed-bookkeeping mode, posted AJEs already appear in the GL-derived TB and must not be added again. In external-books mode, the reporting layer includes only adjustments not already in the active imported TB."}, {"kind": "paragraph", "text": "Review and outputs. Senior verifies arithmetic and lineage; manager approves the final adjusted TB version. Approved TB → frozen report input set. A later ledger posting or source replacement creates a newer candidate TB and invalidates dependent reports/sign-offs. It does not silently mutate the approved snapshot."}, {"kind": "heading", "text": "LC-19. Generate financial statements and disclosures"}, {"kind": "paragraph", "text": "Required inputs. Approved adjusted TB; reporting framework and effective version; entity legal details; period; functional/presentation currency; comparatives; policy choices; mapping; note checklist; preparer and reviewer. Conditional inputs. Cash-flow movements, equity roll-forward, related parties, commitments, contingencies, estimates, going concern, subsequent events, and consolidation schedules."}, {"kind": "paragraph", "text": "Mandatory steps. Generate statement of financial position, profit or loss/other comprehensive income as applicable, changes in equity, cash flows, and notes required by the selected framework; cross-reference notes; validate arithmetic, consistency, comparative presentation, statement tie-outs, and disclosure completeness; label every pre-issue package Draft."}, {"kind": "paragraph", "text": "Cash flows. Support approved direct or indirect methodology; distinguish operating, investing, and financing; reconcile opening/closing cash; separately explain FX and noncash movements; exclude noncash investing/financing transactions from cash flows while recording required disclosures. Cash flow is not derived solely by subtracting two balance sheets without movement analysis. Rules shall follow the selected effective IAS 7/reporting profile. [S7]"}, {"kind": "paragraph", "text": "Presentation. The reporting profile shall select the applicable IAS 1/IFRS 18 or other framework requirements based on the reporting period and adoption decision. It shall not treat a generic ledger report as a complete set of compliant financial statements. The IFRS Foundation identifies IFRS 18 as replacing IAS 1; implementation therefore requires version-aware report definitions rather than a permanently fixed presentation. [S9]"}, {"kind": "paragraph", "text": "Transformation. Frozen input set → Report version + statement lines + note schedules + lineage map + validation report. Each amount links to its TB accounts and AJEs. Manual disclosure text is versioned; manual numeric overrides require explicit adjustment/mapping treatment and approval, not an untraceable edited PDF."}, {"kind": "paragraph", "text": "Gate. Senior/manager review and management/partner approvals follow section 12. Consolidation, supplementary management reports, budget comparisons, or translations are optional outputs with their own reviewed scope. A report generation retry produces the same input-derived content or a recorded new renderer version."}]}, {"id": 11, "title": "11. Audit execution and working-paper requirements", "blocks": [{"kind": "heading", "text": "11.1 Workpaper content and execution contract"}, {"kind": "paragraph", "text": "AUD-01. Each audit workpaper shall contain engagement/entity/period; unique reference; objective; relevant assertion; identified audit consideration; planned procedure; materiality version; population/source version; sample method and rationale; sample details; work performed; evidence references; results; exceptions; proposed adjustment; conclusion; preparer; reviewer; and dates. A template checklist is not evidence that the procedure was performed."}, {"kind": "paragraph", "text": "AUD-02. Every procedure has Planned, In progress, Evidence requested, Performed, Submitted, Cleared, or Not applicable status. “Not applicable” requires an approved reason. A conclusion identifies the evidence used and any limits. Changes to populations, balances, materiality, or procedures identify affected workpapers and require appropriate reassessment."}, {"kind": "paragraph", "text": "AUD-03. Sampling shall preserve the population definition and reconciliation, source hash, stratification, selection method, random seed where used, chosen items, substitutions and reasons, results, exception projection where applicable, and reviewer. Statistical and non-statistical methods must remain distinguishable; the application does not claim statistical assurance for arbitrary manual samples."}, {"kind": "paragraph", "text": "AUD-04. External confirmations shall preserve authorization, independently verified contact/source, request, dispatch, control over responses, reminders, received evidence, authenticity evaluation, exceptions, and alternative procedures. Client-provided statements and confirmations received directly under auditor control are different evidence types."}, {"kind": "paragraph", "text": "AUD-05. For statutory/external audit, perform the approved planning, controls/substantive procedures, journal testing, estimate evaluation, fraud considerations, related-party work, going-concern assessment, subsequent-events procedures, and reporting completion as applicable. A forensic investigation is a separately scoped service, not an automatic promise that every external audit detects every fraud."}, {"kind": "heading", "text": "11.2 Minimum workpaper families"}, {"kind": "paragraph", "text": "Planning and entity understanding. Acceptance/continuance; independence; terms; business and control understanding; strategy; materiality; timetable; communications and significant judgments."}, {"kind": "paragraph", "text": "Balance and transaction areas. Cash/banks; receivables and expected losses; payables/accruals/completeness; inventory existence/valuation/cut-off; fixed assets and impairment; payroll and benefits; revenue; purchases/expenses; investments/financial instruments; leases/borrowings; taxes; equity; related parties; intercompany; consolidation."}, {"kind": "paragraph", "text": "Completion. Misstatements and AJEs; analytics; disclosures; going concern; subsequent events; management representations; governance communications; summary memorandum; opinion/report; review closure; release and archive checklist."}, {"kind": "paragraph", "text": "Each family may be disabled only when inapplicable to the specific engagement with approval. Service templates generate tasks from this catalogue while permitting tailored procedures. Optional specialists' reports identify competence, scope, assumptions, work relied upon, and the engagement team's evaluation."}, {"kind": "heading", "text": "11.3 Strategy memorandum, summary memorandum, and opinion"}, {"kind": "paragraph", "text": "Strategy Memorandum. Capture entity understanding, objectives, scope, approach, materiality, timetable, team, significant areas, specialists, and communications. It is approved before dependent fieldwork and revised when relevant facts change."}, {"kind": "paragraph", "text": "Summary Memorandum. Summarize work performed, significant findings, estimates/judgments, adjusted and unadjusted differences, control recommendations, unresolved or professionally disposed matters, going concern, subsequent events, disclosure review, and proposed reporting conclusion. It links to evidence and review clearance; it does not merely duplicate the engagement letter."}, {"kind": "paragraph", "text": "Audit Opinion/Report. Store reporting framework, engagement type, proposed opinion/conclusion, grounds and supporting references, applicable emphasis/other-matter or other report sections, management responsibilities, auditor responsibilities, authorized signer, and exact financial-statement package version. Report options depend on the approved standards profile. The system may supply templates but cannot select an opinion solely from numeric thresholds. [S3, S10]"}]}, {"id": 12, "title": "12. Review, management clearance, and professional sign-off", "blocks": [{"kind": "heading", "text": "LC-20. Preparer submission and first-level review"}, {"kind": "paragraph", "text": "Required inputs. Completed workpaper or reporting package; self-checklist; source links; calculations; conclusion; preparer identity; selected version; designated independent reviewer. Conditional inputs. Sampling evidence, confirmations, AJE resolution, and specialist reports. Optional inputs. Reviewer meeting or additional analytical procedure."}, {"kind": "paragraph", "text": "Mandatory preparer steps. Check scope/period; tie figures to source; verify arithmetic; attach evidence; explain exceptions; remove draft placeholders; confirm work performed; submit a fixed version. A preparer may withdraw submission before review decision, but that creates a state event."}, {"kind": "paragraph", "text": "Mandatory checker steps. Verify completeness, accuracy, classification, reconciliation, cut-off, evidence sufficiency, cross-references, policy consistency, and significant movements. Raise separate review points with exact workpaper/version/location, issue, required action, severity, owner, and due date. Classify whether the point blocks the workpaper, report, or entire engagement."}, {"kind": "paragraph", "text": "Feedback loop. Reviewer raises point → preparer responds with new evidence/version → reviewer assesses response → reviewer clears or reopens. Only the issuer or authorized qualified replacement clears the point. The preparer cannot clear it; an answered point remains open until checked. Neither side deletes the review history."}, {"kind": "paragraph", "text": "Transformation and gate. Submitted workpaper → reviewed version + point register + clearance evidence. All blocking points must be cleared or replaced by a documented permissible professional disposition before progression. Any unresolved material matter requiring further evidence remains blocking. The gate never treats a task marked “Done” as a review signature."}, {"kind": "heading", "text": "LC-21. Engagement-manager review"}, {"kind": "paragraph", "text": "Required inputs. First-level-cleared workpapers; adjusted TB; draft financial statements/relevant deliverables; review-point register; scope completion; budget/deadline status; AJE/unadjusted-difference registers; significant matters. Conditional inputs. Specialist evaluation, group conclusions, tax exposures, going concern, subsequent events, and independence updates."}, {"kind": "paragraph", "text": "Mandatory steps. Check that performed work matches signed scope and approved plan; review significant balances and judgments; evaluate uncorrected items individually and collectively; confirm cross-workpaper consistency; verify disclosure completeness and statement tie-outs; evaluate client responses; ensure required consultations occurred; prepare/approve the summary memorandum."}, {"kind": "paragraph", "text": "Optional steps. Additional senior or specialist review for complex areas; a completion meeting; additional evidence requests. These actions create tasks with clear owners and do not erase prior completed work."}, {"kind": "paragraph", "text": "Decision and transformation. Manager approves for management clearance, returns specific areas, or escalates to the partner. Return resets only dependent statuses where possible. The manager's decision records the precise TB, report, mapping, and workpaper versions reviewed. Budget overrun is handled commercially, not by suppressing necessary procedures."}, {"kind": "heading", "text": "LC-22. Client management clearance and approval of accounts"}, {"kind": "paragraph", "text": "Required inputs. Internally reviewed draft package; management action list; proposed adjustments; unadjusted-difference summary where relevant; authorized management signatory; exact draft version. Conditional inputs. Written representations, board approval, filing mandate, related-party/going-concern/subsequent-events confirmations, and signed acceptance of adjustments."}, {"kind": "paragraph", "text": "Mandatory steps. Present factual queries and draft accounts securely; explain proposed adjustments; obtain management decisions; record approved financial statements and representations; resolve factual corrections; identify any proposed changes affecting professional conclusions. Client management approves its accounts and responsibilities, not the independence or result of the auditor's opinion."}, {"kind": "paragraph", "text": "Iteration. A substantive client change creates a new document/TB/AJE version, routes affected work back through senior/manager review, and then obtains fresh management approval. An unchanged acknowledgement records receipt but does not replace explicit approval."}, {"kind": "paragraph", "text": "Transformation and gate. Reviewed draft + authorized management decisions → management-approved financial-statement version + representation/approval evidence + resolved action list. Representations do not replace other necessary audit evidence. Missing required approval or representations prevent final release and require partner disposition."}, {"kind": "heading", "text": "LC-23. Partner / lead-auditor final review and EQR"}, {"kind": "paragraph", "text": "Required inputs. Manager completion conclusion; approved current acceptance/independence; completed procedures; resolved review register; approved adjusted TB; financial statements and disclosures; management approval; proposed report; significant judgments; subsequent-events conclusion; exact report-package manifest. Conditional inputs. EQR, technical consultation, legal advice, group-component conclusions, required representations, and regulator-specific release checks."}, {"kind": "paragraph", "text": "Mandatory partner steps. Evaluate whether sufficient appropriate evidence supports the conclusion; review significant judgments, AJEs/unadjusted differences, going concern, subsequent events, related parties, scope limitations and reporting implications; verify management approval; approve the exact opinion/report and dated issue package through an authenticated signing action. The report date is selected by the authorized professional after required preconditions are satisfied; no backdating is generated by workflow a
