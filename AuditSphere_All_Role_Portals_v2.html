ses, billing balances, contacts and permissions. Record exclusions and obtain business approval before cutover."}, {"kind": "paragraph", "text": "TR-12. Cutover. Approve a cutover window, source freeze or delta-capture method, final backup, validation steps, owner communications, integration switch, and recovery decision points. Production release requires successful migration reconciliation, access tests, professional workflow acceptance and restore readiness. Retain a protected read-only source archive according to approved retention policy."}, {"kind": "paragraph", "text": "TR-13. Post-cutover assurance. Reconcile the first live postings and reports to approved source evidence; confirm scheduled jobs, portal access, reminders, filings and billing behavior. Resolve transition exceptions through authorized changes. Do not delete the source archive or dispose of evidence merely because go-live has occurred."}, {"kind": "heading", "text": "23.5 Delivery sequence and exit criteria"}, {"kind": "table", "rows": [["Delivery stage", "Required deliverables", "Exit approval"], ["Foundation", "Approved architecture, scope, service catalogue, licensed baselines, configuration decisions and migration approach", "Product owner, architect and practice leadership"], ["Platform and identity", "Environments, scoped identity, private documents, migrations, audit events and test foundation", "Technical/security owner and authorized business representative"], ["Client lifecycle", "Inquiry, acceptance, proposals/terms, activation, intake, annual validation and engagement templates", "Operations and engagement managers using realistic scenarios"], ["Financial processing", "Operating modes, imports, mappings, reconciliations, adjustments, scoped reports and ledger controls", "Qualified accounting owner and technical QA"], ["Professional delivery", "Workpapers, review notes, approvals, management/partner/quality gates, issuance and closure", "Engagement partner and quality-management owner"], ["Migration and production", "Rehearsal, financial/document reconciliation, training, restore exercise and cutover evidence", "Data owner, release authority and practice leadership"]]}]}, {"id": 24, "title": "24. Acceptance and test requirements", "blocks": [{"kind": "heading", "text": "24.1 Acceptance method"}, {"kind": "paragraph", "text": "Each test shall record scenario ID, related requirement, setup, actor, action, expected result, actual result, evidence and reviewer. Use synthetic clients/entities and exact monetary totals. A feature is accepted only when its required positive, rejection and retry paths pass. Tests below establish the minimum cross-functional acceptance suite; the detailed field validations in earlier sections remain independently testable requirements."}, {"kind": "table", "rows": [["Test", "Scenario", "Required result"], ["AT-01", "Submit an inquiry with missing required contact/service data", "Save permitted draft if applicable; reject submission with field-specific guidance"], ["AT-02", "Re-submit identical intake event or convert the same lead twice", "One lead/conversion result; prior result returned without duplicate clients"], ["AT-03", "Discovery creates a different service scope or legal entity", "Updated scoped discovery and acceptance route; original inquiry history preserved"], ["AT-04", "Proposal accepted but client acceptance or terms are incomplete", "Commercial acceptance recorded; professional engagement activation blocked"], ["AT-05", "A conditional KYC/ownership answer is triggered", "Required follow-up evidence and review appear; case cannot bypass the condition"], ["AT-06", "Acceptance is declined or safeguards are not satisfied", "New professional work blocked; reason and authorized follow-up retained"], ["AT-07", "Client contact belongs only to Entity A", "Entity B screens, search results, totals, APIs and downloads remain inaccessible"], ["AT-08", "Annual response confirms no changes", "New annual snapshot and continuance decision created; prior answers remain unchanged"], ["AT-09", "Annual revenue changes from zero or crosses a configured threshold", "No invalid percentage; effective rule creates a review exception and scope decision"], ["AT-10", "Copy an engagement into a new period", "Tasks/templates and permitted reference data copied; signatures, conclusions and approvals reset"], ["AT-11", "Create each of the 12 source services", "Correct service-specific tasks, inputs, review gates and deliverable type; no automatic audit opinion for consulting/training"], ["AT-12", "Client uploads a corrected document", "New immutable version, original retained, affected workpapers identified for review"], ["AT-13", "Client replies to a request with inadequate evidence", "Receipt recorded separately from adequacy; reviewer can reopen/seek clarification"], ["AT-14", "Import an unbalanced TB or unmapped account", "Batch remains staged, exceptions visible, no ledger/snapshot approval bypass"], ["AT-15", "Re-import identical file under another filename", "Duplicate detected using scope/source identity/hash; no duplicate posting"], ["AT-16", "Import closing TB after already importing full transactions", "Operating-mode controls prevent cumulative double counting"], ["AT-17", "Negative source values, alternate debit/credit conventions and repeated dimension rows", "Approved normalization, totals and mapping applied consistently; ambiguity rejected"], ["AT-18", "Opening balances disagree with approved previous-year close", "Reconciliation and authorized explanation/adjustment required before acceptance"], ["AT-19", "Preparer attempts to approve own journal/workpaper", "Approval rejected; independent authorized reviewer required"], ["AT-20", "Journal submission is interrupted or retried after posting", "All lines and event committed once, or none; retry identifies committed result"], ["AT-21", "Closed-period posting attempted", "Rejected unless an authorized reopen/new-period correction route is used"], ["AT-22", "External client TB already incorporates an approved reporting adjustment", "Superseding reconciliation prevents counting adjustment twice"], ["AT-23", "Two clients post distinct synthetic amounts to similarly named accounts", "Each client's GL, TB, statements, cash flow, ageing and exports contain only its authorized data"], ["AT-24", "Journal uses an account from another entity or a forged scope ID", "Server rejects cross-scope reference; no partial financial writes"], ["AT-25", "Same entity has two engagements referencing one period", "Financial dataset not duplicated; approvals/workpapers remain engagement-specific"], ["AT-26", "Group consolidation requested", "Only approved components included; eliminations and consolidated version traceable"], ["AT-27", "Bank statement balance differs from ledger", "Reconciling items required; no forced plug entry or automatic unexplained clearance"], ["AT-28", "Preparer responds to a review note", "Note remains awaiting reviewer clearance; response does not auto-clear"], ["AT-29", "Reviewed workpaper, mapping or TB changes", "Dependent draft reports/approvals marked stale and routed for re-review"], ["AT-30", "Materiality input is changed after planning approval", "Server recalculates, records rationale and requires impact assessment/approval"], ["AT-31", "Management approves statements but partner sign-off is missing", "No audit report issuance; responsibilities remain separate"], ["AT-32", "Quality review is required for the engagement", "Issue blocked until eligible quality reviewer completes required decision"], ["AT-33", "Generate financial statements", "TB ties to all statements, equity reconciles, cash-flow totals reconcile, notes and comparatives checked"], ["AT-34", "Draft report or accounting estimates require further evidence", "Explicit pending/rework state; no manufactured zero values or automatic opinion"], ["AT-35", "File dispatch succeeds but recipient/authority has not accepted", "Sent/delivered/submitted states do not become acknowledged/filing-accepted automatically"], ["AT-36", "Client approval arrives for an old report version", "Evidence attached to old version; current version remains awaiting approval"], ["AT-37", "Reopen or reissue an issued engagement", "Authorized reason, new versions, impact review and replacement notices; original package retained"], ["AT-38", "Invoice the firm's professional fee to a client", "Office AR/revenue posted only; client books unaffected unless separately authorized"], ["AT-39", "Integration token revoked or callback replayed", "New action denied/stopped; duplicate callback not reapplied; authorized retry/manual route visible"], ["AT-40", "Retention expires but legal hold exists", "Disposal blocked and logged; hold release requires authorized decision"], ["AT-41", "Client terminates and requests handover", "Scoped approved export, receipt and access revocation; retained professional evidence preserved"], ["AT-42", "Build a clean environment and apply migrations", "Required schema/reference data established without manual changes; representative workflows pass"], ["AT-43", "Run migration and restore rehearsal", "Counts/hashes/control totals agree, ownership mappings approved, recovery evidence retained"], ["AT-44", "Concurrent users update or approve the same version", "Conflict detected; approvals bind to the version actually reviewed"], ["AT-45", "Reminder/job execution runs twice or crashes midway", "Occurrence deduplication and safe recovery; no duplicate professional decisions or filings"], ["AT-46", "Optional task is marked not applicable", "Reason and authorized applicability decision retained; mandatory requirements cannot be silently skipped"]]}, {"kind": "heading", "text": "24.2 Traceability and release acceptance"}, {"kind": "paragraph", "text": "AC-01. The implementation backlog shall map each delivered function to its requirement ID, relevant lifecycle stage, acceptance tests and business owner. Link source concepts to the target requirement where retained. Changes to requirements shall include impacted screens, data records, migrations, approvals, reports and tests."}, {"kind": "paragraph", "text": "AC-02. Release acceptance requires product-owner functional approval, accounting-owner financial reconciliation, partner/quality-owner approval of professional gates, technical operational readiness and data-owner migration acceptance. Development completion or a successful build alone shall not be recorded as business acceptance."}, {"kind": "paragraph", "text": "AC-03. Any approved phased delivery shall explicitly identify disabled service modes and unavailable transitions. Production users shall not be shown a completed workflow that depends on an undelivered module. Every enabled end-to-end service must complete its own evidence, review, delivery and closure path."}]}, {"id": 25, "title": "25. Worked client lifecycle and data transformation example", "blocks": [{"kind": "paragraph", "text": "This example uses fictional records and simplified amounts solely to demonstrate data lineage and approvals. It does not prescribe an accounting treatment for a real client."}, {"kind": "heading", "text": "25.1 Inquiry through engagement"}, {"kind": "paragraph", "text": "A prospect requests annual financial statements and an external audit for “Example Trading Entity.” The intake creates lead L-001 with a verified contact route, proposed service, financial-period label and desired completion window. Discovery records transaction volumes, framework, existing accounting system, bank accounts and document readiness."}, {"kind": "paragraph", "text": "Acceptance case AC-001 records the ownership documents, predecessor authorization where applicable, competence/capacity, independence assessment and approval conditions. The compliance reviewer completes their review; the engagement partner approves acceptance. Proposal P-001-v2 defines the accepted scope and fee. Signed terms T-001-v1 bind the entity, period, responsibilities and authorized signatory."}, {"kind": "paragraph", "text": "Conversion maps L-001 to client C-001, entity E-001 and contact CT-001. It does not create a ledger entry. Engagement ENG-001 links Perfex project PRJ-001, entity E-001, financial period FY-A and the external-audit template. It creates a strategy memorandum draft, service tasks, document requests, review assignments and scoped portal access."}, {"kind": "heading", "text": "25.2 Source TB and reconciliation"}, {"kind": "paragraph", "text": "The client supplies its closing TB from an external accounting system. The chosen mode is EXTERNAL_BOOKS, so the upload creates staged batch IMP-001 rather than importing a second set of operational transactions. Required scope, currency, period, account mappings and totals are validated."}, {"kind": "table", "rows": [["Account", "Debit", "Credit"], ["Cash", "10,000", "0"], ["Receivables", "5,000", "0"], ["Equipment cost", "8,000", "0"], ["Operating expenses", "3,000", "0"], ["Payables", "0", "3,000"], ["Loan", "0", "7,000"], ["Opening equity", "0", "10,000"], ["Revenue", "0", "6,000"], ["Total", "26,000", "26,000"]]}, {"kind": "paragraph", "text": "The reviewer accepts source snapshot TB-001-v1. Bank, receivables, payables and equipment workpapers reference that exact snapshot and supporting document versions. Any later upload creates a new source version and comparison; it does not overwrite TB-001-v1."}, {"kind": "heading", "text": "25.3 Adjustment to statements"}, {"kind": "paragraph", "text": "The preparer proposes reporting adjustment AJE-001: debit depreciation expense 500 and credit accumulated depreciation 500, supported by WP-FA-001-v1. The independent reviewer verifies the calculation and support. Management accepts the adjustment. The system records it in the reporting layer; external posting is a separate authorized action."}, {"kind": "paragraph", "text": "Adjusted snapshot TB-ADJ-001-v1 combines TB-001-v1 and the accepted reporting adjustment once. Assets net of accumulated depreciation become 22,500, liabilities remain 10,000, and closing equity becomes 12,500, comprising opening equity 10,000 plus profit 2,500. The statement of profit or loss reports revenue 6,000 less operating expenses 3,000 and depreciation 500."}, {"kind": "paragraph", "text": "Cash flow cannot be derived reliably from these closing balances alone. The workflow requests opening balances, movements and non-cash classifications before producing its cash-flow statement. The system shall not manufacture cash-flow categories merely to force a reconciliation."}, {"kind": "paragraph", "text": "If the client supplies TB-002-v1 already containing the depreciation entry, the accountant reconciles the inclusion and approves a superseding reporting dataset that excludes duplicate application of AJE-001. The previous source, adjustment decision and report versions remain available as history."}, {"kind": "heading", "text": "25.4 Review, delivery and renewal"}, {"kind": "paragraph", "text": "Senior review creates note RN-001 against the fixed-asset workpaper. The preparer uploads revised support and submits a response. Only the reviewer clears RN-001. Manager review verifies the full file and financial tie-outs. Management approves the final statements and representations. The lead auditor/partner completes the professional sign-off and any required quality review is completed before issue authorization."}, {"kind": "paragraph", "text": "Package PKG-001-v1 contains the final statements, approved report, selected client communications and a manifest of hashes. Internal workpapers are not included automatically. Sending creates a dispatch event; client acknowledgement creates a distinct receipt event. Engagement closure locks professional content and schedules retention and annual continuance. The firm's invoice remains a separately managed office-billing record."}, {"kind": "paragraph", "text": "For FY-B, questionnaire ANN-002 starts from confirmed prior facts and asks for changes. A new shareholder, changed revenue band and a new bank account create explicit review items. The partner approves continuance and any revised scope. ENG-002 references ENG-001 as its predecessor and imports only permitted templates/reference data, not prior signatures, review conclusions or finalized current-year figures."}]}, {"id": 26, "title": "26. Business configuration and approval decisions", "blocks": [{"kind": "paragraph", "text": "The functional baseline is specified above. The following implementation values must be approved by their named role before the relevant feature enters production; they cannot be reliably determined from source code alone."}, {"kind": "table", "rows": [["Decision", "Required selection/evidence", "Approving role"], ["Jurisdiction and reporting policies", "Enabled jurisdictions, applicable framework/standard versions, tax/filing rules and effective periods", "Qualified accounting/tax owner and engagement partner"], ["Ledger operating mode", "Managed, external or reporting-only per entity/book; authoritative source and authorized write-back", "Accounting owner and client management"], ["Entity/group ownership", "Legal-entity registry, components, account ownership and consolidation rules", "Client management and accounting owner"], ["Professional authority", "Reviewer/partner/quality-review roles, delegation limits and conflict resolution", "Practice leadership and quality-management owner"], ["Acceptance/continuance", "Required evidence, decision factors, conditions, approval routes and review frequency", "Compliance lead and engagement partner"], ["Materiality policy", "Permitted bases/ranges, performance/trivial policy, rounding and required rationale", "Engagement partner/technical methodology owner"], ["Records policy", "Retention classes, legal holds, assembly deadlines, access and disposal authorization", "Records owner with professional/legal validation"], ["Integration policy", "Approved providers, scopes, account/tenant mappings, signatory identity and submission authority", "Technical owner and relevant business authority"], ["Operational service levels", "Approved workload, infrastructure, availability/recovery targets and support hours", "Technical owner and practice leadership"], ["Commercial policies", "Fees, discounts, billing triggers, retainer rules, credit/write-off and collection authority", "Commercial/finance owner"], ["Migration/cutover", "Final mappings, reconciliations, exceptions, freeze/delta plan and recovery checkpoints", "Data owner, accounting owner and release authority"]]}, {"kind": "paragraph", "text": "A configuration decision shall contain owner, selected value, rationale, applicability, version, approval evidence and activation condition. “Not configured” shall produce a visible gate or disabled feature, not an undocumented default. A later change requires impact analysis on active engagements, unissued reports, recurring schedules and external integrations."}]}, {"id": 27, "title": "27. Glossary and source references", "blocks": [{"kind": "heading", "text": "27.1 Glossary"}, {"kind": "paragraph", "text": "Client: the firm's commercial/professional relationship record. Legal entity: the organization whose books, obligations and statements are being processed. Engagement: a scoped professional assignment for defined services and periods. Book: a distinct accounting basis/ledger within an entity. PBC: information prepared/provided by the client. TB: trial balance. GL: general ledger. AJE: adjusting journal entry. Source snapshot: an immutable accepted representation of external data. Reporting adjustment: an approved reporting-layer change that does not itself post to an external operational ledger. Workpaper: documented objective, evidence, procedures, findings and conclusion. Maker–Checker: separation of preparation from independent review/authorization. EQR: engagement quality review where applicable. Outbox: durable record of committed events awaiting external/background processing. Idempotency: safe repeat execution without duplicate business effects. Issued package: approved immutable deliverable versions and their manifest."}, {"kind": "heading", "text": "27.2 Source usage"}, {"kind": "paragraph", "text": "Repository references establish the retained business concepts and integration points. The remaining requirements are the proposed target design and professional-control requirements for business approval. Public professional references identify relevant frameworks; the exact engagement and jurisdiction determine applicability. No source reference by itself certifies implementation completeness or professional compliance."}, {"kind": "paragraph", "text": "[S1] STE repository functional overview and source baseline. README at the reviewed commit. Reference for clients, leads, project/task management, financial operations, audit documents, portal and administration.  Open reference S1"}, {"kind": "paragraph", "text": "[S2] STE service catalogue and task initialization. Project controller, including the twelve service families and service tasks.  Open reference S2"}, {"kind": "paragraph", "text": "[S3] STE engagement document and materiality initialization. Project controller fields and creation flow for strategy/summary memoranda, audit opinion and announcement letter.  Open reference S3"}, {"kind": "paragraph", "text": "[S4] Accounting and Bookkeeping integration. Module identity and transaction hooks for invoices, payments, expenses and supported related modules.  Open reference S4"}, {"kind": "paragraph", "text": "[S5] Perfex Web-to-Lead documentation. Native form/lead integration basis.  Open reference S5"}, {"kind": "paragraph", "text": "[S6] Perfex action hooks documentation. Supported action/filter extension basis.  Open reference S6"}, {"kind": "paragraph", "text": "[S7] IFRS Foundation — IAS 7, Statement of Cash Flows. Relevant reporting reference where IFRS applies.  Open reference S7"}, {"kind": "paragraph", "text": "[S8] IESBA Code. Ethics and independence reference, subject to applicable adoption and engagement circumstances.  Open reference S8"}, {"kind": "paragraph", "text": "[S9] IFRS Foundation — IFRS 18, Presentation and Disclosure in Financial Statements. Reference for effective-dated presentation policies where applicable.  Open reference S9"}, {"kind": "paragraph", "text": "[S10] IAASB — ISA 220 (Revised), Quality Management for an Audit of Financial Statements. Engagement-level audit quality reference.  Open reference S10"}, {"kind": "paragraph", "text": "[S11] IAASB — ISQM 2, Engagement Quality Reviews. Reference for conditional quality-review requirements.  Open reference S11"}, {"kind": "paragraph", "text": "[S12] Perfex module basics. Module structure, lifecycle and extension guidance.  Open reference S12"}, {"kind": "paragraph", "text": "[S13] STE project-linked journal and reporting entry points. Accounting controller reference for project association, journal actions and accounting reports.  Open reference S13"}, {"kind": "paragraph", "text": "[S14] Perfex staff permissions. Base CRM permission model; target entity/workflow restrictions are specified separately in this document.  Open reference S14"}, {"kind": "paragraph", "text": "The following twelve catalogue entries preserve the codebase's intended service coverage. Their task definitions are configurable templates; the target requirements extend them with explicit inputs, review, and deliverables. Not every service uses a TB or financial-statement audit. All services use the common acceptance, terms, access, versioning, review, release, and retention controls. [S2]"}]}], "lifecycle": [{"id": "LC-01", "title": "Capture the inquiry", "section": 6, "blocks": [{"kind": "paragraph", "text": "Entry and owner. A web form, referral, phone call, email, event, or authorized manual entry creates an inquiry owned by the relationship team."}, {"kind": "paragraph", "text": "Required inputs. Contact name; business or individual name; one valid contact channel; inquiry source; service interest; jurisdiction or “not yet established”; received timestamp; privacy notice acknowledgement where collected through a public form. Optional inputs. Registration number, website, preferred language, referral partner, estimated turnover band, target completion date, location, and a non-sensitive introductory attachment."}, {"kind": "paragraph", "text": "Mandatory processing. Validate contact formats and source; rate-limit public submissions; normalize names and domains; search candidate duplicates by registration/contact details; assign an owner and response target; create the lead and original inquiry record. Marketing consent is separate from service communication permission."}, {"kind": "paragraph", "text": "Optional processing. Route by service, language, office, or referral; send a scheduling link; enrich public company data with source attribution. Public forms shall not request sensitive beneficial-owner identity scans at this stage."}, {"kind": "paragraph", "text": "Transformation and exit. Raw submission → normalized Lead + Contact candidate + source/consent record + screening task. The original submission remains immutable. Suspected duplicates go to human resolution, not automatic destructive merging. Lead enters Screening after assignment. Automated acknowledgement contains a reference, not a claim of engagement acceptance. [S5]"}]}, {"id": "LC-02", "title": "Initial screening and duplicate resolution", "section": 6, "blocks": [{"kind": "paragraph", "text": "Required inputs. Lead ID; service fit; requested deadline; industry; jurisdiction; duplicate assessment; assigned screener. Conditional inputs. Conflict-screening names and immediate independence concerns where assurance is requested. Optional inputs. Initial fee range, estimated transaction volume, and preliminary records-quality assessment."}, {"kind": "paragraph", "text": "Mandatory steps. Confirm contactability; check whether the firm offers the service and can meet the timetable; determine whether the lead is new, an existing client requesting another service, or a duplicate. Preserve source attribution when linking duplicate inquiries. Record rejection/defer reasons without exposing confidential internal assessments to the prospect."}, {"kind": "paragraph", "text": "Review and outputs. The relationship owner approves Qualified for discovery, More information, Deferred, or Disqualified. A duplicate merge requires an authorized reviewer, a surviving ID, field-level conflict decisions, and retained aliases/history. Existing clients receive a new opportunity linked to the same client, not a second client identity."}, {"kind": "paragraph", "text": "Automation. Create discovery task and reminders; stop proposal automation for disqualified leads; keep a consent-aware follow-up date for deferred leads. Reopened leads return through current screening rather than inherit expired qualification."}]}, {"id": "LC-03", "title": "Discovery and service definition", "section": 6, "blocks": [{"kind": "paragraph", "text": "Required inputs. Legal entities in scope; services; objectives and intended users; reporting/assessment period; deadline; responsible client contact; current accounting environment; approximate scale; expected deliverables; reason for seeking the service. Conditional inputs. Prior auditor/accountant, regulated status, group structure, external-bookkeeping system, audit requirements, inventory locations, payroll size, and cross-border operations. Optional inputs. Site visit, prior reports, process diagrams, and an early data sample."}, {"kind": "paragraph", "text": "Mandatory steps. Hold and record the discovery discussion; confirm client expectations; distinguish bookkeeping, preparation, audit, and advisory services; identify access needs and management responsibilities; identify specialist skills; prepare a scoped service brief with inclusions, exclusions, assumptions, dependencies, timeline, and cost basis."}, {"kind": "paragraph", "text": "Review. Engagement manager validates technical scope and deliverability. Assurance requests also receive a preliminary independence assessment. No firm commitment is made solely by a salesperson selecting an audit service."}, {"kind": "paragraph", "text": "Transformation. Lead information → versioned Discovery brief → draft Opportunity/service lines → acceptance questionnaire selection → resource estimate. Recording one entity for billing does not imply that all group entities are engagement subjects."}, {"kind": "paragraph", "text": "Exit and automation. Discovery approved creates a formal evaluation case. Missing records or unrealistic deadlines produce a clarification task and revised estimate, not an invented completion date."}]}, {"id": "LC-04", "title": "New-client evaluation and acceptance", "section": 6, "blocks": [{"kind": "paragraph", "text": "Required inputs. Completed applicable questionnaire from section 7; evidence checklist; entity/ownership identifiers; service scope; conflicts and independence assessments; competence/capacity assessment; commercial viability; appointed approver. Conditional inputs. Identity verification, beneficial ownership, PEP/sanctions checks, predecessor communication, regulator requirements, and enhanced due diligence according to jurisdiction and service."}, {"kind": "paragraph", "text": "Mandatory steps. Verify supplied information; classify inherent client/engagement risk under an approved policy; document discrepancies; identify safeguards and unresolved items; obtain compliance review and partner acceptance. Automated scores produce a recommendation only. They cannot override a prohibited relationship or perform professional acceptance autonomously."}, {"kind": "paragraph", "text": "Optional steps. Additional director interviews, site inspection, specialist consultation, third-party verification, and reference checks, with consent and lawful basis where required."}, {"kind": "paragraph", "text": "Review and gate. Coordinator prepares → Compliance checks → Partner accepts, accepts with permitted conditions, requests more information, or declines. Conditional acceptance has an owner, deadline, and activation restrictions. A service that creates a prohibited independence relationship is not unlocked by a warning acknowledgement. [S8]"}, {"kind": "paragraph", "text": "Transformation. Questionnaire answers + evidence → immutable Acceptance snapshot + decision + permitted services/entities + conditions + next review date. Only accepted scope proceeds to a binding engagement. Declined records follow the approved retention/privacy policy."}]}, {"id": "LC-05", "title": "Scope, pricing, proposal, and negotiation", "section": 6, "blocks": [{"kind": "paragraph", "text": "Required inputs. Accepted service scope; entity list; deliverables; periods; client responsibilities; milestones; fee model; currency; taxes where applicable; payment terms; proposal validity; exclusions; assumptions; pricing approver. Optional inputs. Alternative packages, discounts, retainers, capped time charges, travel, training, and additional-work rates."}, {"kind": "paragraph", "text": "Mandatory steps. Estimate effort by role; apply approved rates; calculate fees and taxes; check margin/discount authorization; generate versioned proposal; obtain internal approval; issue to the authorized contact; record sent, viewed where available, accepted, declined, or expired status."}, {"kind": "paragraph", "text": "Negotiation. Each change creates a new version and comparison. Changes to services, entities, independence, deadlines, or financial responsibility re-enter the relevant assessment. Prior versions remain superseded, not overwritten. Internal pricing notes are never included in client outputs."}, {"kind": "paragraph", "text": "Transformation and gate. Approved opportunity → proposal lines and terms → client acceptance evidence → engagement-letter draft. Client acceptance is tied to proposal version and signatory authority. It does not itself activate professional work or create financial postings."}, {"kind": "paragraph", "text": "Automation. Expiry reminders and follow-up tasks are allowed. Automatic price discounts, binding scope expansion, and self-approved fee write-offs are not. An expired acceptance requires revalidation or reissue."}]}, {"id": "LC-06", "title": "Engagement letter and contractual authorization", "section": 6, "blocks": [{"kind": "paragraph", "text": "Required inputs. Accepted proposal/version; approved client acceptance; legal names; service/period; reporting framework; intended users; roles of management and firm; deliverables; fees; confidentiality and data terms; information-access obligations; agreed timetable; termination terms; authorized signatories. Conditional inputs. Group components, specialist reliance, subcontractor/data-processing terms, regulatory clauses, and engagement-specific assurance language."}, {"kind": "paragraph", "text": "Mandatory steps. Generate the correct service template; reconcile it to the approved proposal; obtain partner/authorized commercial review; verify signatory authority; collect client and firm signatures where required; preserve signed document hash, evidence, and version; record effective period and renewal basis."}, {"kind": "paragraph", "text": "Optional steps. Wet signature upload with verification, approved external e-signature provider, annexed service schedules, or a separately negotiated data-processing agreement."}, {"kind": "paragraph", "text": "Gate. Unsigned, expired, materially changed, or mismatched terms block activation. Preliminary administrative collection may be permitted under documented policy, but is not commencement of an audit. An extension requires authorized addendum; a new service may require a new letter."}, {"kind": "paragraph", "text": "Transformation. Approved proposal + acceptance → binding terms snapshot + contract record + engagement eligibility. The firm shall distinguish an electronic signature from a scanned signature image and retain whatever identity/intent evidence the chosen method requires."}]}, {"id": "LC-07", "title": "Convert to client and activate portal", "section": 6, "blocks": [{"kind": "paragraph", "text": "Required inputs. Approved acceptance; signed effective terms; validated legal entities; primary contact; billing identity; firm relationship owner; contact authorization matrix; communication language. Conditional inputs. Deposit confirmation if contractual, portal access consent, multi-entity delegation, and designated data owner. Optional inputs. Secondary billing contact, SSO, backup signatory, and notification subscriptions."}, {"kind": "paragraph", "text": "Mandatory steps. Convert or link the lead once; preserve mapped custom fields and source IDs; create client and entity records; separate billing contacts from management signatories; assign staff; provision least-privilege portal invitations; verify contact channel and MFA according to policy; test accessible entities/projects; complete welcome and handover checklist."}, {"kind": "paragraph", "text": "Review and transformation. Onboarding coordinator prepares; manager verifies entity/contact mapping and activation conditions. Lead → Client + Entities + Contacts + approved grants + onboarding checklist. One individual may have different roles for different entities. Corporate email domain membership alone does not grant access."}, {"kind": "paragraph", "text": "Exit. Relationships become Active only after gates pass. Invitations have expiry and revocation. Failed invitations remain Pending invitations; they are not treated as active users. A rejected invitation can be reissued without duplicating the contact."}]}, {"id": "LC-08", "title": "Annual validation and continuance", "section": 8, "blocks": [{"kind": "paragraph", "text": "Trigger and owner. The next review date, a configured pre-year-end interval, a new service, or a material change creates a continuance case. Recommended scheduling default: initiate 90 days before year-end, with the actual timetable approved per client. The relationship remains active for existing authorized work unless a specific restriction is applied."}, {"kind": "paragraph", "text": "Required inputs. Prior approved client/entity snapshot; latest annual questionnaire; actual and forecast financial metrics; updated ownership/control and contacts; prior findings; current service plan; responsible reviewer. Conditional inputs. Renewed identity/registration evidence, revised regulatory tests, updated independence checks, predecessor or group-component information, and new engagement terms. Optional inputs. Client satisfaction feedback and future advisory interests."}, {"kind": "paragraph", "text": "Mandatory steps. Compare field by field; compute absolute and percentage changes; evaluate effective-dated threshold rules; identify scope, disclosure, filing, staffing, or fee changes; verify new evidence; review continuance; record approval or restrictions. Prior-year zero values produce an absolute change and “percentage not meaningful,” not division by zero. Currency and measurement-window differences are normalized or flagged for review before comparison."}, {"kind": "paragraph", "text": "Transformation. Prior snapshot + attested new answers → Delta report + obligation changes + new annual snapshot + continuance decision. A threshold flag is an assessment task until a qualified reviewer confirms its applicability; turnover growth alone does not establish a legal obligation."}, {"kind": "paragraph", "text": "Gate and automation. Partner approves continuance and any new conditions. The next engagement may be prepared in Draft while review is open, but cannot activate without current authorization. Reminders escalate to the relationship owner and manager. Old sign-offs, completed tasks, signatures, and prior conclusions are never copied as current-year evidence."}]}, {"id": "LC-09", "title": "Create the engagement and service plan", "section": 8, "blocks": [{"kind": "paragraph", "text": "Required inputs. Active client; entity or explicit group scope; accepted service; financial period or assessment dates; signed terms; accounting mode; engagement manager; partner/lead auditor for assurance; reviewer; deadline; deliverables; template version; confidentiality; budget. Conditional inputs. EQR determination, specialist team, branch/component scope, tax authorization, engagement-specific access grants, and deposit gate."}, {"kind": "paragraph", "text": "Mandatory steps. Create one engagement ID linked to one Perfex project; bind the legal scope and period; instantiate applicable task/workpaper/PBC templates; assign responsibilities; calculate dates against the business calendar; identify dependencies; create initial strategy/summary/opinion/announcement objects only where relevant to the service."}, {"kind": "paragraph", "text": "Optional steps. Copy the previous year's structure, links to permanent-file documents, account mappings, and standing client preferences. Every copied item carries “requires current-period confirmation.” Annual numeric balances, sample selections, approval dates, review clearance, and signed conclusions are excluded from roll-forward."}, {"kind": "paragraph", "text": "Review and gate. Manager reviews scope, budget, schedule, and permissions; partner approves assurance scope and resourcing. Changes after activation use a change request with impact on fees, deliverables, and deadlines. Staff can have parallel tasks, but downstream approval gates remain enforced."}, {"kind": "paragraph", "text": "Transformation. Contract service lines → Engagement + Project link + scope snapshot + team + milestones + task instances + PBC request plan. A create retry returns the same engagement rather than multiplying projects. Template updates affect future instances unless expressly adopted."}]}, {"id": "LC-10", "title": "Planning, strategy memorandum, materiality, and announcement", "section": 8, "blocks": [{"kind": "paragraph", "text": "Required inputs for audit. Engagement scope; approved entity profile; preliminary TB or financial metrics; prior reports and findings; business/process understanding; applicable reporting/auditing framework; team; timetable. Conditional inputs. Inventory attendance, bank confirmations, group instructions, specialist work, fraud considerations, significant estimates, IT controls, and EQR plan. For non-audit services, use the service-specific project plan rather than artificial audit materiality."}, {"kind": "paragraph", "text": "Mandatory steps. Document objectives, relevant assertions, significant areas, planned approach, information dependencies, communication plan, and allocation of work. Prepare the Strategy Memorandum. Record planning, interim, final, and completion stages; partner, manager, senior, and specialist assignments; engagement-specific rationale for planned procedures."}, {"kind": "paragraph", "text": "Materiality processing. Preserve source metric, source version, currency, benchmark options (revenue, profit/income, assets, net assets, or justified custom basis), percentage, calculated candidate, chosen benchmark, selection rationale, performance percentage/amount, and clearly-trivial threshold/rationale. Calculations are performed on the server using decimals. Negative/near-zero benchmarks require a considered alternative. A configured percentage is a starting point, not an automatic professional conclusion."}, {"kind": "paragraph", "text": "Review. Preparer drafts → senior reviews → manager recommends → partner approves strategy and materiality. Changes in actual results, scope, or assessed conditions create a revised materiality version and identify affected samples, workpapers, and unadjusted-difference evaluations."}, {"kind": "paragraph", "text": "Announcement letter. When required, generate the audit announcement from approved entity/engagement/team/scope data; include intended dates, locations, requested support, contact persons, and required records. Manager approves operational details; authorized signatory approves release. Delivery and client acknowledgement are tracked separately from engagement-letter acceptance."}, {"kind": "paragraph", "text": "Outputs. Approved plan and materiality snapshot → task/workpaper scope and sample parameters; approved announcement → communication record and PBC deadlines. Planning may proceed while documents are collected, but dependent procedures cannot be signed off without their required evidence. [S2, S3]"}]}, {"id": "LC-11", "title": "Issue the PBC request and receive documents", "section": 9, "blocks": [{"kind": "paragraph", "text": "Required inputs. Engagement/period; request template; document category; description; expected period/entity; assigned client contributor; firm owner; due date; confidentiality; acceptance criteria. Conditional inputs. Required bank accounts, tax registrations, locations, ledger formats, confirmation addresses, and signatory evidence. Optional inputs. Preferred file layout, example template, recurring request, and links to unchanged permanent-file documents."}, {"kind": "paragraph", "text": "Mandatory steps. Generate a Prepared By Client (PBC) register; remove non-applicable items through authorized review; send authenticated portal requests; receive upload or approved connector reference; validate file type, size, readable structure, ownership and scope; record immutable file version and hash; assign category and request; check completeness, period coverage, legibility, and totals against the request."}, {"kind": "paragraph", "text": "States. Requested → Awaiting client → Uploaded → Under validation → Accepted, or Rejected/resubmission requested. A received file is not automatically accepted. A request can require several documents; each has its own version and reviewer."}, {"kind": "paragraph", "text": "Transformation. Uploaded bytes + source metadata → Document version + request linkage + validation results + workpaper references. Original bytes are retained; normalized extracted data becomes a separate derivative with parser version and lineage. No automatic renaming overwrites an existing file."}, {"kind": "paragraph", "text": "Review and automation. Coordinator validates administrative completeness; accountant/auditor validates technical adequacy. Accepted documents unlock only their dependent tasks. Reminders include the outstanding items, due date, and responsible contact; avoid unnecessary sensitive data in email. A client can see its requests and permitted files, not internal workpaper notes or unrelated entities."}]}, {"id": "LC-12", "title": "Resolve missing data and client queries", "section": 9, "blocks": [{"kind": "paragraph", "text": "Required inputs. Query ID; related request/workpaper/account; precise question; reason; client-visible wording; owner; due date; required evidence; blocking classification. Optional inputs. Meeting request, structured response options, or permitted temporary estimate."}, {"kind": "paragraph", "text": "Mandatory steps. Open a query rather than embed the only request in a document comment; notify the assigned client contact; preserve each response; validate the reply against the question; accept, request clarification, or reopen. Internal review notes can spawn a client query, but internal judgments and restricted assessments are not exposed automatically."}, {"kind": "paragraph", "text": "Review and outputs. The original issuer or authorized independent reviewer clears the query. The client's “answered” action does not mean “resolved.” Accepted response → updated source/evidence version → affected calculation/workpaper marked for reconsideration. The system records which dependencies were satisfied."}, {"kind": "paragraph", "text": "Exceptions. Missing documents can result in alternative procedures, revised timetable, limited deliverable, or withdrawal only through the authorized professional decision. Any approved estimate is flagged, quantified, explained, and revisited. Time pressure cannot silently mark a mandatory evidence requirement complete."}]}, {"id": "LC-13", "title": "Import and validate financial data", "section": 10, "blocks": [{"kind": "paragraph", "text": "Required batch metadata. Tenant/entity; engagement; financial period; accounting mode; source system; source file/version; original file hash; as-of date or movement range; currency; TB convention; parser/layout version; importer; batch key. Conditional metadata. Functional/presentation currencies, exchange-rate source, department/cost-centre dimensions, opening/closing period convention, prior-year restatement status, and authorized migration cut-off."}, {"kind": "paragraph", "text": "Required TB row fields. Source account code and name; current balance as debit/credit or explicitly declared signed balance; source row number; currency when multiple currencies are supplied. A signed-balance file shall declare “debit positive” or “credit positive.” Optional or conditional fields. Opening debit/credit, period movements, closing debit/credit, prior comparatives, account type, parent, dimensions, source reference, and narrative. Account type and reporting mapping become mandatory before reporting acceptance."}, {"kind": "paragraph", "text": "Required transaction fields for detailed GL import. External transaction ID or reproducible fingerprint; account code; transaction date; description; debit/credit; currency; source document reference; opening-balance context. Counterparty, due date, tax code, FX rate, reconciliation state, project/cost centre, and subledger IDs are conditional to the source and service."}, {"kind": "paragraph", "text": "Mandatory processing. Stage without posting; detect layout; validate dates/decimals/currency; preserve account-code zeros; reject incompatible entity/period; detect duplicate batches and transactions; check opening + debit movements − credit movements = closing under the declared convention; check TB debits = credits; identify missing mappings and anomalous signs; compare prior closing to current opening; report every row outcome."}, {"kind": "paragraph", "text": "Duplicate policy. Duplicate account rows may be legitimate by dimension/currency. Aggregate only under an explicit mapping rule; preserve the component rows. Re-uploading identical content returns the existing batch. A corrected file becomes a new batch with an explicit supersession relationship."}, {"kind": "paragraph", "text": "Review and gate. Preparer resolves errors; senior reviews control totals, mappings, reconciliation to source, and import purpose. Only an approved batch becomes the active source snapshot. No unexplained difference is hidden in a suspense account or rounding plug. Accepted “not applicable” cases require a reason and authorized reviewer."}, {"kind": "paragraph", "text": "Outputs. Raw file → Staged rows → normalized account balances/transactions → Validation results → approved TB snapshot or posting candidates. A TB snapshot used for audit is not automatically an opening-balance journal. A closing TB loaded to establish books must not also be added to the same period's detailed GL and double-counted."}]}, {"id": "LC-14", "title": "Map accounts and establish the reporting basis", "section": 10, "blocks": [{"kind": "paragraph", "text": "Required inputs. Approved source account list; entity chart/version; account classification; reporting framework/version; report-line mapping; period; material accounts; control-account designations. Conditional inputs. Note mappings, cash-flow categories, tax treatment, inventory/asset/payroll control accounts, consolidation mapping, and FX policy. Optional inputs. Departments, projects, branches, segments, budgets, and analytics tags."}, {"kind": "paragraph", "text": "Mandatory steps. Match each source account to the correct entity account; confirm type and normal balance; define parent/subaccount relationships; map each account to reporting line and disclosure schedules; validate unmapped/nonzero accounts and duplicate/conflicting mappings; compare to prior year; approve mapping version. Mapping by description alone requires human confirmation."}, {"kind": "paragraph", "text": "Data transformation. SourceAccount → EntityAccount → ReportingLine → Note/Schedule reference. A firm chart is a template, not a shared balance pool. Mapping changes restate presentation only when explicitly selected; they never rewrite original source codes or posted entries."}, {"kind": "paragraph", "text": "Review and gate. Senior reviews classification; manager approves material policy changes; partner approves significant assurance-related presentation judgments. Reporting remains blocked while required mappings are unresolved. Prior mappings may be suggested but require current-period confirmation."}]}, {"id": "LC-15", "title": "Bookkeeping and transaction posting", "section": 10, "blocks": [{"kind": "paragraph", "text": "Required inputs. Approved source transaction/document; entity; period; journal date; account IDs; balanced debit/credit lines; currency; description; creator; source-event key. Conditional inputs. Tax treatment, counterparty, due date, FX rate, subledger, cost centre, approval threshold, and external-posting authorization."}, {"kind": "paragraph", "text": "Mandatory sequence. Capture/import source → validate → propose account/tax mapping → review exceptions → obtain required approval → post atomically → update subledger/control balances → produce event and immutable posting reference. Posting requires an open period, valid entity accounts, nonnegative line amounts, and a rule preventing unintended debit and credit on the same line. At least two economically meaningful lines are required."}, {"kind": "paragraph", "text": "Office versus client processing. Perfex fee invoices/payments/expenses shall map to the firm office entity. External client invoices/bills/receipts map only to the selected client's books through its integration. Source-event uniqueness prevents repeated webhook or import posting. Cancellation of a posted source creates a linked reversal/correction, not deletion of historical ledger rows. [S4]"}, {"kind": "paragraph", "text": "Optional steps. Recurring entries, bank rules, allocation, accrual templates, automated draft mapping, and low-risk auto-posting may be enabled by an approved policy. Auto-posting still enforces balance, scope, period, duplicate, authorization, and audit-trail controls and routes exceptions for review."}, {"kind": "paragraph", "text": "Outputs and gate. Posted journal + immutable lines + source lineage + reconciliation eligibility. Any header/line/subledger failure rolls back the posting as a unit. Bookkeeping work for an audit client requires an approved independence determination; management retains decision responsibility."}]}, {"id": "LC-16", "title": "Reconcile accounts and prepare schedules", "section": 10, "blocks": [{"kind": "paragraph", "text": "Required inputs. Entity/period; active TB/GL version; supporting statement/subledger; reconciliation type; preparer; reviewer; cut-off; tolerance policy. Conditional inputs. Bank opening/ending balance, uncleared transactions, confirmations, inventory count, assets roll-forward, ageing, tax returns, loan schedules, payroll registers, and intercompany counterparties."}, {"kind": "paragraph", "text": "Mandatory steps. Tie the GL balance to the approved TB; derive independent supporting balance; compare; classify each reconciling item as timing, error, omission, estimate, disputed, or unexplained; attach evidence; age outstanding items; propose an adjustment or follow-up; explain the remaining difference; submit workpaper for review."}, {"kind": "paragraph", "text": "Bank-specific processing. Statement opening + deposits − withdrawals = statement closing; compare to book balance; match using amount/date/reference rules with confidence and human exceptions; record outstanding checks/deposits, charges, interest, and transfers. An unmatched bank feed transaction does not disappear when a reconciliation is marked complete. Cross-bank transfers require both sides and prevent duplicate expense recognition."}, {"kind": "paragraph", "text": "Control-account processing. AR/AP ageing ties to control accounts; fixed assets reconcile opening cost/depreciation, additions, disposals, charges, impairment, and closing values; inventory reconciles quantities and valuation; payroll ties gross-to-net, deductions, liabilities, and bank payments; taxes tie computation, returns, payments, and ledger; loans/leases tie principal, interest, maturities, and covenants; equity and related parties tie authorized movements and disclosures."}, {"kind": "paragraph", "text": "Review and transformation. Supporting evidence + GL → reconciliation version + reconciling items + proposed AJEs + reviewer conclusion. Senior clears only explained/treatment-approved differences; material unresolved matters remain blocking. Cleared workpapers are invalidated by a changed source balance or related adjustment."}]}, {"id": "LC-17", "title": "Propose, approve, and resolve adjusting entries", "section": 10, "blocks": [{"kind": "paragraph", "text": "Required inputs. Adjustment reference; entity/engagement/period; type; reason; affected accounts; debits/credits; evidence/workpaper; source snapshot; preparer; anticipated statement/disclosure effect. Conditional inputs. Reversal date, tax effect, FX basis, client management approval, external-posting authority, and restatement rationale. Optional inputs. Recurring schedule or group-consolidation reference."}, {"kind": "paragraph", "text": "Types. Correction, accrual, depreciation/amortization, estimate, reclassification, tax, opening-balance correction, prior-period restatement, or consolidation-only adjustment. Audit-only AJEs remain distinct from operational ledger journals."}, {"kind": "paragraph", "text": "Mandatory sequence. Draft → server validation → independent technical review → manager approval if threshold/type requires → client management acceptance where it changes their accounts → posting or inclusion in the reporting adjustment layer by authorized actor. Rejected/withdrawn items retain their explanation; they are not silently dropped."}, {"kind": "paragraph", "text": "Integrity rules. Debits equal credits in functional currency at approved precision. Foreign-currency differences use explicit balancing/FX lines where required. Date and accounts belong to the same entity and permitted period. The preparer cannot approve their own adjustment. An approved entry edited before posting returns to Draft and requires new approval. Posted entries are reversed and replaced, never overwritten."}, {"kind": "paragraph", "text": "Unadjusted differences. Record amount, account/assertion, cause, quantitative/qualitative significance, tax effect, prior-year accumulation where relevant, management's reason, and the partner's conclusion. A resolved audit conclusion may retain an uncorrected difference; “all adjustments resolved” does not mean “every proposed adjustment posted.”"}, {"kind": "paragraph", "text": "Transformation. Workpaper finding → AJE version → approval → posted journal or reporting-layer adjustment → adjusted TB change → affected reconciliations/reports flagged for re-review. Exported AJEs record receipt and confirmed external-posting status. They are not marked externally posted merely because a file was downloaded."}]}, {"id": "LC-18", "title": "Assemble and validate the adjusted trial balance", "section": 10, "blocks": [{"kind": "paragraph", "text": "Required inputs. Approved unadjusted TB snapshot; approved adjustment set; posted-ledger cut-off where managed bookkeeping applies; mapping version; reporting currency; period. Conditional inputs. Prior comparatives, restatement bridge, consolidation eliminations, and FX translation. Optional inputs. Draft scenario TB, explicitly excluded from final issue."}, {"kind": "paragraph", "text": "Mandatory processing. Compute adjusted balances by account and dimension; validate debits/credits; show unadjusted, adjustment, and adjusted columns; tie control accounts and retained earnings; reconcile opening balances to the prior approved close; identify suspense/unmapped balances; document residual differences; record approved unadjusted items separately."}, {"kind": "paragraph", "text": "Accounting identity. For a debit-positive account convention: adjusted balance = approved source balance + included debit adjustments − included credit adjustments. In managed-bookkeeping mode, posted AJEs already appear in the GL-derived TB and must not be added again. In external-books mode, the reporting layer includes only adjustments not already in the active imported TB."}, {"kind": "paragraph", "text": "Review and outputs. Senior verifies arithmetic and lineage; manager approves the final adjusted TB version. Approved TB → frozen report input set. A later ledger posting or source replacement creates a newer candidate TB and invalidates dependent reports/sign-offs. It does not silently mutate the approved snapshot."}]}, {"id": "LC-19", "title": "Generate financial statements and disclosures", "section": 10, "blocks": [{"kind": "paragraph", "text": "Required inputs. Approved adjusted TB; reporting framework and effective version; entity legal details; period; functional/presentation currency; comparatives; policy choices; mapping; note checklist; preparer and reviewer. Conditional inputs. Cash-flow movements, equity roll-forward, related parties, commitments, contingencies, estimates, going concern, subsequent events, and consolidation schedules."}, {"kind": "paragraph", "text": "Mandatory steps. Generate statement of financial position, profit or loss/other comprehensive income as applicable, changes in equity, cash flows, and notes required by the selected framework; cross-reference notes; validate arithmetic, consistency, comparative presentation, statement tie-outs, and disclosure completeness; label every pre-issue package Draft."}, {"kind": "paragraph", "text": "Cash flows. Support approved direct or indirect methodology; distinguish operating, investing, and financing; reconcile opening/closing cash; separately explain FX and noncash movements; exclude noncash investing/financing transactions from cash flows while recording required disclosures. Cash flow is not derived solely by subtracting two balance sheets without movement analysis. Rules shall follow the selected effective IAS 7/reporting profile. [S7]"}, {"kind": "paragraph", "text": "Presentation. The reporting profile shall select the applicable IAS 1/IFRS 18 or other framework requirements based on the reporting period and adoption decision. It shall not treat a generic ledger report as a complete set of compliant financial statements. The IFRS Foundation identifies IFRS 18 as replacing IAS 1; implementation therefore requires version-aware report definitions rather than a permanently fixed presentation. [S9]"}, {"kind": "paragraph", "text": "Transformation. Frozen input set → Report version + statement lines + note schedules + lineage map + validation report. Each amount links to its TB accounts and AJEs. Manual disclosure text is versioned; manual numeric overrides require explicit adjustment/mapping treatment and approval, not an untraceable edited PDF."}, {"kind": "paragraph", "text": "Gate. Senior/manager review and management/partner approvals follow section 12. Consolidation, supplementary management reports, budget comparisons, or translations are optional outputs with their own reviewed scope. A report generation retry produces the same input-derived content or a recorded new renderer version."}]}, {"id": "LC-20", "title": "Preparer submission and first-level review", "section": 12, "blocks": [{"kind": "paragraph", "text": "Required inputs. Completed workpaper or reporting package; self-checklist; source links; calculations; conclusion; preparer identity; selected version; designated independent reviewer. Conditional inputs. Sampling evidence, confirmations, AJE resolution, and specialist reports. Optional inputs. Reviewer meeting or additional analytical procedure."}, {"kind": "paragraph", "text": "Mandatory preparer steps. Check scope/period; tie figures to source; verify arithmetic; attach evidence; explain exceptions; remove draft placeholders; confirm work performed; submit a fixed version. A preparer may withdraw submission before review decision, but that creates a state event."}, {"kind": "paragraph", "text": "Mandatory checker steps. Verify completeness, accuracy, classification, reconciliation, cut-off, evidence sufficiency, cross-references, policy consistency, and significant movements. Raise separate review points with exact workpaper/version/location, issue, required action, severity, owner, and due date. Classify whether the point blocks the workpaper, report, or entire engagement."}, {"kind": "paragraph", "text": "Feedback loop. Reviewer raises point → preparer responds with new evidence/version → reviewer assesses response → reviewer clears or reopens. Only the issuer or authorized qualified replacement clears the point. The preparer cannot clear it; an answered point remains open until checked. Neither side deletes the review history."}, {"kind": "paragraph", "text": "Transformation and gate. Submitted workpaper → reviewed version + point register + clearance evidence. All blocking points must be cleared or replaced by a documented permissible professional disposition before progression. Any unresolved material matter requiring further evidence remains blocking. The gate never treats a task marked “Done” as a review signature."}]}, {"id": "LC-21", "title": "Engagement-manager review", "section": 12, "blocks": [{"kind": "paragraph", "text": "Required inputs. First-level-cleared workpapers; adjusted TB; draft financial statements/relevant deliverables; review-point register; scope completion; budget/deadline status; AJE/unadjusted-difference registers; significant matters. Conditional inputs. Specialist evaluation, group conclusions, tax exposures, going concern, subsequent events, and independence updates."}, {"kind": "paragraph", "text": "Mandatory steps. Check that performed work matches signed scope and approved plan; review significant balances and judgments; evaluate uncorrected items individually and collectively; confirm cross-workpaper consistency; verify disclosure completeness and statement tie-outs; evaluate client responses; ensure required consultations occurred; prepare/approve the summary memorandum."}, {"kind": "paragraph", "text": "Optional steps. Additional senior or specialist review for complex areas; a completion meeting; additional evidence requests. These actions create tasks with clear owners and do not erase prior completed work."}, {"kind": "paragraph", "text": "Decision and transformation. Manager approves for management clearance, returns specific areas, or escalates to the partner. Return resets only dependent statuses where possible. The manager's decision records the precise TB, report, mapping, and workpaper versions reviewed. Budget overrun is handled commercially, not by suppressing necessary procedures."}]}, {"id": "LC-22", "title": "Client management clearance and approval of accounts", "section": 12, "blocks": [{"kind": "paragraph", "text": "Required inputs. Internally reviewed draft package; management action list; proposed adjustments; unadjusted-difference summary where relevant; authorized management signatory; exact draft version. Conditional inputs. Written representations, board approval, filing mandate, related-party/going-concern/subsequent-events confirmations, and signed acceptance of adjustments."}, {"kind": "paragraph", "text": "Mandatory steps. Present factual queries and draft accounts securely; explain proposed adjustments; obtain management decisions; record approved financial statements and representations; resolve factual corrections; identify any proposed changes affecting professional conclusions. Client management approves its accounts and responsibilities, not the independence or result of the auditor's opinion."}, {"kind": "paragraph", "text": "Iteration. A substantive client change creates a new document/TB/AJE version, routes affected work back through senior/manager review, and then obtains fresh management approval. An unchanged acknowledgement records receipt but does not replace explicit approval."}, {"kind": "paragraph", "text": "Transformation and gate. Reviewed draft + authorized management decisions → management-approved financial-statement version + representation/approval evidence + resolved action list. Representations do not replace other necessary audit evidence. Missing required approval or representations prevent final release and require partner disposition."}]}, {"id": "LC-23", "title": "Partner / lead-auditor final review and EQR", "section": 12, "blocks": [{"kind": "paragraph", "text": "Required inputs. Manager completion conclusion; approved current acceptance/independence; completed procedures; resolved review register; approved adjusted TB; financial statements and disclosures; management approval; proposed report; significant judgments; subsequent-events conclusion; exact report-package manifest. Conditional inputs. EQR, technical consultation, legal advice, group-component conclusions, required representations, and regulator-specific release checks."}, {"kind": "paragraph", "text": "Mandatory partner steps. Evaluate whether sufficient appropriate evidence supports the conclusion; review significant judgments, AJEs/unadjusted differences, going concern, subsequent events, related parties, scope limitations and reporting implications; verify management approval; approve the exact opinion/report and dated issue package through an authenticated signing action. The report date is selected by the authorized professional after required preconditions are satisfied; no backdating is generated by workflow automation."}, {"kind": "paragraph", "text": "EQR branch. The firm determines EQR applicability under its quality-management policy. Where required, appoint an eligible reviewer, record their evaluation and cleared matters, and obtain completion before report release. EQR completion is not a replacement for partner responsibility and is not management's approval. [S10, S11]"}, {"kind": "paragraph", "text": "Final feedback loop. Partner/EQR raises matter → manager assigns rework → preparer revises → independent reviewer clears → manager re-approves → management re-approves if accounts changed → partner/EQR reconsider affected matters. The system prevents stale approvals from surviving a changed package."}, {"kind": "paragraph", "text": "Outputs and gate. Partner authorization + required EQR completion + approval manifest → Release authorized. A different person may perform administrative dispatch, but cannot replace or edit authorized content. For non-assurance services, an authorized service partner approves the deliverable with the appropriate conclusion language instead of an audit opinion."}]}, {"id": "LC-24", "title": "Issue, deliver, and submit where contracted", "section": 13, "blocks": [{"kind": "paragraph", "text": "Required inputs. Release-authorized immutable package; recipient list; permitted channel; final report identifiers; delivery owner; approvals and manifest. Conditional inputs. Regulatory filing mandate, credentials held by an approved provider, filing format, submission deadline, wet-original handling, or translation approval. Optional inputs. Management letter, presentation meeting, supplementary schedules, and printed copies."}, {"kind": "paragraph", "text": "Mandatory steps. Verify package hashes against authorization; render/finalize the exact approved documents; apply final identifiers and signature evidence; record issue event; publish to restricted portal or approved delivery channel; notify recipients; track delivered, failed, viewed where supported, and acknowledged separately. Email delivery success is not proof that a person read the document."}, {"kind": "paragraph", "text": "Filing branch. Validate authority and schema → obtain required management/partner release → submit → record transaction/receipt ID → confirm accepted or rejected → resolve rejection → resubmit a versioned correction. A submission receipt does not necessarily equal regulator acceptance; preserve both states. Manual filing evidence is supported when no authorized API exists."}, {"kind": "paragraph", "text": "Transformation. Authorized report package → Issued package + delivery attempts + client acknowledgement + filing records. Audit working papers are excluded from client delivery unless release is expressly authorized under policy and law. Recipient changes require an access/authorization check."}, {"kind": "paragraph", "text": "Exceptions. Dispatch failures create retry tasks without changing the signed report. A content error discovered after issue requires controlled reissue under LC-26; replacing the portal file under the same version is not permitted."}]}, {"id": "LC-25", "title": "Assemble, lock, retain, and renew the file", "section": 13, "blocks": [{"kind": "paragraph", "text": "Required inputs. Issued package; partner release; cleared review record; final workpaper index; source/TB/AJE lineage; communications; delivery evidence; archive policy; records owner. Conditional inputs. Filing acceptance; outstanding future-management actions; legal hold; permanent-file items; regulator inspection requirements."}, {"kind": "paragraph", "text": "Mandatory steps. Complete the administrative file-assembly checklist within the approved standards/jurisdiction deadline; verify all workpapers and evidence links; retain version and approval history; distinguish draft superseded artifacts from required evidence; create a manifest/checksum; lock the archive; restrict access; confirm backup and restore eligibility; record archive completion separately from report issue."}, {"kind": "paragraph", "text": "Retention. The approved policy determines category, start event, duration, permitted archival media, geography, access, legal holds, and disposition approval. A legal hold overrides normal deletion. The system shall not hard-code one retention duration for all services and jurisdictions."}, {"kind": "paragraph", "text": "Transformation. Completed engagement → locked archive + immutable manifest + permanent-file updates + next-year validation trigger + reusable structure. Only approved reusable structure rolls forward. Prior opinions, signatures, review clearances, and dates remain historical."}, {"kind": "paragraph", "text": "Renewal branch. Relationship owner reviews satisfaction, outstanding agreed actions, new service needs, next-period deadlines, and continuance date. Future recommendations become explicitly scoped tasks or new opportunities, not unbilled assumed obligations. Archived engagement remains read-only while a new engagement receives a new ID."}]}, {"id": "LC-26", "title": "Post-issue changes, suspension, termination, and handover", "section": 13, "blocks": [{"kind": "paragraph", "text": "Reopening inputs. Original issued/archived package; reason; discovered fact/change; affected entities/periods; proposed action; authorized partner; retention/legal requirements. Reopening is approved, time-limited, and scoped. Preserve original issue; create a new version; reperform affected procedures, reviews, management approvals, and partner/EQR checks; mark supersession; issue a new delivery/filing record. Previously issued copies remain discoverable with their status."}, {"kind": "paragraph", "text": "Suspension inputs. Reason, scope, start date, client communication, deadlines, billing treatment, responsible owner, and restart conditions. Suspend selected services rather than all entities unless required. Disable new processing where instructed but preserve records and required access. Restart requires verification that conditions and acceptance/terms remain valid."}, {"kind": "paragraph", "text": "Termination inputs. Client/firm request, authorized decision, legal/contractual basis, effective date, outstanding work/deadlines, handover recipient, retention obligations, and access plan. Partner approves professional disposition; billing resolves commercial balances separately; records staff prepare an authorized handover."}, {"kind": "paragraph", "text": "Mandatory handover. Identify documents owned by the client versus firm workpapers; obtain release authority; export approved books, mappings, relevant documents, and manifest; verify recipients; deliver securely; obtain receipt where possible; revoke portal/API/third-party access at the approved effective time; cancel future jobs and invitations; preserve legally required records; record final relationship status."}, {"kind": "paragraph", "text": "Deletion branch. Retention expiry creates a disposition request; legal hold and policy are checked; authorized records approver approves; data and derived search/cache copies are disposed of according to policy; a minimal disposition certificate remains. Backup expiry and any restored-data suppression are handled under the approved backup policy. Termination does not equal immediate deletion."}]}], "services": [{"title": "17.1 External audit", "blocks": [{"kind": "paragraph", "text": "M inputs: approved audit terms, entity/period, reporting framework, management responsibility, TB/GL, statements, and evidence relevant to scoped assertions. C inputs: inventory attendance, confirmations, group components, specialists, and EQR. O inputs: agreed management presentation."}, {"kind": "paragraph", "text": "M processing: strategy and materiality → inventory/cash/banks/receivables/payables/revenue/expenses/assets/payroll/investments/related-party procedures as applicable → fraud considerations and subsequent events → adjustments and completion → statements/report. The optional expansion to a forensic investigation requires separate authority."}, {"kind": "paragraph", "text": "Output and approval: supported audit opinion/report and required communications; senior → manager → management approval of accounts → partner and required EQR → authorized issue. Client management cannot select the opinion by acceptance button."}]}, {"title": "17.2 Internal audit", "blocks": [{"kind": "paragraph", "text": "M inputs: charter/terms, process scope, policies, process owners, control descriptions, relevant populations, and reporting sponsor. C inputs: system access, regulated controls, specialist procedures. O inputs: data analytics and workshops."}, {"kind": "paragraph", "text": "M processing: planning → controls/fraud assessment → process and transaction testing → documented observations → factual validation → management actions with owners/dates → independent conclusion → follow-up plan. Cover inventory, banking, receivables, payables, revenue, procurement, assets, payroll, investments, related parties, and policy compliance only where scoped."}, {"kind": "paragraph", "text": "Output and approval: internal-audit report, control findings, agreed actions, and follow-up status. Process-owner response does not delete the auditor's finding. Manager and authorized assurance lead approve release; follow-up independently verifies closure evidence."}]}, {"title": "17.3 Business valuation", "blocks": [{"kind": "paragraph", "text": "M inputs: subject/legal interest, valuation date, purpose, intended users, basis/premise, historical financials, ownership/capital structure, and management assumptions. C inputs: forecasts, asset valuations, debt, discount-rate inputs, market comparables. O inputs: sensitivity cases and site visits."}, {"kind": "paragraph", "text": "M processing: preliminary research → framework → financial/operational/market data collection → normalization of financials → ratio analysis → selection and application of valuation methods → sensitivities → reconciliation of approaches → report."}, {"kind": "paragraph", "text": "Output and approval: versioned valuation model and report with assumptions, limitations, and supporting sources. Independent model reviewer checks inputs/formulas; specialist/partner approves conclusion; management confirms factual inputs, not the independent valuation outcome."}]}, {"title": "17.4 Feasibility study", "blocks": [{"kind": "paragraph", "text": "M inputs: proposed venture, objectives, scope, market, capital/operating assumptions, financing plan, timeframe, and decision criteria. C inputs: technical design, environmental/social requirements, permits, and staffing assumptions. O inputs: alternative locations or technology options."}, {"kind": "paragraph", "text": "M processing: preliminary research → market, technical, financial, organizational, environmental/social analysis where applicable → scenario and sensitivity analysis → implementation dependencies → recommendation."}, {"kind": "paragraph", "text": "Output and approval: study, financial model, assumption register, options and recommendation. Domain specialists review their sections; manager integrates findings; engagement partner approves release. Forecasts are labelled as assumptions-based rather than guaranteed outcomes."}]}, {"title": "17.5 Forensic audit / investigation", "blocks": [{"kind": "paragraph", "text": "M inputs: written authority, allegation/question, scope, authorized custodians, evidence sources, handling rules, legal liaison where required, and permitted reporting recipients. C inputs: legal hold, interview authority, forensic specialist, regulator reporting requirements. O inputs:
